<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="br.it/ledwall" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>br.it/ledwall — Dirette Speciali</title>
  <style>
    :root {
      --brand-blue: #0b3d75;
      --brand-blue-dark: #072a52;
      --studio-bg: #e7ebf0;
      --studio-bg-light: #f5f7fa;
      --live-red: #e52521;
      --header-h: 44px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 25%, var(--studio-bg-light) 0%, var(--studio-bg) 75%, #d6dde6 100%);
      color: #0f172a;
    }

    /* TOPBAR UNICA CON MENU INTEGRATO */
    header.topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(var(--header-h) + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      background: linear-gradient(180deg, var(--brand-blue) 0%, var(--brand-blue-dark) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 120;
      box-shadow: 0 2px 10px rgba(7, 42, 82, 0.25);
      gap: 10px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      overflow: hidden;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--live-red);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 3px 7px;
      border-radius: 4px;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(229, 37, 33, 0.5);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 1.4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #fff;
      text-decoration: none;
      white-space: nowrap;
    }

    .brand-divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }

    .view-subtitle {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .topbar-right::-webkit-scrollbar { display: none; }

    .nav-pill {
      height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.94);
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      cursor: pointer;
    }

    .nav-pill.active {
      background: #fff;
      color: var(--brand-blue);
      border-color: #fff;
    }

    .btn-icon-only {
      height: 26px;
      padding: 0 7px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }

    body.on-air-clean .nav-pill:not(.active),
    body.on-air-clean .brand-divider { display: none; }

    body.on-air-clean #btnToggleClean {
      opacity: 0.35;
      border-color: transparent;
      background: transparent;
    }

    /* HUB CON SCORRIMENTO ORIZZONTALE (CAROSELLO TOUCH) */
    .sheets-hub {
      position: fixed;
      top: calc(var(--header-h) + env(safe-area-inset-top));
      left: 0;
      right: 0;
      bottom: 0;
      padding: 20px 0 max(22px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    .hub-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 2px solid rgba(11, 61, 117, 0.14);
      padding: 0 28px 10px;
      flex-shrink: 0;
    }

    .hub-header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      color: var(--brand-blue);
      letter-spacing: -0.5px;
    }

    .hub-meta {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* CONTENITORE SCORREVOLE ORIZZONTALE */
    .sheets-carousel {
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 20px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 8px 28px 18px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .sheets-carousel::-webkit-scrollbar {
      display: none;
    }

    .sheet-card {
      flex: 0 0 295px;
      max-width: 82vw;
      scroll-snap-align: start;
      background: #fff;
      border-radius: 20px;
      padding: 26px 24px;
      box-shadow: 0 14px 32px rgba(15, 28, 46, 0.11), 0 2px 6px rgba(15, 28, 46, 0.06);
      border-top: 7px solid var(--card-accent, #0b3d75);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .sheet-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 42px rgba(11, 61, 117, 0.2);
    }

    .sheet-card:active {
      transform: scale(0.97);
    }

    .card-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .sheet-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eff6ff;
      color: var(--card-accent, #0b3d75);
      flex-shrink: 0;
    }

    .sheet-badge {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      padding: 5px 11px;
      border-radius: 999px;
      background: #f1f5f9;
      color: var(--card-accent, #0b3d75);
    }

    .sheet-name {
      font-size: 25px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.18;
      letter-spacing: -0.5px;
      word-break: break-word;
    }

    .sheet-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--card-accent, #0b3d75);
    }

    /* VIEWER DATAWALL A SCHERMO PIENO */
    .sheet-viewer {
      position: fixed;
      top: calc(var(--header-h) + env(safe-area-inset-top));
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 22px 68px;
      display: none;
      flex-direction: column;
      z-index: 100;
      background: radial-gradient(circle at 50% 25%, var(--studio-bg-light) 0%, var(--studio-bg) 75%, #d6dde6 100%);
    }

    .sheet-viewer.active { display: flex; }

    .viewer-card {
      flex: 1;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 14px 36px rgba(15, 28, 46, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .draw-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      mix-blend-mode: multiply;
      z-index: 30;
    }

    body.draw-mode .draw-canvas {
      pointer-events: auto;
      cursor: crosshair;
      touch-action: none;
    }

    .viewer-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 14px;
      gap: 12px;
      flex-shrink: 0;
    }

    .viewer-title {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      color: var(--brand-blue);
      letter-spacing: -0.4px;
    }

    .viewer-body {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* 1. BARRE VERTICALI TV */
    .vbars-stage {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      gap: 14px;
      padding: 24px 10px 6px;
      min-height: 0;
    }

    .vbar-col {
      flex: 1;
      max-width: 140px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .vbars-stage.has-focus .vbar-col:not(.focused) { opacity: 0.22; }
    .vbar-col.focused { transform: scale(1.04); }
    .vbar-diff { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 5px; margin-bottom: 5px; white-space: nowrap; }
    .vbar-val { font-size: 23px; font-weight: 900; margin-bottom: 8px; letter-spacing: -0.5px; }
    .vbar-fill { width: 68%; max-width: 74px; border-radius: 8px 8px 2px 2px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14); min-height: 8px; }
    .vbar-label { margin-top: 10px; font-size: 14px; font-weight: 900; color: #1e293b; text-align: center; line-height: 1.2; }
    .vbar-sub { font-size: 11.5px; font-weight: 600; color: #64748b; text-align: center; margin-top: 2px; }

    /* 2. BARRE ORIZZONTALI TV */
    .hbars-list { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
    .hbar-row { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 7px; cursor: pointer; transition: opacity 0.2s; }
    .hbars-list.has-focus .hbar-row:not(.focused) { opacity: 0.24; }
    .hbar-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .hbar-track { width: 100%; height: 18px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .hbar-fill { height: 100%; border-radius: 999px; }

    /* 3. NOTIZIE IN DIRETTA */
    .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; align-content: start; }
    .news-card { background: #f8fafc; border: 1px solid #e2e8f0; border-left: 6px solid var(--brand-blue); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
    .news-card.urgent { background: #fef2f2; border-color: #fecaca; border-left-color: var(--live-red); }
    .news-card.expanded { grid-column: 1 / -1; background: #fff; border: 2px solid var(--brand-blue); border-left: 8px solid var(--live-red); box-shadow: 0 14px 34px rgba(11, 61, 117, 0.16); }
    .news-card.expanded .news-title { font-size: 24px; }
    .news-card.expanded .news-body { font-size: 17px; line-height: 1.5; }
    .news-meta-line { display: flex; align-items: center; gap: 8px; }
    .news-time { background: var(--brand-blue); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 4px; }
    .news-card.urgent .news-time { background: var(--live-red); }
    .news-tag { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.7px; color: var(--live-red); }
    .news-title { font-size: 18px; font-weight: 900; color: #0f172a; line-height: 1.25; }
    .news-body { font-size: 14px; font-weight: 500; color: #334155; line-height: 1.4; }

    /* 4. TABELLA BROADCAST */
    .tv-table-wrap { width: 100%; overflow-x: auto; border-radius: 12px; border: 1px solid #cbd5e1; }
    table.tv-table { width: 100%; border-collapse: collapse; text-align: left; }
    table.tv-table th { background: var(--brand-blue); color: #fff; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; padding: 13px 16px; white-space: nowrap; }
    table.tv-table td { padding: 13px 16px; font-size: 16px; font-weight: 700; color: #0f172a; border-bottom: 1px solid #e2e8f0; }
    table.tv-table tr:nth-child(even) td { background: #f8fafc; }
    table.tv-table tr.row-focused td { background: #fef08a; }

    /* 5. BALLOTTAGGIO / REFERENDUM */
    .ballot-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 8px 12px; }
    .ballot-cards { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; }
    .ballot-cand { background: #f8fafc; border-radius: 16px; padding: 22px; border-top: 8px solid #0b3d75; box-shadow: 0 8px 24px rgba(15, 28, 46, 0.08); }
    .ballot-vs { width: 50px; height: 50px; border-radius: 50%; background: #0b3d75; color: #fff; font-weight: 900; font-size: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
    .ballot-bar-wrap { position: relative; height: 36px; border-radius: 999px; overflow: hidden; display: flex; background: #e2e8f0; box-shadow: inset 0 2px 6px rgba(0,0,0,0.12); }
    .ballot-50-line { position: absolute; left: 50%; top: -6px; bottom: -6px; width: 3px; background: #0f172a; z-index: 5; }

    /* 6. RIPARTIZIONE SEGGI */
    .seggi-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
    .seggi-bar-box { position: relative; padding-top: 26px; }
    .seggi-maj-marker { position: absolute; left: 50%; top: 0; bottom: -8px; border-left: 2.5px dashed #0f172a; z-index: 5; padding-left: 6px; font-size: 11px; font-weight: 900; color: #0f172a; }
    .seggi-bar { height: 46px; border-radius: 10px; overflow: hidden; display: flex; background: #e2e8f0; gap: 2px; }
    .seggi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 12px; }
    .seggi-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }

    /* 7. SCRUTINIO & AFFLUENZA ORARIA */
    .aff-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 16px; align-content: center; }
    .aff-card { background: #f8fafc; border: 1px solid #e2e8f0; border-top: 6px solid #0b3d75; border-radius: 14px; padding: 20px 18px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }

    /* 8. COMUNI & QUARTIERI */
    .comuni-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; align-content: start; }
    .comune-card { background: #f8fafc; border: 1px solid #e2e8f0; border-left: 7px solid #0b3d75; border-radius: 12px; padding: 15px 18px; display: flex; flex-direction: column; gap: 6px; }

    /* 9. FORCHETTA EXIT POLL */
    .range-track { position: relative; width: 100%; height: 22px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .range-band { position: absolute; top: 0; bottom: 0; border-radius: 999px; opacity: 0.9; }

    /* DOCK IN BASSO PULITO (SOLO INDIETRO + EVIDENZIATORE) */
    .viewer-dock {
      position: fixed;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 61, 117, 0.96);
      color: #fff;
      padding: 6px 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 28px rgba(7, 42, 82, 0.35);
      z-index: 110;
      max-width: 96vw;
    }

    .dock-btn {
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .dock-btn.primary-back { background: #fff; color: var(--brand-blue); border-color: #fff; }
    .dock-btn.active-tool { background: #ffeb3b; color: #072a52; border-color: #ffeb3b; }
    .dock-sep { width: 1px; height: 18px; background: rgba(255, 255, 255, 0.22); flex-shrink: 0; }
    .color-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.5); cursor: pointer; flex-shrink: 0; }
    .color-dot.selected { transform: scale(1.2); border-color: #fff; box-shadow: 0 0 0 2px #0b3d75, 0 0 0 4px #fff; }

    .status-box { margin: auto; text-align: center; background: #fff; padding: 26px 32px; border-radius: 14px; box-shadow: 0 10px 28px rgba(11, 61, 117, 0.12); }
  </style>
</head>
<body>

  <!-- BARRA BLU UNICA CON MENU INTEGRATO -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="live-badge"><span class="live-dot"></span>LIVE</span>
      <a href="index.html" class="brand-title">br.it/ledwall</a>
      <span class="brand-divider"></span>
      <span class="view-subtitle" id="headerSubtitle">Dirette Speciali</span>
    </div>
    <div class="topbar-right">
      <a href="index.html" class="nav-pill">⌂ Regia</a>
      <a href="prime-pagine.html" class="nav-pill">Prime Pagine</a>
      <a href="sondaggi.html" class="nav-pill">Sondaggi</a>
      <a href="speciali.html" class="nav-pill active">Speciali</a>
      <button class="nav-pill" id="btnSyncNow" title="Rileggi tutti i fogli da Google">↻</button>
      <button class="btn-icon-only" id="btnToggleClean" title="Nascondi controlli in onda">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>
  </header>

  <!-- SCHERMATA 1: CAROSELLO ORIZZONTALE DI TUTTI I FOGLI -->
  <main class="sheets-hub" id="sheetsHub">
    <div class="hub-header">
      <h1>Fogli Diretta Speciale</h1>
      <span class="hub-meta" id="hubMeta">Sincronizzazione...</span>
    </div>
    <div id="hubStatus" class="status-box">Caricamento rapido fogli...</div>
    <div class="sheets-carousel" id="sheetsCarousel" style="display:none;"></div>
  </main>

  <!-- SCHERMATA 2: GRAFICA INTERATTIVA DEL FOGLIO -->
  <section class="sheet-viewer" id="sheetViewer">
    <div class="viewer-card">
      <canvas class="draw-canvas" id="drawCanvas"></canvas>
      <div class="viewer-top">
        <h2 class="viewer-title" id="viewerTitle">Titolo Foglio</h2>
        <span class="hub-meta" id="viewerTypeMeta">Diretta Speciale</span>
      </div>
      <div class="viewer-body" id="viewerBody"></div>
    </div>

    <div class="viewer-dock">
      <button class="dock-btn primary-back" id="btnBackToSheets">&#8592; Tutti i fogli</button>
      <div class="dock-sep"></div>
      <button class="dock-btn" id="btnDrawToggle">Evidenzia</button>
      <span class="color-dot selected" data-color="rgba(255, 238, 0, 0.5)" style="background:#ffee00;"></span>
      <span class="color-dot" data-color="rgba(0, 230, 118, 0.4)" style="background:#00e676;"></span>
      <span class="color-dot" data-color="rgba(255, 82, 82, 0.4)" style="background:#ff5252;"></span>
      <button class="dock-btn" id="btnClearMarks">Pulisci</button>
    </div>
  </section>

  <script>
    const PUB_KEY = "2PACX-1vSQhKtuszAe47ZCU8gtl39Ttyf1saf_0ls3ZMM4pnbvdHjCrLNULSgauI43UbunQp2eC_l3Qrpt2oNX";
    const PUBHTML_URL = `https://docs.google.com/spreadsheets/d/e/${PUB_KEY}/pubhtml`;
    const PUB_CSV_BASE = `https://docs.google.com/spreadsheets/d/e/${PUB_KEY}/pub?output=csv`;

    const PALETTE = ["#0b3d75", "#e11d48", "#16a34a", "#f59e0b", "#0284c7", "#7c3aed", "#ea580c", "#0f766e"];

    let allSheets = [];
    let currentSheet = null;

    const hubStatus = document.getElementById('hubStatus');
    const sheetsCarousel = document.getElementById('sheetsCarousel');
    const hubMeta = document.getElementById('hubMeta');
    const sheetViewer = document.getElementById('sheetViewer');
    const viewerTitle = document.getElementById('viewerTitle');
    const viewerTypeMeta = document.getElementById('viewerTypeMeta');
    const viewerBody = document.getElementById('viewerBody');
    const headerSubtitle = document.getElementById('headerSubtitle');

    const initialCache = JSON.parse(localStorage.getItem('br_ledwall_speciali_v7') || 'null');
    if (initialCache && initialCache.length) {
      allSheets = initialCache;
      renderSheetsCarousel();
    }

    function parseNum(str) {
      if (str === null || str === undefined) return null;
      const s = String(str).trim().replace('%', '').replace(/\./g, '').replace(/\s+/g, '').replace(',', '.');
      if (!s || s === '-') return null;
      const n = parseFloat(s);
      return isNaN(n) ? null : n;
    }

    function parseDecimal(str) {
      if (str === null || str === undefined) return null;
      const s = String(str).trim().replace('%', '').replace(/\s+/g, '').replace(',', '.');
      if (!s || s === '-') return null;
      const n = parseFloat(s);
      return isNaN(n) ? null : n;
    }

    function parseCSV(csvText) {
      const lines = csvText.trim().split(/\r?\n/).filter(Boolean);
      return lines.map(line => {
        const res = [];
        let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') inQ = !inQ;
          else if (c === ',' && !inQ) { res.push(cur.trim()); cur = ''; }
          else cur += c;
        }
        res.push(cur.trim());
        while (res.length > 0 && res[res.length - 1] === '') res.pop();
        return res;
      }).filter(r => r.some(c => c !== ''));
    }

    function fetchWithTimeout(url, ms = 5500) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms);
      return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(timer));
    }

    async function fetchFast(targetUrl) {
      const urlTs = targetUrl + (targetUrl.includes('?') ? '&' : '?') + 't=' + Date.now();
      const raceTasks = [
        fetchWithTimeout(urlTs, 4000).then(async r => {
          if (!r.ok) throw new Error();
          const t = await r.text();
          if (t.length < 60) throw new Error();
          return t;
        }),
        fetchWithTimeout(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(urlTs)}`, 5500).then(async r => {
          if (!r.ok) throw new Error();
          const t = await r.text();
          if (t.length < 60) throw new Error();
          return t;
        }),
        fetchWithTimeout(`https://api.allorigins.win/get?url=${encodeURIComponent(urlTs)}`, 6000).then(async r => {
          if (!r.ok) throw new Error();
          const j = await r.json();
          if (!j.contents || j.contents.length < 60) throw new Error();
          return j.contents;
        })
      ];
      return Promise.any(raceTasks);
    }

    function parsePubHtmlFull(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const sheets = [];
      const seenGids = new Set();

      const tabs = Array.from(doc.querySelectorAll('#sheet-menu li'));
      tabs.forEach((li, idx) => {
        const gid = (li.id || '').replace('sheet-button-', '').trim();
        const title = li.textContent.trim() || `Foglio ${idx + 1}`;
        let box = gid ? doc.querySelector(`[id="${gid}"]`) : null;
        if (!box) {
          const viewDivs = Array.from(doc.querySelectorAll('#sheets-viewport > div'));
          box = viewDivs[idx] || null;
        }
        const rows = [];
        if (box) {
          const table = box.querySelector('table.waffle');
          if (table) {
            table.querySelectorAll('tbody tr').forEach(tr => {
              const cells = Array.from(tr.querySelectorAll('td')).map(td => td.textContent.trim());
              while (cells.length > 0 && cells[cells.length - 1] === '') cells.pop();
              if (cells.some(c => c !== '')) rows.push(cells);
            });
          }
        }
        sheets.push({ id: gid || String(idx), title, rows });
        if (gid) seenGids.add(gid);
      });

      const scriptMatches = html.matchAll(/items\.push\(\{name:\s*"([^"]+)",\s*pageUrl:[^}]*gid=(\d+)/g);
      for (const m of scriptMatches) {
        const title = m[1];
        const gid = m[2];
        if (!seenGids.has(gid)) {
          sheets.push({ id: gid, title, rows: [] });
          seenGids.add(gid);
        }
      }

      if (!sheets.length) {
        const tables = Array.from(doc.querySelectorAll('table.waffle'));
        tables.forEach((table, i) => {
          const rows = [];
          table.querySelectorAll('tbody tr').forEach(tr => {
            const cells = Array.from(tr.querySelectorAll('td')).map(td => td.textContent.trim());
            while (cells.length > 0 && cells[cells.length - 1] === '') cells.pop();
            if (cells.some(c => c !== '')) rows.push(cells);
          });
          if (rows.length) sheets.push({ id: String(i), title: `Foglio ${i + 1}`, rows });
        });
      }

      return sheets;
    }

    async function loadAllSheets() {
      const btn = document.getElementById('btnSyncNow');
      btn.textContent = '…';
      hubMeta.textContent = 'Aggiornamento...';

      let discovered = [];

      try {
        const html = await fetchFast(PUBHTML_URL);
        discovered = parsePubHtmlFull(html);
      } catch (e) {}

      if (discovered.length > 0) {
        await Promise.all(discovered.map(async (sh) => {
          if (!sh.rows || sh.rows.length === 0) {
            try {
              const csvTxt = await fetchFast(`${PUB_CSV_BASE}&gid=${encodeURIComponent(sh.id)}`);
              const parsedRows = parseCSV(csvTxt);
              if (parsedRows.length > 0) sh.rows = parsedRows;
            } catch (e) {}
          }
        }));
      } else {
        try {
          const csvTxt = await fetchFast(PUB_CSV_BASE);
          const rows = parseCSV(csvTxt);
          if (rows.length > 0) discovered = [{ id: '0', title: 'Foglio 1', rows }];
        } catch (e) {}
      }

      if (discovered.length > 0) {
        allSheets = discovered;
        localStorage.setItem('br_ledwall_speciali_v7', JSON.stringify(discovered));
      }

      btn.textContent = '↻';
      renderSheetsCarousel();

      if (currentSheet) {
        const updated = allSheets.find(s => s.id === currentSheet.id || s.title === currentSheet.title);
        if (updated) {
          currentSheet = updated;
          renderOpenSheet();
        }
      }
    }

    function detectLayout(rows, sheetTitle = '') {
      if (!rows || rows.length === 0) return 'table';
      const a1 = (rows[0][0] || '').toUpperCase().trim();
      const titleUp = sheetTitle.toUpperCase();

      if (a1.includes('[BALLOTTAGG') || titleUp.includes('BALLOTTAGG')) return 'ballot';
      if (a1.includes('[REFEREND') || titleUp.includes('REFEREND')) return 'referendum';
      if (a1.includes('[SEGG') || titleUp.includes('SEGG') || titleUp.includes('CONSIGLI')) return 'seggi';
      if (a1.includes('[SCRUTIN') || titleUp.includes('SCRUTIN')) return 'scrutinio';
      if (a1.includes('[COMUN') || titleUp.includes('COMUN')) return 'comuni';
      if (a1.includes('[QUARTIER') || titleUp.includes('QUARTIER')) return 'quartieri';
      if (a1.includes('[FORCHETT') || titleUp.includes('PROIEZION') || titleUp.includes('EXIT')) return 'forchetta';
      if (a1.includes('[PREFERENZ') || titleUp.includes('PREFERENZ')) return 'preferenze';
      if (a1.includes('[FLUSS') || titleUp.includes('FLUSS')) return 'flussi';
      if (a1.includes('[AFFLUENZA_OR') || titleUp.includes('ORARI')) return 'affluenza_ore';
      if (a1.includes('[NOTIZI') || titleUp.includes('NOTIZI')) return 'news';
      if (a1.includes('[COLONN') || titleUp.includes('SPOGLI')) return 'vbars';
      if (a1.includes('[BARR') || titleUp.includes('AFFLUENZ')) return 'hbars';
      if (a1.includes('[TABELL') || titleUp.includes('TABELL')) return 'table';

      if (rows.length < 2) return 'table';
      const headers = rows[0].map(h => h.toUpperCase());
      if (headers.some(h => h.includes('TITOL') || h.includes('OCCHIELL') || h.includes('DETTAGL'))) return 'news';
      return 'table';
    }

    function renderSheetsCarousel() {
      if (!allSheets.length) {
        hubStatus.style.display = 'block';
        hubStatus.innerHTML = `
          <div style="font-weight:800; color:#b91c1c; margin-bottom:8px;">Connessione ai fogli non riuscita</div>
          <div style="font-size:13px; color:#475569; margin-bottom:14px;">Premi il pulsante qui sotto per riprovare.</div>

        `;
        sheetsCarousel.style.display = 'none';
        hubMeta.textContent = '0 fogli';
        return;
      }

      hubStatus.style.display = 'none';
      sheetsCarousel.style.display = 'flex';
      hubMeta.textContent = `Scorri in orizzontale • ${allSheets.length} schede`;

        const mode = detectLayout(sh.rows, sh.title);
        const info = getLayoutInfo(mode);
        const color = PALETTE[idx % PALETTE.length];
        const countRows = Math.max(0, sh.rows.length - 1);

        return `
          <div class="sheet-card" data-idx="${idx}" style="--card-accent:${color};">
            <div class="card-top-row">

            <div class="sheet-footer-row" style="color:${color};">
              <span>${countRows} ${countRows === 1 ? 'elemento' : 'elementi'}</span>

        card.addEventListener('click', () => {
          currentSheet = allSheets[parseInt(card.dataset.idx, 10)];
          openSheetViewer();

    function openSheetViewer() {
      if (!currentSheet) return;

    function extractChartItems(rows) {
      const headers = rows[0] || [];
      const dataRows = rows.slice(1);
      let numCol = 1;
      for (let c = 1; c < headers.length; c++) {
        if (dataRows.some(r => parseDecimal(r[c]) !== null)) { numCol = c; break; }
      }
      let prevCol = -1;
      for (let c = numCol + 1; c < headers.length; c++) {
        if (dataRows.some(r => parseDecimal(r[c]) !== null)) { prevCol = c; break; }
      }

      return dataRows.map((r, i) => {
        const label = r[0] || `Voce ${i + 1}`;
        const sub = numCol > 1 ? (r[1] || '') : '';
        const rawVal = r[numCol] || '0';
        const val = parseDecimal(rawVal) ?? 0;
        const prevVal = prevCol >= 0 ? parseDecimal(r[prevCol]) : null;
        const customColor = r.find(cell => /^#[0-9A-Fa-f]{6}$/.test(cell));
        return { label, sub, rawVal, val, prevVal, color: customColor || PALETTE[i % PALETTE.length] };
      });
    }

    function renderOpenSheet() {
      if (!currentSheet) return;
      viewerTitle.textContent = currentSheet.title;

        viewerBody.innerHTML = `<div style="margin:auto; color:#64748b; font-weight:700;">Questo foglio è ancora vuoto.</div>`;

        viewerTypeMeta.textContent = 'Tocca una colonna per isolarla';

        viewerBody.innerHTML = `

            ${items.map(it => {
              const hPct = Math.max(5, Math.round((it.val / (maxVal * 1.12)) * 100));

              if (it.prevVal !== null) {
                const diff = +(it.val - it.prevVal).toFixed(2);
                const bg = diff > 0 ? '#dcfce7' : diff < 0 ? '#fee2e2' : '#f1f5f9';
                const fg = diff > 0 ? '#15803d' : diff < 0 ? '#b91c1c' : '#64748b';
                const arrow = diff > 0 ? '▲ +' : diff < 0 ? '▼ ' : '• ';

        const list = document.getElementById('hbarsList');
        list.querySelectorAll('.hbar-row').forEach(row => {
          row.addEventListener('click', () => {

            list.querySelectorAll('.hbar-row').forEach(r => r.classList.remove('focused'));

              const dettaglio = r[3] || '';

              return `
                <div class="news-card ${isUrgent ? 'urgent' : ''}">
                  <div class="news-meta-line">
                    ${ora ? `<span class="news-time">${ora}</span>` : ''}
                    <span class="news-tag">${occhiello}</span>

          card.addEventListener('click', () => card.classList.toggle('expanded'));

      } else if (mode === 'ballot' || mode === 'referendum') {
        const r1 = rows[1] || ['Opzione 1', '', '50%', '', '#16a34a'];
        const r2 = rows[2] || ['Opzione 2', '', '50%', '', '#e11d48'];
        const p1 = parseDecimal(r1[2]) ?? 50;
        const p2 = parseDecimal(r2[2]) ?? 50;
        const tot = (p1 + p2) || 100;
        const w1 = Math.round((p1 / tot) * 100);
        const w2 = 100 - w1;
        const c1 = r1.find(c => /^#[0-9A-Fa-f]{6}$/.test(c)) || (mode === 'referendum' ? '#16a34a' : '#0b3d75');
        const c2 = r2.find(c => /^#[0-9A-Fa-f]{6}$/.test(c)) || '#e11d48';
        const gap = Math.abs(p1 - p2).toFixed(1).replace('.', ',');
        const quorumVal = mode === 'referendum' && r1[4] && !r1[4].startsWith('#') ? r1[4] : '';
        viewerTypeMeta.textContent = quorumVal ? `Quorum attuale: ${quorumVal} (Soglia 50% + 1)` : 'Sfida Diretta • Soglia 50%';

        viewerBody.innerHTML = `
          <div class="ballot-stage">
            <div class="ballot-cards">
              <div class="ballot-cand" style="border-top-color:${c1};">
                <div style="font-size:12px; font-weight:800; color:#64748b; text-transform:uppercase;">${r1[1] || ''}</div>
                <div style="font-size:28px; font-weight:900; color:#0f172a; margin:4px 0;">${r1[0]}</div>
                <div style="font-size:46px; font-weight:900; color:${c1}; line-height:1;">${r1[2]}</div>
                ${r1[3] && !r1[3].startsWith('#') ? `<div style="font-size:13px; font-weight:700; color:#475569; margin-top:8px;">${r1[3]}</div>` : ''}
              </div>
              <div style="text-align:center;">
                <div class="ballot-vs">VS</div>
                <div style="font-size:11px; font-weight:800; color:#64748b; margin-top:6px;">SCARTO<br>${gap} pt</div>
              </div>
              <div class="ballot-cand" style="border-top-color:${c2}; text-align:right;">
                <div style="font-size:12px; font-weight:800; color:#64748b; text-transform:uppercase;">${r2[1] || ''}</div>
                <div style="font-size:28px; font-weight:900; color:#0f172a; margin:4px 0;">${r2[0]}</div>
                <div style="font-size:46px; font-weight:900; color:${c2}; line-height:1;">${r2[2]}</div>
                ${r2[3] && !r2[3].startsWith('#') ? `<div style="font-size:13px; font-weight:700; color:#475569; margin-top:8px;">${r2[3]}</div>` : ''}
              </div>
            </div>
            <div style="position:relative;">
              <div class="ballot-50-line"></div>
              <div class="ballot-bar-wrap">
                <div style="width:${w1}%; background:${c1};"></div>
                <div style="width:${w2}%; background:${c2};"></div>
              </div>
              <div style="text-align:center; font-size:11px; font-weight:800; color:#475569; margin-top:6px;">SOGLIA MAGGIORANZA 50%</div>
            </div>
          </div>
        `;

      } else if (mode === 'seggi') {
        const dataRows = rows.slice(1);
        const items = dataRows.map((r, i) => ({
          name: r[0] || `Lista ${i + 1}`,
          seats: parseNum(r[1]) ?? 0,
          group: r[2] || '',
          color: r.find(c => /^#[0-9A-Fa-f]{6}$/.test(c)) || PALETTE[i % PALETTE.length]
        }));
        const totalSeats = items.reduce((acc, it) => acc + it.seats, 0) || 1;
        const majority = Math.floor(totalSeats / 2) + 1;
        viewerTypeMeta.textContent = `Totale: ${totalSeats} seggi • Maggioranza assoluta: ${majority}`;

        viewerBody.innerHTML = `
          <div class="seggi-stage">
            <div class="seggi-bar-box">
              <div class="seggi-maj-marker">Maggioranza: ${majority}</div>
              <div class="seggi-bar">
                ${items.map(it => {
                  const pct = (it.seats / totalSeats) * 100;
                  return `<div style="width:${pct}%; background:${it.color}; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:15px;">${it.seats > 0 ? it.seats : ''}</div>`;
                }).join('')}
              </div>
            </div>
            <div class="seggi-grid">
              ${items.map(it => `
                <div class="seggi-item" style="border-left:6px solid ${it.color};">
                  <div>
                    <div style="font-size:16px; font-weight:900; color:#0f172a;">${it.name}</div>
                    ${it.group ? `<div style="font-size:12px; font-weight:600; color:#64748b;">${it.group}</div>` : ''}
                  </div>
                  <div style="font-size:28px; font-weight:900; color:${it.color};">${it.seats}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;

      } else if (mode === 'scrutinio' || mode === 'affluenza_ore') {
        viewerTypeMeta.textContent = mode === 'scrutinio' ? 'Avanzamento spoglio e riepilogo schede' : 'Confronto orario affluenza alle urne';
        const dataRows = rows.slice(1);
        viewerBody.innerHTML = `
          <div class="aff-grid">
            ${dataRows.map((r, idx) => {
              const title = r[0] || `Dato ${idx + 1}`;
              const valStr = r[1] || '';
              const subStr = r[2] || '';
              let badge = '';
              if (mode === 'affluenza_ore') {
                const v1 = parseDecimal(valStr);
                const v2 = parseDecimal(subStr);
                if (v1 !== null && v2 !== null) {
                  const diff = +(v1 - v2).toFixed(2);
                  const bg = diff > 0 ? '#dcfce7' : diff < 0 ? '#fee2e2' : '#f1f5f9';
                  const fg = diff > 0 ? '#15803d' : diff < 0 ? '#b91c1c' : '#64748b';
                  const sign = diff > 0 ? '▲ +' : diff < 0 ? '▼ ' : '• ';
                  badge = `<span style="background:${bg}; color:${fg}; font-size:13px; font-weight:800; padding:4px 10px; border-radius:999px;">${sign}${String(diff).replace('.', ',')} pt</span>`;
                }
              }
              return `
                <div class="aff-card">
                  <div style="font-size:13px; font-weight:800; text-transform:uppercase; color:#64748b;">${title}</div>
                  <div style="font-size:36px; font-weight:900; color:#0b3d75; line-height:1.05;">${valStr}</div>
                  ${subStr ? `<div style="font-size:13px; font-weight:700; color:#475569;">${mode === 'affluenza_ore' ? 'Precedente: ' : ''}${subStr}</div>` : ''}
                  ${badge}
                </div>
              `;
            }).join('')}
          </div>
        `;

      } else if (mode === 'comuni' || mode === 'quartieri') {
        viewerTypeMeta.textContent = mode === 'comuni' ? 'Situazione nei comuni al voto' : 'Risultati per quartieri / collegi';
        const dataRows = rows.slice(1);
        viewerBody.innerHTML = `
          <div class="comuni-grid">
            ${dataRows.map((r, i) => {
              const color = r.find(c => /^#[0-9A-Fa-f]{6}$/.test(c)) || PALETTE[i % PALETTE.length];
              if (mode === 'comuni') {
                const comune = r[0] || '';
                const uscente = r[1] || '';
                const sindaco = r[2] || '';
                const partito = r[3] || '';
                const perc = r[4] || '';
                const esito = r[5] || '';
                const isRibaltone = esito.toUpperCase().includes('RIBALTON');
                return `
                  <div class="comune-card" style="border-left-color:${color};">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <span style="font-size:19px; font-weight:900; color:#0f172a;">${comune}</span>
                      ${esito ? `<span style="font-size:11px; font-weight:800; padding:3px 8px; border-radius:6px; background:${isRibaltone ? '#fee2e2' : '#dcfce7'}; color:${isRibaltone ? '#b91c1c' : '#15803d'};">${esito.toUpperCase()}</span>` : ''}
                    </div>
                    <div style="font-size:16px; font-weight:800; color:${color};">${sindaco} ${perc ? `(${perc})` : ''}</div>
                    <div style="font-size:12.5px; font-weight:600; color:#64748b;">${partito}${uscente ? ` • Uscente: ${uscente}` : ''}</div>
                  </div>
                `;
              } else {
                const zona = r[0] || '';
                const leader = r[1] || '';
                const perc = r[2] || '';
                const secondo = r[3] || '';
                const sezioni = r[4] || '';
                return `
                  <div class="comune-card" style="border-left-color:${color};">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <span style="font-size:18px; font-weight:900; color:#0f172a;">${zona}</span>
                      ${sezioni ? `<span style="font-size:11px; font-weight:800; color:#64748b;">Sez. ${sezioni}</span>` : ''}
                    </div>
                    <div style="font-size:18px; font-weight:900; color:${color};">${leader} — ${perc}</div>
                    ${secondo ? `<div style="font-size:12.5px; font-weight:600; color:#64748b;">2°: ${secondo}</div>` : ''}
                  </div>
                `;
              }
            }).join('')}
          </div>
        `;

      } else if (mode === 'forchetta') {
        viewerTypeMeta.textContent = 'Proiezioni & Exit Poll (Forchetta Min – Max)';
        const dataRows = rows.slice(1);
        const items = dataRows.map((r, i) => ({
          name: r[0] || '',
          sub: r[1] || '',
          min: parseDecimal(r[2]) ?? 0,
          max: parseDecimal(r[3]) ?? 0,
          minStr: r[2] || '0%',
          maxStr: r[3] || '0%',
          note: r[4] && !r[4].startsWith('#') ? r[4] : '',
          color: r.find(c => /^#[0-9A-Fa-f]{6}$/.test(c)) || PALETTE[i % PALETTE.length]
        }));
        const scaleMax = Math.max(...items.map(it => it.max), 60);

        viewerBody.innerHTML = `
          <div class="hbars-list">
            ${items.map(it => {
              const leftPct = Math.max(0, (it.min / scaleMax) * 100);
              const widthPct = Math.max(4, ((it.max - it.min) / scaleMax) * 100);
              return `
                <div class="hbar-row">
                  <div class="hbar-top">
                    <div>
                      <span style="font-size:18px; font-weight:900; color:#0f172a;">${it.name}</span>
                      ${it.sub ? `<span style="font-size:13px; font-weight:600; color:#64748b; margin-left:8px;">${it.sub}</span>` : ''}
                    </div>
                    <div style="font-size:20px; font-weight:900; color:${it.color};">${it.minStr} &ndash; ${it.maxStr}</div>
                  </div>
                  <div class="range-track">
                    <div class="range-band" style="left:${leftPct}%; width:${widthPct}%; background:${it.color};"></div>
                  </div>
                  ${it.note ? `<div style="font-size:11.5px; font-weight:700; color:#64748b;">${it.note}</div>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        `;

      } else {
        viewerTypeMeta.textContent = 'Tocca una riga per evidenziarla';
        const headers = rows[0].map((h, i) => cleanHeaderLabel(h) || (i === 0 ? 'VOCE' : `COL ${i + 1}`));
        const bodyRows = rows.slice(1);

        viewerBody.innerHTML = `
          <div class="tv-table-wrap">
            <table class="tv-table">
              <thead>
                <tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>
              </thead>
              <tbody>
                ${bodyRows.map(r => `
                  <tr>${headers.map((_, idx) => `<td>${r[idx] || ''}</td>`).join('')}</tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;

        viewerBody.querySelectorAll('tbody tr').forEach(tr => {
          tr.addEventListener('click', () => tr.classList.toggle('row-focused'));
        });
      }
    }

    const drawCanvas = document.getElementById('drawCanvas');
    const ctx = drawCanvas.getContext('2d');
    const btnDrawToggle = document.getElementById('btnDrawToggle');
    let isDrawMode = false;
    let currentColor = 'rgba(255, 238, 0, 0.5)';
    let drawing = false;
    let lastPt = null;

    function syncCanvasSize() {
      const parent = drawCanvas.parentElement;
      if (parent && parent.clientWidth > 0) {
        drawCanvas.width = parent.clientWidth;
        drawCanvas.height = parent.clientHeight;
      }
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    }

    drawCanvas.addEventListener('pointerdown', (e) => {
      if (!isDrawMode) return;
      drawing = true;
      drawCanvas.setPointerCapture(e.pointerId);
      const rect = drawCanvas.getBoundingClientRect();
      lastPt = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = 22;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(lastPt.x, lastPt.y);
      ctx.lineTo(lastPt.x + 0.1, lastPt.y);
      ctx.stroke();
    });

    drawCanvas.addEventListener('pointermove', (e) => {
      if (!drawing || !isDrawMode || !lastPt) return;
      const rect = drawCanvas.getBoundingClientRect();
      const pt = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      ctx.beginPath();
      ctx.moveTo(lastPt.x, lastPt.y);
      ctx.lineTo(pt.x, pt.y);
      ctx.stroke();
      lastPt = pt;
    });

    drawCanvas.addEventListener('pointerup', () => { drawing = false; lastPt = null; });
    drawCanvas.addEventListener('pointercancel', () => { drawing = false; lastPt = null; });

    btnDrawToggle.addEventListener('click', () => {
      isDrawMode = !isDrawMode;
      btnDrawToggle.classList.toggle('active-tool', isDrawMode);
      document.body.classList.toggle('draw-mode', isDrawMode);
    });

    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
        dot.classList.add('selected');
        currentColor = dot.dataset.color;
        if (!isDrawMode) btnDrawToggle.click();
      });
    });

    document.getElementById('btnClearMarks').addEventListener('click', clearCanvas);
    document.getElementById('btnSyncNow').addEventListener('click', loadAllSheets);
    document.getElementById('btnToggleClean').addEventListener('click', () => document.body.classList.toggle('on-air-clean'));
    window.addEventListener('resize', syncCanvasSize);

    loadAllSheets();
  </script>
  <script>
    // Mantiene la navigazione sempre dentro la Web App su iPad senza aprire Safari
    if (window.self !== window.top) {
      document.documentElement.classList.add('in-shell');
      const s = document.createElement('style');
      s.textContent = `header.topbar { display: none !important; } :root { --header-h: 0px !important; }`;
      document.head.appendChild(s);
    }
    document.querySelectorAll('a.nav-pill, a.brand-title').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const href = a.getAttribute('href');
        if (window.parent && window.parent !== window && typeof window.parent.navigateTo === 'function') {
          window.parent.navigateTo(href === 'index.html' ? 'home' : href, a.textContent.trim());
        } else {
          window.location.href = href;
        }
      });
    });
  </script>
</body>
</html>
