<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="br.it/ledwall" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>br.it/ledwall — Dirette Speciali</title>
  <style>
    :root {
      --brand-blue: #0b3d75;
      --brand-blue-dark: #072a52;
      --studio-bg: #e7ebf0;
      --studio-bg-light: #f5f7fa;
      --live-red: #e52521;
      --header-h: 44px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 25%, var(--studio-bg-light) 0%, var(--studio-bg) 75%, #d6dde6 100%);
      color: #0f172a;
    }

    /* TOPBAR UNICA CON MENU INTEGRATO */
    header.topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(var(--header-h) + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      background: linear-gradient(180deg, var(--brand-blue) 0%, var(--brand-blue-dark) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 120;
      box-shadow: 0 2px 10px rgba(7, 42, 82, 0.25);
      gap: 10px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      overflow: hidden;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--live-red);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 3px 7px;
      border-radius: 4px;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(229, 37, 33, 0.5);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 1.4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #fff;
      text-decoration: none;
      white-space: nowrap;
    }

    .brand-divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }

    .view-subtitle {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .topbar-right::-webkit-scrollbar {
      display: none;
    }

    .nav-pill {
      height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.94);
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      cursor: pointer;
    }

    .nav-pill.active {
      background: #fff;
      color: var(--brand-blue);
      border-color: #fff;
    }

    .btn-icon-only {
      height: 26px;
      padding: 0 7px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }

    body.on-air-clean .nav-pill:not(.active),
    body.on-air-clean .brand-divider {
      display: none;
    }

    body.on-air-clean #btnToggleClean {
      opacity: 0.35;
      border-color: transparent;
      background: transparent;
    }

    /* HUB DI TUTTI I FOGLI DEL DOCUMENTO */
    .sheets-hub {
      position: fixed;
      top: calc(var(--header-h) + env(safe-area-inset-top));
      left: 0;
      right: 0;
      bottom: 0;
      padding: 22px 26px max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }

    .hub-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 2px solid rgba(11, 61, 117, 0.14);
      padding-bottom: 10px;
      flex-shrink: 0;
    }

    .hub-header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      color: var(--brand-blue);
      letter-spacing: -0.5px;
    }

    .hub-meta {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sheets-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 20px;
      align-content: stretch;
    }

    .sheet-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(15, 28, 46, 0.1), 0 2px 5px rgba(15, 28, 46, 0.06);
      border-top: 6px solid var(--card-accent, #0b3d75);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .sheet-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 38px rgba(11, 61, 117, 0.18);
    }

    .sheet-card:active {
      transform: scale(0.98);
    }

    .sheet-badge {
      align-self: flex-start;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #eff6ff;
      color: var(--card-accent, #0b3d75);
    }

    .sheet-name {
      font-size: 23px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.2;
      letter-spacing: -0.4px;
    }

    .sheet-preview {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      line-height: 1.4;
      border-top: 1px solid #f1f5f9;
      padding-top: 10px;
    }

    /* VIEWER DATAWALL IN STILE SKY TG24 */
    .sheet-viewer {
      position: fixed;
      top: calc(var(--header-h) + env(safe-area-inset-top));
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 22px 68px;
      display: none;
      flex-direction: column;
      z-index: 100;
      background: radial-gradient(circle at 50% 25%, var(--studio-bg-light) 0%, var(--studio-bg) 75%, #d6dde6 100%);
    }

    .sheet-viewer.active {
      display: flex;
    }

    .viewer-card {
      flex: 1;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 14px 36px rgba(15, 28, 46, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .draw-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      mix-blend-mode: multiply;
      z-index: 30;
    }

    body.draw-mode .draw-canvas {
      pointer-events: auto;
      cursor: crosshair;
      touch-action: none;
    }

    .viewer-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 14px;
      gap: 12px;
      flex-shrink: 0;
    }

    .viewer-title {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      color: var(--brand-blue);
      letter-spacing: -0.4px;
    }

    .viewer-body {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* GRAFICA 1: BARRE VERTICALI TV */
    .vbars-stage {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      gap: 14px;
      padding: 24px 10px 6px;
      min-height: 0;
    }

    .vbar-col {
      flex: 1;
      max-width: 130px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .vbars-stage.has-focus .vbar-col:not(.focused) {
      opacity: 0.22;
    }

    .vbar-col.focused {
      transform: scale(1.04);
    }

    .vbar-diff {
      font-size: 12px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 5px;
      margin-bottom: 5px;
      white-space: nowrap;
    }

    .vbar-val {
      font-size: 22px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .vbar-fill {
      width: 68%;
      max-width: 72px;
      border-radius: 8px 8px 2px 2px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14);
      transition: height 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      min-height: 8px;
    }

    .vbar-label {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 900;
      color: #1e293b;
      text-align: center;
      line-height: 1.2;
      max-width: 100%;
      word-break: break-word;
    }

    .vbar-sub {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-align: center;
      margin-top: 2px;
    }

    /* GRAFICA 2: BARRE ORIZZONTALI TV */
    .hbars-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }

    .hbar-row {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .hbars-list.has-focus .hbar-row:not(.focused) {
      opacity: 0.24;
    }

    .hbar-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .hbar-track {
      width: 100%;
      height: 18px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .hbar-fill {
      height: 100%;
      border-radius: 999px;
    }

    /* GRAFICA 3: BREAKING NEWS / SCHEDE IN ONDA */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
      align-content: start;
    }

    .news-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-left: 6px solid var(--brand-blue);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .news-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(15, 28, 46, 0.08);
    }

    .news-card.urgent {
      background: #fef2f2;
      border-color: #fecaca;
      border-left-color: var(--live-red);
    }

    .news-card.expanded {
      grid-column: 1 / -1;
      background: #fff;
      border: 2px solid var(--brand-blue);
      border-left: 8px solid var(--live-red);
      box-shadow: 0 14px 34px rgba(11, 61, 117, 0.16);
    }

    .news-card.expanded .news-title {
      font-size: 24px;
    }

    .news-card.expanded .news-body {
      font-size: 17px;
      line-height: 1.5;
    }

    .news-tag {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--live-red);
    }

    .news-title {
      font-size: 18px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.25;
    }

    .news-body {
      font-size: 14px;
      font-weight: 500;
      color: #334155;
      line-height: 1.4;
    }

    /* GRAFICA 4: TABELLA BROADCAST */
    .tv-table-wrap {
      width: 100%;
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
    }

    table.tv-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    table.tv-table th {
      background: var(--brand-blue);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 13px 16px;
      white-space: nowrap;
    }

    table.tv-table td {
      padding: 13px 16px;
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      border-bottom: 1px solid #e2e8f0;
    }

    table.tv-table tr:nth-child(even) td {
      background: #f8fafc;
    }

    table.tv-table tr.row-focused td {
      background: #fef08a;
    }

    /* DOCK IN BASSO */
    .viewer-dock {
      position: fixed;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 61, 117, 0.96);
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 28px rgba(7, 42, 82, 0.35);
      z-index: 110;
      max-width: 97vw;
      overflow-x: auto;
    }

    .dock-btn {
      height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .dock-btn.primary-back {
      background: #fff;
      color: var(--brand-blue);
      border-color: #fff;
    }

    .dock-btn.active-tool {
      background: #ffeb3b;
      color: #072a52;
      border-color: #ffeb3b;
    }

    .dock-sep {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.22);
      flex-shrink: 0;
    }

    .color-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.5);
      cursor: pointer;
      flex-shrink: 0;
    }

    .color-dot.selected {
      transform: scale(1.2);
      border-color: #fff;
      box-shadow: 0 0 0 2px #0b3d75, 0 0 0 4px #fff;
    }

    .status-box {
      margin: auto;
      text-align: center;
      background: #fff;
      padding: 26px 32px;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(11, 61, 117, 0.12);
    }
  </style>
</head>
<body>

  <!-- BARRA BLU UNICA CON MENU INTEGRATO -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="live-badge"><span class="live-dot"></span>LIVE</span>
      <a href="index.html" class="brand-title">br.it/ledwall</a>
      <span class="brand-divider"></span>
      <span class="view-subtitle" id="headerSubtitle">Dirette Speciali</span>
    </div>
    <div class="topbar-right">
      <a href="index.html" class="nav-pill">⌂ Regia</a>
      <a href="prime-pagine.html" class="nav-pill">Prime Pagine</a>
      <a href="sondaggi.html" class="nav-pill">Sondaggi</a>
      <a href="speciali.html" class="nav-pill active">Speciali</a>
      <button class="nav-pill" id="btnSyncNow" title="Rileggi tutti i fogli da Google">↻</button>
      <button class="btn-icon-only" id="btnToggleClean" title="Nascondi controlli in onda">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>
  </header>

  <!-- SCHERMATA 1: TUTTI I FOGLI DEL GOOGLE SHEET -->
  <main class="sheets-hub" id="sheetsHub">
    <div class="hub-header">
      <h1>Fogli Diretta Speciale</h1>
      <span class="hub-meta" id="hubMeta">Sincronizzazione...</span>
    </div>
    <div id="hubStatus" class="status-box">Lettura automatica di tutti i fogli da Google...</div>
    <div class="sheets-grid" id="sheetsGrid" style="display:none;"></div>
  </main>

  <!-- SCHERMATA 2: GRAFICA INTERATTIVA DEL FOGLIO -->
  <section class="sheet-viewer" id="sheetViewer">
    <div class="viewer-card">
      <canvas class="draw-canvas" id="drawCanvas"></canvas>
      <div class="viewer-top">
        <h2 class="viewer-title" id="viewerTitle">Titolo Foglio</h2>
        <span class="hub-meta" id="viewerTypeMeta">Tocca un elemento per metterlo in evidenza</span>
      </div>
      <div class="viewer-body" id="viewerBody"></div>
    </div>

    <div class="viewer-dock">
      <button class="dock-btn primary-back" id="btnBackToSheets">&#8592; Tutti i fogli</button>
      <div class="dock-sep"></div>
      <button class="dock-btn mode-btn active-tool" data-mode="vbars">Colonne</button>
      <button class="dock-btn mode-btn" data-mode="hbars">Barre</button>
      <button class="dock-btn mode-btn" data-mode="news">Schede</button>
      <button class="dock-btn mode-btn" data-mode="table">Tabella</button>
      <div class="dock-sep"></div>
      <button class="dock-btn" id="btnDrawToggle">Evidenzia</button>
      <span class="color-dot selected" data-color="rgba(255, 238, 0, 0.5)" style="background:#ffee00;"></span>
      <span class="color-dot" data-color="rgba(0, 230, 118, 0.4)" style="background:#00e676;"></span>
      <span class="color-dot" data-color="rgba(255, 82, 82, 0.4)" style="background:#ff5252;"></span>
      <button class="dock-btn" id="btnClearMarks">Pulisci</button>
    </div>
  </section>

  <script>
    const PUB_KEY = "2PACX-1vSQhKtuszAe47ZCU8gtl39Ttyf1saf_0ls3ZMM4pnbvdHjCrLNULSgauI43UbunQp2eC_l3Qrpt2oNX";
    const PUBHTML_URL = `https://docs.google.com/spreadsheets/d/e/${PUB_KEY}/pubhtml`;
    const PUB_CSV_BASE = `https://docs.google.com/spreadsheets/d/e/${PUB_KEY}/pub?output=csv`;

    const PALETTE = ["#0b3d75", "#e11d48", "#16a34a", "#f59e0b", "#0284c7", "#7c3aed", "#ea580c", "#0f766e"];

    let allSheets = [];
    let currentSheet = null;
    let currentMode = 'vbars';

    const hubStatus = document.getElementById('hubStatus');
    const sheetsGrid = document.getElementById('sheetsGrid');
    const hubMeta = document.getElementById('hubMeta');
    const sheetViewer = document.getElementById('sheetViewer');
    const viewerTitle = document.getElementById('viewerTitle');
    const viewerTypeMeta = document.getElementById('viewerTypeMeta');
    const viewerBody = document.getElementById('viewerBody');
    const headerSubtitle = document.getElementById('headerSubtitle');

    function parseNum(str) {
      if (str === null || str === undefined) return null;
      const s = String(str).trim().replace('%', '').replace(/\s+/g, '').replace(',', '.');
      if (!s || s === '-') return null;
      const n = parseFloat(s);
      return isNaN(n) ? null : n;
    }

    function parseCSV(csvText) {
      const lines = csvText.trim().split(/\r?\n/).filter(Boolean);
      return lines.map(line => {
        const res = [];
        let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') inQ = !inQ;
          else if (c === ',' && !inQ) { res.push(cur.trim()); cur = ''; }
          else cur += c;
        }
        res.push(cur.trim());
        while (res.length > 0 && res[res.length - 1] === '') res.pop();
        return res;
      }).filter(r => r.some(c => c !== ''));
    }

    function parsePubHtmlFull(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const sheets = [];
      const seenGids = new Set();

      const tabs = Array.from(doc.querySelectorAll('#sheet-menu li'));
      tabs.forEach((li, idx) => {
        const gid = (li.id || '').replace('sheet-button-', '').trim();
        const title = li.textContent.trim() || `Foglio ${idx + 1}`;
        let box = gid ? doc.querySelector(`[id="${gid}"]`) : null;
        if (!box) {
          const viewDivs = Array.from(doc.querySelectorAll('#sheets-viewport > div'));
          box = viewDivs[idx] || null;
        }
        const rows = [];
        if (box) {
          const table = box.querySelector('table.waffle');
          if (table) {
            table.querySelectorAll('tbody tr').forEach(tr => {
              const cells = Array.from(tr.querySelectorAll('td')).map(td => td.textContent.trim());
              while (cells.length > 0 && cells[cells.length - 1] === '') cells.pop();
              if (cells.some(c => c !== '')) rows.push(cells);
            });
          }
        }
        sheets.push({ id: gid || String(idx), title, rows });
        if (gid) seenGids.add(gid);
      });

      const scriptMatches = html.matchAll(/items\.push\(\{name:\s*"([^"]+)",\s*pageUrl:[^}]*gid=(\d+)/g);
      for (const m of scriptMatches) {
        const title = m[1];
        const gid = m[2];
        if (!seenGids.has(gid)) {
          sheets.push({ id: gid, title, rows: [] });
          seenGids.add(gid);
        }
      }

      if (!sheets.length) {
        const tables = Array.from(doc.querySelectorAll('table.waffle'));
        tables.forEach((table, i) => {
          const rows = [];
          table.querySelectorAll('tbody tr').forEach(tr => {
            const cells = Array.from(tr.querySelectorAll('td')).map(td => td.textContent.trim());
            while (cells.length > 0 && cells[cells.length - 1] === '') cells.pop();
            if (cells.some(c => c !== '')) rows.push(cells);
          });
          if (rows.length) sheets.push({ id: String(i), title: `Foglio ${i + 1}`, rows });
        });
      }

      return sheets;
    }

    async function fetchViaMultiProxy(targetUrl) {
      const urlWithTs = targetUrl + (targetUrl.includes('?') ? '&' : '?') + 't=' + Date.now();
      const endpoints = [
        { url: `https://api.allorigins.win/get?url=${encodeURIComponent(urlWithTs)}`, json: true },
        { url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(urlWithTs)}`, json: false },
        { url: `https://corsproxy.io/?${encodeURIComponent(urlWithTs)}`, json: false },
        { url: urlWithTs, json: false }
      ];

      for (const ep of endpoints) {
        try {
          const res = await fetch(ep.url);
          if (!res.ok) continue;
          let content = '';
          if (ep.json) {
            const data = await res.json();
            content = data.contents || '';
          } else {
            content = await res.text();
          }
          if (content && content.length > 80) return content;
        } catch (e) {}
      }
      throw new Error('Proxy non raggiungibili');
    }

    async function loadAllSheets() {
      const btn = document.getElementById('btnSyncNow');
      btn.textContent = '…';
      hubMeta.textContent = 'Sincronizzazione in corso...';

      let discovered = [];

      try {
        const html = await fetchViaMultiProxy(PUBHTML_URL);
        discovered = parsePubHtmlFull(html);
      } catch (e) {}

      if (discovered.length > 0) {
        await Promise.all(discovered.map(async (sh) => {
          if (!sh.rows || sh.rows.length === 0) {
            try {
              const csvUrl = `${PUB_CSV_BASE}&gid=${encodeURIComponent(sh.id)}`;
              const csvTxt = await fetchViaMultiProxy(csvUrl);
              const parsedRows = parseCSV(csvTxt);
              if (parsedRows.length > 0) sh.rows = parsedRows;
            } catch (e) {}
          }
        }));
      } else {
        try {
          const csvTxt = await fetchViaMultiProxy(PUB_CSV_BASE);
          const rows = parseCSV(csvTxt);
          if (rows.length > 0) discovered = [{ id: '0', title: 'Foglio 1', rows }];
        } catch (e) {}
      }

      if (discovered.length > 0) {
        allSheets = discovered;
        localStorage.setItem('br_ledwall_speciali_v4', JSON.stringify(discovered));
      } else {
        const cached = JSON.parse(localStorage.getItem('br_ledwall_speciali_v4') || 'null');
        if (cached) allSheets = cached;
      }

      btn.textContent = '↻';
      renderSheetsGrid();

      if (currentSheet) {
        const updated = allSheets.find(s => s.id === currentSheet.id || s.title === currentSheet.title);
        if (updated) {
          currentSheet = updated;
          renderOpenSheet();
        }
      }
    }

    function detectBestMode(rows) {
      if (!rows || rows.length < 2) return 'table';
      const headers = rows[0].map(h => h.toUpperCase());
      const dataRows = rows.slice(1);

      let numericCols = 0;
      for (let c = 1; c < rows[0].length; c++) {
        const nums = dataRows.map(r => parseNum(r[c])).filter(v => v !== null);
        if (nums.length >= Math.max(1, Math.floor(dataRows.length * 0.5))) numericCols++;
      }

      if (headers.some(h => h.includes('TITOL') || h.includes('NOTIZ') || h.includes('FLASH') || h.includes('TESTO'))) return 'news';
      if (numericCols === 0) return 'news';
      if (numericCols >= 1 && dataRows.length <= 8) return 'vbars';
      if (numericCols >= 1) return 'hbars';
      return 'table';
    }

    function renderSheetsGrid() {
      if (!allSheets.length) {
        hubStatus.style.display = 'block';
        hubStatus.innerHTML = `
          <div style="font-weight:800; color:#b91c1c; margin-bottom:8px;">Connessione ai fogli non riuscita</div>
          <div style="font-size:13px; color:#475569; margin-bottom:14px;">Premi il pulsante qui sotto per riprovare il caricamento.</div>
          <button onclick="loadAllSheets()" style="background:#0b3d75; color:#fff; border:none; padding:9px 18px; border-radius:8px; font-weight:800; cursor:pointer;">Riprova adesso</button>
        `;
        sheetsGrid.style.display = 'none';
        hubMeta.textContent = '0 fogli';
        return;
      }

      hubStatus.style.display = 'none';
      sheetsGrid.style.display = 'grid';
      hubMeta.textContent = `${allSheets.length} ${allSheets.length === 1 ? 'foglio trovato' : 'fogli trovati'}`;

      sheetsGrid.innerHTML = allSheets.map((sh, idx) => {
        const mode = detectBestMode(sh.rows);
        const badgeText = mode === 'vbars' ? 'Grafico a Colonne' : mode === 'hbars' ? 'Grafico a Barre' : mode === 'news' ? 'Schede Notizie' : 'Tabella Dati';
        const color = PALETTE[idx % PALETTE.length];
        const previewCols = (sh.rows[0] || []).filter(Boolean).slice(0, 4).join(' • ');
        const countRows = Math.max(0, sh.rows.length - 1);

        return `
          <div class="sheet-card" data-idx="${idx}" style="--card-accent:${color};">
            <span class="sheet-badge" style="color:${color};">${badgeText} &bull; ${countRows} voci</span>
            <div class="sheet-name">${sh.title}</div>
            <div class="sheet-preview">${previewCols || 'Foglio vuoto — tocca per aprire'}</div>
          </div>
        `;
      }).join('');

      sheetsGrid.querySelectorAll('.sheet-card').forEach(card => {
        card.addEventListener('click', () => {
          currentSheet = allSheets[parseInt(card.dataset.idx, 10)];
          currentMode = detectBestMode(currentSheet.rows);
          updateModeButtons();
          openSheetViewer();
        });
      });
    }

    function updateModeButtons() {
      document.querySelectorAll('.mode-btn').forEach(b => {
        b.classList.toggle('active-tool', b.dataset.mode === currentMode);
      });
    }

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentMode = btn.dataset.mode;
        updateModeButtons();
        renderOpenSheet();
      });
    });

    function openSheetViewer() {
      if (!currentSheet) return;
      headerSubtitle.textContent = currentSheet.title;
      sheetViewer.classList.add('active');
      requestAnimationFrame(syncCanvasSize);
      renderOpenSheet();
    }

    function closeSheetViewer() {
      currentSheet = null;
      sheetViewer.classList.remove('active');
      headerSubtitle.textContent = 'Dirette Speciali';
      clearCanvas();
    }

    document.getElementById('btnBackToSheets').addEventListener('click', closeSheetViewer);

    function extractChartItems(rows) {
      const headers = rows[0] || [];
      const dataRows = rows.slice(1);
      let numCol = 1;
      for (let c = 1; c < headers.length; c++) {
        if (dataRows.some(r => parseNum(r[c]) !== null)) { numCol = c; break; }
      }
      let prevCol = -1;
      for (let c = numCol + 1; c < headers.length; c++) {
        if (dataRows.some(r => parseNum(r[c]) !== null)) { prevCol = c; break; }
      }

      return dataRows.map((r, i) => {
        const label = r[0] || `Voce ${i + 1}`;
        const sub = numCol > 1 ? (r[1] || '') : '';
        const rawVal = r[numCol] || '0';
        const val = parseNum(rawVal) ?? 0;
        const prevVal = prevCol >= 0 ? parseNum(r[prevCol]) : null;
        const customColor = r.find(cell => /^#[0-9A-Fa-f]{6}$/.test(cell));
        return { label, sub, rawVal, val, prevVal, color: customColor || PALETTE[i % PALETTE.length] };
      });
    }

    function renderOpenSheet() {
      if (!currentSheet) return;
      viewerTitle.textContent = currentSheet.title;
      const rows = currentSheet.rows;

      if (!rows.length) {
        viewerBody.innerHTML = `<div style="margin:auto; color:#64748b; font-weight:700;">Questo foglio è ancora vuoto.</div>`;
        return;
      }

      if (currentMode === 'vbars') {
        viewerTypeMeta.textContent = 'Tocca una colonna per isolarla';
        const items = extractChartItems(rows);
        const maxVal = Math.max(...items.map(it => it.val), 1);

        viewerBody.innerHTML = `
          <div class="vbars-stage" id="vbarsStage">
            ${items.map(it => {
              const hPct = Math.max(5, Math.round((it.val / (maxVal * 1.12)) * 100));
              let diffBadge = '';
              if (it.prevVal !== null) {
                const diff = +(it.val - it.prevVal).toFixed(2);
                const bg = diff > 0 ? '#dcfce7' : diff < 0 ? '#fee2e2' : '#f1f5f9';
                const fg = diff > 0 ? '#15803d' : diff < 0 ? '#b91c1c' : '#64748b';
                const arrow = diff > 0 ? '▲ +' : diff < 0 ? '▼ ' : '• ';
                diffBadge = `<span class="vbar-diff" style="background:${bg}; color:${fg};">${arrow}${String(diff).replace('.', ',')}</span>`;
              }
              return `
                <div class="vbar-col">
                  ${diffBadge}
                  <span class="vbar-val" style="color:${it.color};">${it.rawVal}</span>
                  <div class="vbar-fill" style="height:${hPct}%; background:${it.color};"></div>
                  <div class="vbar-label">${it.label}</div>
                  ${it.sub ? `<div class="vbar-sub">${it.sub}</div>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        `;

        const stage = document.getElementById('vbarsStage');
        stage.querySelectorAll('.vbar-col').forEach(col => {
          col.addEventListener('click', () => {
            const was = col.classList.contains('focused');
            stage.querySelectorAll('.vbar-col').forEach(c => c.classList.remove('focused'));
            if (!was) { col.classList.add('focused'); stage.classList.add('has-focus'); }
            else stage.classList.remove('has-focus');
          });
        });

      } else if (currentMode === 'hbars') {
        viewerTypeMeta.textContent = 'Tocca una barra per isolarla';
        const items = extractChartItems(rows);
        const maxVal = Math.max(...items.map(it => it.val), 1);

        viewerBody.innerHTML = `
          <div class="hbars-list" id="hbarsList">
            ${items.map(it => {
              const wPct = Math.max(4, Math.min(100, Math.round((it.val / maxVal) * 100)));
              let diffHtml = '';
              if (it.prevVal !== null) {
                const diff = +(it.val - it.prevVal).toFixed(2);
                const fg = diff > 0 ? '#15803d' : diff < 0 ? '#b91c1c' : '#64748b';
                const sign = diff > 0 ? '+' : '';
                diffHtml = `<span style="font-size:13px; font-weight:800; color:${fg}; margin-right:8px;">(${sign}${String(diff).replace('.', ',')})</span>`;
              }
              return `
                <div class="hbar-row">
                  <div class="hbar-top">
                    <div>
                      <span style="font-size:17px; font-weight:900; color:#0f172a;">${it.label}</span>
                      ${it.sub ? `<span style="font-size:13px; font-weight:600; color:#64748b; margin-left:8px;">${it.sub}</span>` : ''}
                    </div>
                    <div>${diffHtml}<span style="font-size:21px; font-weight:900; color:${it.color};">${it.rawVal}</span></div>
                  </div>
                  <div class="hbar-track">
                    <div class="hbar-fill" style="width:${wPct}%; background:${it.color};"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;

        const list = document.getElementById('hbarsList');
        list.querySelectorAll('.hbar-row').forEach(row => {
          row.addEventListener('click', () => {
            const was = row.classList.contains('focused');
            list.querySelectorAll('.hbar-row').forEach(r => r.classList.remove('focused'));
            if (!was) { row.classList.add('focused'); list.classList.add('has-focus'); }
            else list.classList.remove('has-focus');
          });
        });

      } else if (currentMode === 'news') {
        viewerTypeMeta.textContent = 'Tocca una scheda per ingrandirla in primo piano';
        const headers = rows[0] || [];
        const dataRows = rows.slice(1);

        viewerBody.innerHTML = `
          <div class="news-grid">
            ${dataRows.map(r => {
              const nonEmpty = r.filter(Boolean);
              const tag = nonEmpty.length > 2 ? nonEmpty[0] : (headers[0] || 'LIVE');
              const title = nonEmpty.length > 2 ? nonEmpty[1] : (nonEmpty[0] || '');
              const body = nonEmpty.length > 2 ? nonEmpty.slice(2).join(' — ') : (nonEmpty[1] || '');
              const isUrgent = r.some(c => ['SI', 'URGENTE', 'LIVE', 'BREAKING'].includes(c.toUpperCase()));

              return `
                <div class="news-card ${isUrgent ? 'urgent' : ''}">
                  <div class="news-tag">${tag}</div>
                  <div class="news-title">${title}</div>
                  ${body ? `<div class="news-body">${body}</div>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        `;

        viewerBody.querySelectorAll('.news-card').forEach(card => {
          card.addEventListener('click', () => card.classList.toggle('expanded'));
        });

      } else {
        viewerTypeMeta.textContent = 'Tocca una riga per evidenziarla';
        const headers = rows[0] || [];
        const bodyRows = rows.slice(1);

        viewerBody.innerHTML = `
          <div class="tv-table-wrap">
            <table class="tv-table">
              <thead>
                <tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>
              </thead>
              <tbody>
                ${bodyRows.map(r => `
                  <tr>${headers.map((_, idx) => `<td>${r[idx] || ''}</td>`).join('')}</tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;

        viewerBody.querySelectorAll('tbody tr').forEach(tr => {
          tr.addEventListener('click', () => tr.classList.toggle('row-focused'));
        });
      }
    }

    const drawCanvas = document.getElementById('drawCanvas');
    const ctx = drawCanvas.getContext('2d');
    const btnDrawToggle = document.getElementById('btnDrawToggle');
    let isDrawMode = false;
    let currentColor = 'rgba(255, 238, 0, 0.5)';
    let drawing = false;
    let lastPt = null;

    function syncCanvasSize() {
      const parent = drawCanvas.parentElement;
      if (parent && parent.clientWidth > 0) {
        drawCanvas.width = parent.clientWidth;
        drawCanvas.height = parent.clientHeight;
      }
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    }

    drawCanvas.addEventListener('pointerdown', (e) => {
      if (!isDrawMode) return;
      drawing = true;
      drawCanvas.setPointerCapture(e.pointerId);
      const rect = drawCanvas.getBoundingClientRect();
      lastPt = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = 22;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(lastPt.x, lastPt.y);
      ctx.lineTo(lastPt.x + 0.1, lastPt.y);
      ctx.stroke();
    });

    drawCanvas.addEventListener('pointermove', (e) => {
      if (!drawing || !isDrawMode || !lastPt) return;
      const rect = drawCanvas.getBoundingClientRect();
      const pt = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      ctx.beginPath();
      ctx.moveTo(lastPt.x, lastPt.y);
      ctx.lineTo(pt.x, pt.y);
      ctx.stroke();
      lastPt = pt;
    });

    drawCanvas.addEventListener('pointerup', () => { drawing = false; lastPt = null; });
    drawCanvas.addEventListener('pointercancel', () => { drawing = false; lastPt = null; });

    btnDrawToggle.addEventListener('click', () => {
      isDrawMode = !isDrawMode;
      btnDrawToggle.classList.toggle('active-tool', isDrawMode);
      document.body.classList.toggle('draw-mode', isDrawMode);
    });

    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
        dot.classList.add('selected');
        currentColor = dot.dataset.color;
        if (!isDrawMode) btnDrawToggle.click();
      });
    });

    document.getElementById('btnClearMarks').addEventListener('click', clearCanvas);
    document.getElementById('btnSyncNow').addEventListener('click', loadAllSheets);
    document.getElementById('btnToggleClean').addEventListener('click', () => document.body.classList.toggle('on-air-clean'));
    window.addEventListener('resize', syncCanvasSize);

    loadAllSheets();
  </script>
</body>
</html>
