<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>br.it/ledwall - Rassegna Stampa TV</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & Playfair Display -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-blue: #0b3d75;
            --brand-blue-dark: #082d57;
            --brand-blue-border: #165296;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            /* Sfondo chiaro studio TV stile Sky TG24 */
            background-color: #e5e7eb;
            color: #0f172a;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Sfondo architettonico studio televisivo chiaro (grigio-argento / bianco perla) */
        .sky-studio-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 50% 38%, #f8fafc 0%, #f1f5f9 35%, #e2e8f0 70%, #cbd5e1 100%);
            pointer-events: none;
        }

        /* Sottili pannelli e linee di fuga architettoniche del ledwall */
        .sky-studio-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(to right, rgba(148, 163, 184, 0.14) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(148, 163, 184, 0.14) 1px, transparent 1px),
                radial-gradient(circle at 50% 100%, rgba(11, 61, 117, 0.06) 0%, transparent 60%);
            background-size: 120px 120px, 120px 120px, 100% 100%;
            pointer-events: none;
        }

        /* Barra superiore blu istituzionale brunorachiele.it (52px) */
        #top-header {
            height: 52px;
            background: linear-gradient(180deg, var(--brand-blue) 0%, var(--brand-blue-dark) 100%);
            border-bottom: 1px solid var(--brand-blue-border);
            box-shadow: 0 4px 16px rgba(8, 45, 87, 0.25);
        }

        /* Card delle prime pagine sul Ledwall */
        .newspaper-card {
            background: #ffffff;
            border-radius: 4px;
            box-shadow:
                0 10px 24px -4px rgba(15, 23, 42, 0.22),
                0 4px 8px -2px rgba(15, 23, 42, 0.12),
                0 0 0 1px rgba(148, 163, 184, 0.45);
            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.28s ease;
            overflow: hidden;
            position: relative;
        }

        .newspaper-card:hover, .newspaper-card:active {
            transform: translateY(-5px) scale(1.025);
            box-shadow:
                0 20px 35px -5px rgba(11, 61, 117, 0.32),
                0 8px 15px -3px rgba(15, 23, 42, 0.18),
                0 0 0 2px #0b3d75;
            z-index: 10;
        }

        /* Effetto sfocatura del muro quando si apre un quotidiano */
        .wall-blurred {
            filter: blur(10px) brightness(0.88);
            transform: scale(0.98);
            pointer-events: none;
        }

        /* Viewport del giornale aperto: contiene lo zoom interno senza ingrandire lo schermo */
        #reader-viewport {
            touch-action: none; /* Disabilita gesti nativi browser dentro l'area di lettura/disegno */
            overflow: hidden;
            position: relative;
        }

        /* Contenitore foto + canvas evidenziatore che si trasforma insieme */
        #paper-transform-layer {
            transform-origin: center center;
            will-change: transform;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.38), 0 0 0 1px rgba(148, 163, 184, 0.5);
            background: #ffffff;
        }

        #paper-transform-layer.smooth-anim {
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Fusione realistica dell'inchiostro evidenziatore sulla carta del giornale */
        #freehand-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        /* Barra flottante inferiore stile broadcast */
        #reader-toolbar {
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        #reader-toolbar.hud-hidden {
            opacity: 0;
            transform: translate(-50%, 24px);
            pointer-events: none;
        }

        /* Scrollbar discreta per griglia su schermi piccoli */
        #ledwall-scroll::-webkit-scrollbar {
            width: 6px;
        }
        #ledwall-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        #ledwall-scroll::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.35);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen">

    <!-- Sfondo studio televisivo chiaro stile Sky TG24 -->
    <div class="sky-studio-bg"></div>
    <div class="sky-studio-grid"></div>

    <!-- BARRA SUPERIORE BLU ISTITUZIONALE (52px) -->
    <header id="top-header" class="relative z-40 w-full px-3 sm:px-5 flex items-center justify-between shrink-0 text-white">
        
        <!-- Sinistra: Indicatore LIVE + br.it/ledwall -->
        <div class="flex items-center gap-2.5 sm:gap-3">
            <div class="flex items-center gap-1.5 bg-red-600 text-white text-[11px] sm:text-xs font-extrabold px-2.5 py-1 rounded tracking-wider uppercase shadow-sm">
                <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                <span>LIVE</span>
            </div>
            <div class="flex items-baseline gap-2">
                <span class="font-extrabold text-base sm:text-lg tracking-tight text-white">br.it/ledwall</span>
                <span id="edition-badge" class="hidden md:inline-block text-xs font-medium text-sky-200/90 border-l border-sky-400/30 pl-2">
                    Prime Pagine
                </span>
            </div>
        </div>

        <!-- Destra: Azioni principali touch-friendly -->
        <div class="flex items-center gap-2">
            <!-- Pulsante Torna Indietro (visibile quando un giornale è aperto) -->
            <button id="header-back-btn" onclick="closeReader()" class="hidden items-center gap-1.5 bg-amber-400 hover:bg-amber-300 active:bg-amber-500 text-slate-950 font-bold text-xs sm:text-sm px-3.5 h-9 rounded-lg shadow transition cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span>Torna indietro</span>
            </button>

            <!-- Pulsante Aggiorna dal sito brunorachiele.it -->
            <button id="btn-sync-blog" onclick="fetchFromBlog(true)" class="flex items-center gap-1.5 bg-white/15 hover:bg-white/25 active:bg-white/30 text-white border border-white/20 text-xs sm:text-sm font-medium px-3 h-9 rounded-lg transition cursor-pointer" title="Ricarica le prime pagine da brunorachiele.it">
                <svg id="sync-icon" class="w-4 h-4 text-sky-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span class="hidden sm:inline">Aggiorna dal sito</span>
                <span class="sm:hidden">Aggiorna</span>
            </button>

            <!-- Caricamento manuale di backup -->
            <input type="file" id="manual-file-input" multiple accept="image/*" class="hidden">
            <button onclick="document.getElementById('manual-file-input').click()" class="flex items-center gap-1.5 bg-white/10 hover:bg-white/20 text-sky-100 border border-white/15 text-xs sm:text-sm font-medium px-2.5 sm:px-3 h-9 rounded-lg transition cursor-pointer" title="Carica immagini dal dispositivo">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                <span class="hidden md:inline">Carica File</span>
            </button>
        </div>
    </header>

    <!-- AREA 1: LEDWALL (GRIGLIA PRIME PAGINE) -->
    <main id="ledwall-scroll" class="relative z-10 flex-1 overflow-y-auto px-3 py-4 sm:px-6 sm:py-6 flex items-center justify-center transition-all duration-300">
        
        <!-- Loader iniziale durante estrazione da brunorachiele.it -->
        <div id="loading-panel" class="flex flex-col items-center justify-center text-center bg-white/80 backdrop-blur-md border border-slate-200 px-8 py-7 rounded-2xl shadow-xl">
            <div class="w-10 h-10 border-4 border-[#0b3d75] border-t-transparent rounded-full animate-spin mb-3"></div>
            <p class="text-sm sm:text-base font-bold text-slate-800">Caricamento prime pagine in corso...</p>
            <p class="text-xs text-slate-500 mt-1">Connessione a brunorachiele.it</p>
        </div>

        <!-- Griglia Responsive (Ottimizzata per iPad Landscape 4x2 / 5x2 e Portrait 2x4 / 3x3) -->
        <div id="newspapers-grid" class="hidden w-full max-w-[1440px] mx-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5 sm:gap-5 md:gap-6 place-items-center my-auto">
            <!-- Card generate via JavaScript -->
        </div>
    </main>

    <!-- AREA 2: LETTORE GIORNALE IN PRIMO PIANO (ZOOM SOLO SULLA FOTO + EVIDENZIATORE A MANO LIBERA) -->
    <section id="reader-overlay" class="fixed inset-x-0 top-[52px] bottom-0 z-30 hidden flex-col items-center justify-center bg-slate-900/35 backdrop-blur-sm">
        
        <!-- Riquadro Viewport del giornale: lo zoom avviene SOLO qui dentro -->
        <div id="reader-viewport" class="w-full h-full flex items-center justify-center p-2 sm:p-4">
            
            <!-- Livello trasformabile (Foto + Canvas solidali) -->
            <div id="paper-transform-layer" class="rounded-sm overflow-hidden">
                <img id="active-paper-img" src="" alt="Prima Pagina" class="block max-h-[calc(100vh-140px)] max-w-[94vw] w-auto h-auto object-contain pointer-events-none select-none" draggable="false">
                <canvas id="freehand-canvas"></canvas>
            </div>

        </div>

        <!-- Frecce Navigazione Laterali grandi per Tablet -->
        <button id="btn-prev-paper" onclick="switchPaper(-1)" class="fixed left-2 sm:left-5 top-1/2 -translate-y-1/2 z-40 w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-[#0b3d75]/90 hover:bg-[#0b3d75] text-white border border-white/25 shadow-xl flex items-center justify-center transition active:scale-95 cursor-pointer" title="Quotidiano precedente">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        </button>

        <button id="btn-next-paper" onclick="switchPaper(1)" class="fixed right-2 sm:right-5 top-1/2 -translate-y-1/2 z-40 w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-[#0b3d75]/90 hover:bg-[#0b3d75] text-white border border-white/25 shadow-xl flex items-center justify-center transition active:scale-95 cursor-pointer" title="Quotidiano successivo">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
        </button>

        <!-- BARRA FLOTTANTE STRUMENTI TOUCH (Zoom foto, Evidenziatore mano libera, Torna indietro) -->
        <div id="reader-toolbar" class="fixed bottom-3 left-1/2 -translate-x-1/2 z-40 max-w-[96vw] bg-slate-900/92 backdrop-blur-xl text-white border border-slate-700/80 px-2.5 py-2 rounded-2xl shadow-2xl flex flex-wrap items-center justify-center gap-1.5 sm:gap-2">
            
            <!-- Pulsante Torna Indietro -->
            <button onclick="closeReader()" class="flex items-center gap-1.5 bg-amber-400 hover:bg-amber-300 active:bg-amber-500 text-slate-950 font-bold text-xs sm:text-sm px-3 h-11 rounded-xl transition cursor-pointer shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span>Indietro</span>
            </button>

            <div class="h-7 w-px bg-slate-700 mx-0.5"></div>

            <!-- Selettore Modalità: Mano (Sposta/Zoom) vs Evidenziatore a Mano Libera -->
            <div class="flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700">
                <button id="tool-pan" onclick="setTool('pan')" class="flex items-center gap-1.5 px-3 h-9 rounded-lg text-xs sm:text-sm font-semibold bg-[#0b3d75] text-white shadow transition cursor-pointer" title="Sposta e ingrandisci la foto">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11"></path></svg>
                    <span class="hidden sm:inline">Sposta</span>
                </button>
                <button id="tool-draw" onclick="setTool('draw')" class="flex items-center gap-1.5 px-3 h-9 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:text-white transition cursor-pointer" title="Evidenziatore a mano libera">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    <span>Evidenzia</span>
                </button>
            </div>

            <!-- Colori Evidenziatore (44px touch target) -->
            <div class="flex items-center gap-1 bg-slate-800/80 px-2 h-11 rounded-xl border border-slate-700/70">
                <button onclick="setBrushColor('#fde047', this)" class="swatch-btn w-7 h-7 rounded-full bg-[#fde047] ring-2 ring-white scale-110 transition cursor-pointer" aria-label="Giallo"></button>
                <button onclick="setBrushColor('#86efac', this)" class="swatch-btn w-7 h-7 rounded-full bg-[#86efac] opacity-80 hover:opacity-100 transition cursor-pointer" aria-label="Verde"></button>
                <button onclick="setBrushColor('#f9a8d4', this)" class="swatch-btn w-7 h-7 rounded-full bg-[#f9a8d4] opacity-80 hover:opacity-100 transition cursor-pointer" aria-label="Rosa"></button>
                <button onclick="setBrushColor('#7dd3fc', this)" class="swatch-btn w-7 h-7 rounded-full bg-[#7dd3fc] opacity-80 hover:opacity-100 transition cursor-pointer" aria-label="Azzurro"></button>
            </div>

            <!-- Spessore tratto evidenziatore -->
            <div class="hidden md:flex items-center gap-1 bg-slate-800/80 px-2 h-11 rounded-xl border border-slate-700/70" title="Spessore tratto">
                <button onclick="setBrushSize(0.014, this)" class="size-btn w-8 h-8 rounded-lg flex items-center justify-center text-slate-300 hover:bg-slate-700 cursor-pointer">
                    <span class="w-2 h-2 rounded-full bg-current"></span>
                </button>
                <button onclick="setBrushSize(0.024, this)" class="size-btn w-8 h-8 rounded-lg flex items-center justify-center bg-slate-700 text-white cursor-pointer">
                    <span class="w-3.5 h-3.5 rounded-full bg-current"></span>
                </button>
                <button onclick="setBrushSize(0.038, this)" class="size-btn w-8 h-8 rounded-lg flex items-center justify-center text-slate-300 hover:bg-slate-700 cursor-pointer">
                    <span class="w-5 h-5 rounded-full bg-current"></span>
                </button>
            </div>

            <!-- Undo & Cancella tratti -->
            <div class="flex items-center gap-1">
                <button onclick="undoStroke()" class="w-11 h-11 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center justify-center transition cursor-pointer" title="Annulla ultimo tratto">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                </button>
                <button onclick="clearStrokes()" class="w-11 h-11 rounded-xl bg-slate-800 hover:bg-red-900/60 text-slate-200 hover:text-red-300 border border-slate-700 flex items-center justify-center transition cursor-pointer" title="Cancella tutte le evidenziature">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            </div>

            <div class="h-7 w-px bg-slate-700 mx-0.5 hidden sm:block"></div>

            <!-- Controlli Zoom Foto -->
            <div class="flex items-center gap-1 bg-slate-800 px-1.5 h-11 rounded-xl border border-slate-700">
                <button onclick="changePhotoZoom(-0.35)" class="w-9 h-9 rounded-lg hover:bg-slate-700 flex items-center justify-center text-white font-bold text-lg cursor-pointer" title="Riduci foto">-</button>
                <button onclick="resetPhotoZoom()" id="zoom-pct-btn" class="px-2 h-9 rounded-lg hover:bg-slate-700 font-mono text-xs text-sky-300 font-semibold cursor-pointer" title="Ripristina 100%">100%</button>
                <button onclick="changePhotoZoom(0.35)" class="w-9 h-9 rounded-lg hover:bg-slate-700 flex items-center justify-center text-white font-bold text-lg cursor-pointer" title="Ingrandisci foto">+</button>
            </div>

            <!-- Modalità Diretta Pulita (nasconde barra flottante) -->
            <button onclick="toggleCleanLiveHud()" class="w-11 h-11 rounded-xl bg-slate-800 hover:bg-slate-700 text-sky-300 border border-slate-700 flex items-center justify-center transition cursor-pointer" title="Nascondi barra strumenti per diretta pulita">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
        </div>

        <!-- Pulsante discreto per riaprire gli strumenti quando nascosti -->
        <button id="show-hud-btn" onclick="toggleCleanLiveHud()" class="hidden fixed bottom-4 right-4 z-40 bg-[#0b3d75]/90 text-white border border-white/25 px-3.5 h-11 rounded-full shadow-xl text-xs font-semibold items-center gap-1.5 backdrop-blur-md cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
            <span>Strumenti</span>
        </button>
    </section>

    <!-- Notifica Toast discreta -->
    <div id="toast-banner" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-white border border-slate-700 px-4 py-2 rounded-full text-xs font-medium shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 text-center max-w-[90vw]">
        Messaggio
    </div>

    <script>
        /**
         * CONFIGURAZIONE E STATO GLOBALE
         */
        const TARGET_BLOG_URL = 'https://www.brunorachiele.it/p/prime-pagine-dei-giornali.html';
        const BLOGGER_FEED_URL = 'https://www.brunorachiele.it/feeds/pages/default?alt=json';

        const appState = {
            papers: [],           // { id, title, src, strokes: [ { color, size, points: [{x, y}] } ], isDemo }
            activeIndex: -1,
            isReaderOpen: false,
            activeTool: 'pan',    // 'pan' (sposta/zoom) | 'draw' (evidenziatore mano libera)
            brushColor: '#fde047',
            brushSize: 0.024,     // Spessore normalizzato rispetto alla larghezza immagine
            isHudHidden: false,

            // Stato trasformazione interna SOLO della foto del giornale
            scale: 1,
            panX: 0,
            panY: 0,

            // Gestione multi-touch / pointer unificati (Mouse, Dita, Apple Pencil)
            pointers: new Map(),
            isDraggingPan: false,
            panStartX: 0,
            panStartY: 0,
            initialPinchDist: 0,
            initialPinchScale: 1,
            pinchCenter: { x: 0, y: 0 },

            // Stato tratto a mano libera corrente
            isDrawingStroke: false,
            currentStroke: null
        };

        // Riferimenti DOM
        const ledwallScroll = document.getElementById('ledwall-scroll');
        const loadingPanel = document.getElementById('loading-panel');
        const newspapersGrid = document.getElementById('newspapers-grid');
        const readerOverlay = document.getElementById('reader-overlay');
        const readerViewport = document.getElementById('reader-viewport');
        const transformLayer = document.getElementById('paper-transform-layer');
        const activePaperImg = document.getElementById('active-paper-img');
        const freehandCanvas = document.getElementById('freehand-canvas');
        const canvasCtx = freehandCanvas.getContext('2d');
        const headerBackBtn = document.getElementById('header-back-btn');
        const zoomPctBtn = document.getElementById('zoom-pct-btn');

        /**
         * AVVIO APPLICAZIONE
         */
        window.addEventListener('DOMContentLoaded', () => {
            setupManualUpload();
            setupViewportGestures();
            setupKeyboardControls();
            // Estrazione automatica dal sito brunorachiele.it all'apertura
            fetchFromBlog(false);
        });

        /**
         * 1. ESTRAZIONE AUTOMATICA DAL SITO BRUNORACHIELE.IT
         */
        async function fetchFromBlog(isManualRefresh = false) {
            const syncIcon = document.getElementById('sync-icon');
            syncIcon.classList.add('animate-spin');

            if (appState.papers.length === 0) {
                loadingPanel.classList.remove('hidden');
                newspapersGrid.classList.add('hidden');
            }

            try {
                let extractedPapers = [];

                // Strategia A: Feed JSONP nativo di Blogger (bypassa blocchi CORS su molti browser)
                try {
                    extractedPapers = await fetchViaBloggerJSONP();
                } catch (e) {
                    console.warn('JSONP Blogger non disponibile, passo ai proxy CORS:', e);
                }

                // Strategia B: Proxy CORS multipli sull'URL della pagina HTML
                if (extractedPapers.length === 0) {
                    const proxies = [
                        `https://api.allorigins.win/get?url=${encodeURIComponent(TARGET_BLOG_URL)}`,
                        `https://corsproxy.io/?${encodeURIComponent(TARGET_BLOG_URL)}`,
                        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(TARGET_BLOG_URL)}`
                    ];

                    for (const proxyUrl of proxies) {
                        try {
                            const controller = new AbortController();
                            const timeoutId = setTimeout(() => controller.abort(), 7000);
                            const response = await fetch(proxyUrl, { signal: controller.signal });
                            clearTimeout(timeoutId);

                            if (!response.ok) continue;

                            let htmlContent = '';
                            if (proxyUrl.includes('allorigins.win')) {
                                const json = await response.json();
                                htmlContent = json.contents || '';
                            } else {
                                htmlContent = await response.text();
                            }

                            if (htmlContent && htmlContent.length > 500) {
                                extractedPapers = parseBloggerHTML(htmlContent);
                                if (extractedPapers.length > 0) break;
                            }
                        } catch (err) {
                            console.warn('Tentativo proxy fallito:', proxyUrl);
                        }
                    }
                }

                if (extractedPapers.length > 0) {
                    appState.papers = extractedPapers;
                    if (appState.isReaderOpen) closeReader();
                    renderLedwallGrid();
                    showToast(`Caricate ${extractedPapers.length} prime pagine da brunorachiele.it`);
                } else {
                    throw new Error('Nessuna immagine estratta');
                }

            } catch (error) {
                console.warn('Impossibile raggiungere brunorachiele.it in questo ambiente, carico modalità demo:', error);
                if (appState.papers.length === 0) {
                    loadFallbackDemoPages();
                }
                showToast('Anteprima offline: caricate pagine demo (usa "Aggiorna" su GitHub Pages)');
            } finally {
                syncIcon.classList.remove('animate-spin');
                loadingPanel.classList.add('hidden');
            }
        }

        /**
         * Estrazione tramite JSONP pubblico di Blogger (/feeds/pages/default?alt=json-in-script)
         */
        function fetchViaBloggerJSONP() {
            return new Promise((resolve, reject) => {
                const callbackName = 'bloggerCallback_' + Date.now();
                const script = document.createElement('script');
                const timer = setTimeout(() => {
                    cleanup();
                    reject(new Error('Timeout JSONP'));
                }, 6000);

                function cleanup() {
                    clearTimeout(timer);
                    delete window[callbackName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                }

                window[callbackName] = (data) => {
                    cleanup();
                    try {
                        const entries = (data.feed && data.feed.entry) || [];
                        // Cerca la pagina "prime-pagine-dei-giornali"
                        const targetEntry = entries.find(entry => {
                            const altLink = (entry.link || []).find(l => l.rel === 'alternate');
                            return altLink && altLink.href && altLink.href.includes('prime-pagine');
                        }) || entries[0];

                        if (targetEntry && targetEntry.content && targetEntry.content.$t) {
                            const papers = parseBloggerHTML(targetEntry.content.$t);
                            resolve(papers);
                        } else {
                            resolve([]);
                        }
                    } catch (e) {
                        reject(e);
                    }
                };

                script.src = `https://www.brunorachiele.it/feeds/pages/default?alt=json-in-script&callback=${callbackName}`;
                script.onerror = () => {
                    cleanup();
                    reject(new Error('Errore caricamento script JSONP'));
                };
                document.body.appendChild(script);
            });
        }

        /**
         * Parser HTML intelligente per pagine Blogger:
         * Converte le miniature Blogger (/s320/, /w400/, ecc.) in alta risoluzione (/s1600/)
         */
        function parseBloggerHTML(htmlString) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');

            // Limita la ricerca al corpo del post/pagina se presente
            const postContainer =
                doc.querySelector('.post-body') ||
                doc.querySelector('.entry-content') ||
                doc.querySelector('article') ||
                doc.body;

            const imgElements = Array.from(postContainer.querySelectorAll('img'));
            const seenUrls = new Set();
            const results = [];

            imgElements.forEach((img, index) => {
                let rawSrc = img.getAttribute('src') || img.getAttribute('data-src') || '';
                if (!rawSrc || rawSrc.startsWith('data:')) return;

                // Se l'immagine è avvolta da un link <a> verso l'immagine originale Blogger, preferisci l'href
                const parentLink = img.closest('a');
                if (parentLink) {
                    const href = parentLink.getAttribute('href') || '';
                    if (/\.(jpg|jpeg|png|webp)(\?.*)?$/i.test(href) || href.includes('bp.blogspot.com') || href.includes('blogger.googleusercontent.com')) {
                        rawSrc = href;
                    }
                }

                // Filtra icone, avatar, bottoni social o banner piccoli
                const lowerSrc = rawSrc.toLowerCase();
                if (
                    lowerSrc.includes('icon') ||
                    lowerSrc.includes('logo') ||
                    lowerSrc.includes('avatar') ||
                    lowerSrc.includes('emoji') ||
                    lowerSrc.includes('pixel') ||
                    lowerSrc.includes('facebook') ||
                    lowerSrc.includes('whatsapp') ||
                    lowerSrc.includes('telegram')
                ) {
                    return;
                }

                // Upgrade automatico risoluzione URL Blogger/Googleusercontent -> /s1600/
                const hiResUrl = upgradeBloggerImageUrl(rawSrc);

                if (seenUrls.has(hiResUrl)) return;
                seenUrls.add(hiResUrl);

                // Estrae il nome della testata dall'alt, title o testo vicino
                let title = (img.getAttribute('alt') || img.getAttribute('title') || '').trim();
                if (!title && parentLink) {
                    title = (parentLink.getAttribute('title') || parentLink.textContent || '').trim();
                }
                if (!title) {
                    title = `Quotidiano ${results.length + 1}`;
                }

                results.push({
                    id: 'blog_paper_' + index,
                    title: title,
                    src: hiResUrl,
                    strokes: [],
                    isDemo: false
                });
            });

            return results;
        }

        function upgradeBloggerImageUrl(url) {
            // Sostituisce parametri dimensionali standard di Blogger (/s320/, /w400-h600/, =s320, =w400) con /s1600/
            let upgraded = url
                .replace(/\/s\d+(-c)?\//g, '/s1600/')
                .replace(/\/w\d+-h\d+(-p-k-no-nu)?\//g, '/s1600/')
                .replace(/=s\d+(-c)?$/g, '=s1600')
                .replace(/=w\d+-h\d+.*$/g, '=s1600');

            // Assicura HTTPS
            if (upgraded.startsWith('//')) {
                upgraded = 'https:' + upgraded;
            }
            return upgraded;
        }

        /**
         * Caricamento manuale di backup (se l'utente vuole aggiungere pagine locali)
         */
        function setupManualUpload() {
            const input = document.getElementById('manual-file-input');
            input.addEventListener('change', (e) => {
                const files = Array.from(e.target.files || []).filter(f => f.type.startsWith('image/'));
                if (files.length === 0) return;

                const onlyDemos = appState.papers.every(p => p.isDemo);
                if (onlyDemos) appState.papers = [];

                let loaded = 0;
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        appState.papers.push({
                            id: 'local_' + Date.now() + '_' + loaded,
                            title: file.name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' '),
                            src: ev.target.result,
                            strokes: [],
                            isDemo: false
                        });
                        loaded++;
                        if (loaded === files.length) {
                            if (appState.isReaderOpen) closeReader();
                            renderLedwallGrid();
                            showToast(`${loaded} prime pagine aggiunte dal dispositivo`);
                        }
                    };
                    reader.readAsDataURL(file);
                });
                input.value = '';
            });
        }

        function generateDemoNewspaperDataURL(d) {
            const c = document.createElement('canvas');
            c.width = 720;
            c.height = 1000;
            const g = c.getContext('2d');

            g.fillStyle = '#fcfbf9';
            g.fillRect(0, 0, c.width, c.height);

            g.strokeStyle = '#cbd5e1';
            g.lineWidth = 4;
            g.strokeRect(16, 16, c.width - 32, c.height - 32);

            g.fillStyle = '#64748b';
            g.font = '600 13px Inter, sans-serif';
            g.fillText('EDIZIONE NAZIONALE  |  RASSEGNA STAMPA', 36, 48);
            g.textAlign = 'right';
            g.fillText('€ 1,80', c.width - 36, 48);
            g.textAlign = 'left';

            g.fillStyle = '#0f172a';
            g.fillRect(36, 58, c.width - 72, 3);

            g.fillStyle = d.color;
            g.font = '900 40px "Playfair Display", Georgia, serif';
            g.textAlign = 'center';
            g.fillText(d.name, c.width / 2, 110);
            g.textAlign = 'left';

            g.fillStyle = '#0f172a';
            g.fillRect(36, 128, c.width - 72, 2);

            g.font = '900 36px "Playfair Display", Georgia, serif';
            const endTitleY = drawWrappedText(g, d.head, 36, 182, c.width - 72, 42);

            g.fillStyle = '#475569';
            g.font = '500 18px Inter, sans-serif';
            const endSubY = drawWrappedText(g, d.sub, 36, endTitleY + 10, c.width - 72, 25);

            const boxY = endSubY + 20;
            const boxH = 270;
            const grad = g.createLinearGradient(36, boxY, c.width - 36, boxY + boxH);
            grad.addColorStop(0, '#1e293b');
            grad.addColorStop(1, d.color);
            g.fillStyle = grad;
            g.fillRect(36, boxY, c.width - 72, boxH);

            g.fillStyle = 'rgba(255,255,255,0.85)';
            g.font = '600 14px Inter, sans-serif';
            g.textAlign = 'center';
            g.fillText('SERVIZIO DI APERTURA ALLE PAGINE 2 - 5', c.width / 2, boxY + boxH - 18);
            g.textAlign = 'left';

            const colsY = boxY + boxH + 34;
            const colW = (c.width - 72 - 36) / 3;
            for (let i = 0; i < 3; i++) {
                const x = 36 + i * (colW + 18);
                g.fillStyle = '#0f172a';
                g.font = 'bold 15px "Playfair Display", serif';
                g.fillText(i === 0 ? "L'EDITORIALE" : i === 1 ? "IL RETROSCENA" : "L'INTERVISTA", x, colsY);

                g.fillStyle = '#94a3b8';
                let y = colsY + 18;
                while (y < c.height - 50) {
                    g.fillRect(x, y, (y % 39 === 0) ? colW * 0.7 : colW, 6);
                    y += 13;
                }
            }

            return c.toDataURL('image/jpeg', 0.9);
        }

        function drawWrappedText(ctx, text, x, y, maxW, lineH) {
            const words = text.split(' ');
            let line = '';
            let currY = y;
            for (let i = 0; i < words.length; i++) {
                const test = line + words[i] + ' ';
                if (ctx.measureText(test).width > maxW && i > 0) {
                    ctx.fillText(line, x, currY);
                    line = words[i] + ' ';
                    currY += lineH;
                } else {
                    line = test;
                }
            }
            ctx.fillText(line, x, currY);
            return currY + lineH;
        }

        /**
         * 2. RENDERING GRIGLIA LEDWALL (RESPONSIVE TABLET / DESKTOP)
         */
        function renderLedwallGrid() {
            loadingPanel.classList.add('hidden');
            newspapersGrid.classList.remove('hidden');

            const count = appState.papers.length;
            // Adatta automaticamente le colonne per tablet portrait (2 col) e landscape (4/5 col)
            let gridCols = 'grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5';
            if (count <= 4) gridCols = 'grid-cols-2 sm:grid-cols-4 max-w-6xl';
            else if (count <= 6) gridCols = 'grid-cols-2 sm:grid-cols-3 max-w-5xl';
            else if (count <= 8) gridCols = 'grid-cols-2 sm:grid-cols-4 max-w-7xl';

            newspapersGrid.className = `w-full mx-auto grid gap-4 sm:gap-5 md:gap-6 place-items-center my-auto ${gridCols}`;
            newspapersGrid.innerHTML = '';

            appState.papers.forEach((paper, idx) => {
                const card = document.createElement('div');
                card.className = 'newspaper-card group cursor-pointer w-full max-w-[270px] aspect-[1/1.38] flex flex-col';
                card.onclick = () => openReader(idx);

                const badge = paper.strokes.length > 0
                    ? `<span class="absolute top-2 right-2 bg-amber-400 text-slate-950 text-[11px] font-extrabold px-2 py-0.5 rounded-full shadow">✎ ${paper.strokes.length}</span>`
                    : '';

                card.innerHTML = `

                    ${badge}
                    <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-[#082d57]/95 via-[#0b3d75]/75 to-transparent px-3 py-2.5 pt-7 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex items-center justify-between">
                        <span class="text-white text-xs font-semibold truncate pr-2">${paper.title}</span>
                        <span class="bg-white text-[#0b3d75] text-[10px] font-extrabold px-2 py-0.5 rounded shrink-0">APRI</span>
                    </div>
                `;

                newspapersGrid.appendChild(card);
            });
        }

        /**
         * 3. APERTURA E CHIUSURA DEL GIORNALE (ZOOM INTERNO SOLO SULLA FOTO)
         */
        function openReader(index) {
            if (index < 0 || index >= appState.papers.length) return;

            appState.activeIndex = index;
            appState.isReaderOpen = true;
            const paper = appState.papers[index];

            // Sfoca il ledwall sottostante
            ledwallScroll.classList.add('wall-blurred');

            // Mostra il pulsante "Torna indietro" anche nella barra blu in alto
            headerBackBtn.classList.remove('hidden');
            headerBackBtn.classList.add('flex');

            // Reset zoom interno della foto a 100%
            resetPhotoZoom(false);

            activePaperImg.onload = () => {
                syncCanvasSize();
                redrawAllStrokes();
            };
            activePaperImg.src = paper.src;

            readerOverlay.classList.remove('hidden');
            readerOverlay.classList.add('flex');

            // Nascondi frecce laterali se c'è 1 solo giornale
            const showArrows = appState.papers.length > 1;
            document.getElementById('btn-prev-paper').style.display = showArrows ? 'flex' : 'none';
            document.getElementById('btn-next-paper').style.display = showArrows ? 'flex' : 'none';
        }

        function closeReader() {
            appState.isReaderOpen = false;
            ledwallScroll.classList.remove('wall-blurred');

            readerOverlay.classList.add('hidden');
            readerOverlay.classList.remove('flex');

            headerBackBtn.classList.add('hidden');
            headerBackBtn.classList.remove('flex');

            // Se l'HUD era nascosto in modalità diretta, ripristinalo alla chiusura
            if (appState.isHudHidden) {
                toggleCleanLiveHud();
            }

            renderLedwallGrid();
        }

        function switchPaper(step) {
            if (!appState.isReaderOpen || appState.papers.length <= 1) return;
            let next = appState.activeIndex + step;
            if (next < 0) next = appState.papers.length - 1;
            if (next >= appState.papers.length) next = 0;
            openReader(next);
        }

        /**
         * 4. GESTIONE ZOOM INTERNO ALLA FOTO, PAN E PINCH-TO-ZOOM (SENZA INGRANDIRE LO SCHERMO)
         */
        function changePhotoZoom(delta, smooth = true) {
            const nextScale = Math.min(Math.max(appState.scale + delta, 1), 4.5);
            appState.scale = nextScale;
            if (appState.scale <= 1.02) {
                appState.scale = 1;
                appState.panX = 0;
                appState.panY = 0;
            }
            applyPhotoTransform(smooth);
        }

        function resetPhotoZoom(smooth = true) {
            appState.scale = 1;
            appState.panX = 0;
            appState.panY = 0;
            applyPhotoTransform(smooth);
        }

        function applyPhotoTransform(smooth = false) {
            if (smooth) {
                transformLayer.classList.add('smooth-anim');
            } else {
                transformLayer.classList.remove('smooth-anim');
            }
            // Limita lo spostamento (pan) per non perdere mai la foto fuori dallo schermo
            const maxOffsetX = (transformLayer.offsetWidth * (appState.scale - 1)) / 2 + 80;
            const maxOffsetY = (transformLayer.offsetHeight * (appState.scale - 1)) / 2 + 80;
            if (appState.scale === 1) {
                appState.panX = 0;
                appState.panY = 0;
            } else {
                appState.panX = Math.max(-maxOffsetX, Math.min(maxOffsetX, appState.panX));
                appState.panY = Math.max(-maxOffsetY, Math.min(maxOffsetY, appState.panY));
            }

            transformLayer.style.transform = `translate3d(${appState.panX}px, ${appState.panY}px, 0) scale(${appState.scale})`;
            zoomPctBtn.textContent = `${Math.round(appState.scale * 100)}%`;
        }

        /**
         * 5. GESTI UNIFICATI POINTER EVENTS (Mouse, Touch Tablet, Apple Pencil, Pinch 2 Dita)
         */
        function setupViewportGestures() {
            // Rotellina mouse -> zooma solo la foto
            readerViewport.addEventListener('wheel', (e) => {
                if (!appState.isReaderOpen) return;
                e.preventDefault();
                const delta = e.deltaY < 0 ? 0.25 : -0.25;
                changePhotoZoom(delta, false);
            }, { passive: false });

            // Doppio tap/clic rapido sulla foto per zoom 2x / 100%
            let lastTapTime = 0;
            readerViewport.addEventListener('pointerup', (e) => {
                if (appState.activeTool === 'draw') return;
                const now = Date.now();
                if (now - lastTapTime < 280 && appState.pointers.size === 0) {
                    if (appState.scale > 1.1) {
                        resetPhotoZoom(true);
                    } else {
                        appState.scale = 2.2;
                        applyPhotoTransform(true);
                    }
                }
                lastTapTime = now;
            });

            // Pointer Down
            readerViewport.addEventListener('pointerdown', (e) => {
                if (!appState.isReaderOpen) return;
                readerViewport.setPointerCapture(e.pointerId);
                appState.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                // Se ci sono 2 dita sullo schermo -> Pinch-to-Zoom & Pan simultaneo anche in modalità evidenzia!
                if (appState.pointers.size === 2) {
                    appState.isDrawingStroke = false;
                    appState.currentStroke = null;
                    appState.isDraggingPan = false;

                    const pts = Array.from(appState.pointers.values());
                    appState.initialPinchDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
                    appState.initialPinchScale = appState.scale;
                    appState.pinchCenter = {
                        x: (pts[0].x + pts[1].x) / 2 - appState.panX,
                        y: (pts[0].y + pts[1].y) / 2 - appState.panY
                    };
                    return;
                }

                // Singolo puntatore (1 dito, mouse o Apple Pencil)
                if (appState.pointers.size === 1) {
                    if (appState.activeTool === 'draw') {
                        // Inizia tratto evidenziatore a mano libera
                        const normPt = clientToNormalizedImageCoords(e.clientX, e.clientY);
                        if (normPt) {
                            appState.isDrawingStroke = true;
                            appState.currentStroke = {
                                color: appState.brushColor,
                                size: appState.brushSize,
                                points: [normPt]
                            };
                            redrawAllStrokes();
                            renderStroke(appState.currentStroke);
                        }
                    } else {
                        // Modalità Mano: trascina (pan) la foto
                        appState.isDraggingPan = true;
                        appState.panStartX = e.clientX - appState.panX;
                        appState.panStartY = e.clientY - appState.panY;
                    }
                }
            });

            // Pointer Move
            readerViewport.addEventListener('pointermove', (e) => {
                if (!appState.pointers.has(e.pointerId)) return;
                appState.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                // Gestione Pinch-to-Zoom con 2 dita su tablet
                if (appState.pointers.size === 2) {
                    const pts = Array.from(appState.pointers.values());
                    const currentDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
                    if (appState.initialPinchDist > 10) {
                        const scaleFactor = currentDist / appState.initialPinchDist;
                        appState.scale = Math.min(Math.max(appState.initialPinchScale * scaleFactor, 1), 4.5);
                        const midX = (pts[0].x + pts[1].x) / 2;
                        const midY = (pts[0].y + pts[1].y) / 2;
                        appState.panX = midX - appState.pinchCenter.x;
                        appState.panY = midY - appState.pinchCenter.y;
                        applyPhotoTransform(false);
                    }
                    return;
                }

                // Disegno evidenziatore a mano libera
                if (appState.isDrawingStroke && appState.currentStroke) {
                    const normPt = clientToNormalizedImageCoords(e.clientX, e.clientY);
                    if (normPt) {
                        const pts = appState.currentStroke.points;
                        const last = pts[pts.length - 1];
                        // Registra punto se c'è un movimento minimo per curve fluide
                        if (!last || Math.hypot(normPt.x - last.x, normPt.y - last.y) > 0.0015) {
                            pts.push(normPt);
                            redrawAllStrokes();
                            renderStroke(appState.currentStroke);
                        }
                    }
                    return;
                }

                // Pan della foto
                if (appState.isDraggingPan) {
                    appState.panX = e.clientX - appState.panStartX;
                    appState.panY = e.clientY - appState.panStartY;
                    applyPhotoTransform(false);
                }
            });

            // Pointer Up / Cancel
            const endPointer = (e) => {
                appState.pointers.delete(e.pointerId);

                if (appState.isDrawingStroke && appState.currentStroke) {
                    if (appState.currentStroke.points.length > 0 && appState.papers[appState.activeIndex]) {
                        appState.papers[appState.activeIndex].strokes.push(appState.currentStroke);
                    }
                    appState.isDrawingStroke = false;
                    appState.currentStroke = null;
                    redrawAllStrokes();
                }

                if (appState.pointers.size === 0) {
                    appState.isDraggingPan = false;
                }
            };

            readerViewport.addEventListener('pointerup', endPointer);
            readerViewport.addEventListener('pointercancel', endPointer);

            window.addEventListener('resize', () => {
                if (appState.isReaderOpen) {
                    syncCanvasSize();
                    redrawAllStrokes();
                }
            });
        }

        /**
         * 6. MOTORE EVIDENZIATORE A MANO LIBERA SOLIDALE ALLA FOTO
         */
        function syncCanvasSize() {
            freehandCanvas.width = activePaperImg.naturalWidth || activePaperImg.clientWidth || 800;
            freehandCanvas.height = activePaperImg.naturalHeight || activePaperImg.clientHeight || 1100;
        }

        function clientToNormalizedImageCoords(clientX, clientY) {
            // getBoundingClientRect restituisce le coordinate esatte della foto già scalata e traslata
            const rect = transformLayer.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return null;

            const x = (clientX - rect.left) / rect.width;
            const y = (clientY - rect.top) / rect.height;

            return {
                x: Math.max(0, Math.min(1, x)),
                y: Math.max(0, Math.min(1, y))
            };
        }

        function redrawAllStrokes() {
            canvasCtx.clearRect(0, 0, freehandCanvas.width, freehandCanvas.height);
            const paper = appState.papers[appState.activeIndex];
            if (!paper) return;

            paper.strokes.forEach(stroke => renderStroke(stroke));
        }

        function renderStroke(stroke) {
            const pts = stroke.points;
            if (!pts || pts.length === 0) return;

            const w = freehandCanvas.width;
            const h = freehandCanvas.height;

            canvasCtx.save();
            canvasCtx.strokeStyle = stroke.color;
            canvasCtx.fillStyle = stroke.color;
            canvasCtx.lineWidth = stroke.size * w;
            canvasCtx.lineCap = 'round';
            canvasCtx.lineJoin = 'round';

            if (pts.length === 1) {
                // Singolo tocco / punto
                canvasCtx.beginPath();
                canvasCtx.arc(pts[0].x * w, pts[0].y * h, (stroke.size * w) / 2, 0, Math.PI * 2);
                canvasCtx.fill();
            } else {
                // Curva quadratica smussata per un tratto naturale a mano libera
                canvasCtx.beginPath();
                canvasCtx.moveTo(pts[0].x * w, pts[0].y * h);

                for (let i = 1; i < pts.length - 1; i++) {
                    const xc = ((pts[i].x + pts[i + 1].x) / 2) * w;
                    const yc = ((pts[i].y + pts[i + 1].y) / 2) * h;
                    canvasCtx.quadraticCurveTo(pts[i].x * w, pts[i].y * h, xc, yc);
                }

                const last = pts[pts.length - 1];
                canvasCtx.lineTo(last.x * w, last.y * h);
                canvasCtx.stroke();
            }

            canvasCtx.restore();
        }

        /**
         * CONTROLLI BARRA STRUMENTI
         */
        function setTool(toolName) {
            appState.activeTool = toolName;
            const btnPan = document.getElementById('tool-pan');
            const btnDraw = document.getElementById('tool-draw');

            if (toolName === 'draw') {
                btnDraw.className = 'flex items-center gap-1.5 px-3 h-9 rounded-lg text-xs sm:text-sm font-semibold bg-amber-400 text-slate-950 shadow transition cursor-pointer';
                btnPan.className = 'flex items-center gap-1.5 px-3 h-9 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:text-white transition cursor-pointer';
                transformLayer.style.cursor = 'crosshair';
            } else {
                btnPan.className = 'flex items-center gap-1.5 px-3 h-9 rounded-lg text-xs sm:text-sm font-semibold bg-[#0b3d75] text-white shadow transition cursor-pointer';
                btnDraw.className = 'flex items-center gap-1.5 px-3 h-9 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:text-white transition cursor-pointer';
                transformLayer.style.cursor = 'grab';
            }
        }

        function setBrushColor(hexColor, btnEl) {
            appState.brushColor = hexColor;
            document.querySelectorAll('.swatch-btn').forEach(b => {
                b.classList.remove('ring-2', 'ring-white', 'scale-110');
                b.classList.add('opacity-80');
            });
            btnEl.classList.add('ring-2', 'ring-white', 'scale-110');
            btnEl.classList.remove('opacity-80');

            // Attiva subito l'evidenziatore quando si tocca un colore
            if (appState.activeTool !== 'draw') {
                setTool('draw');
            }
        }

        function setBrushSize(normSize, btnEl) {
            appState.brushSize = normSize;
            document.querySelectorAll('.size-btn').forEach(b => {
                b.classList.remove('bg-slate-700', 'text-white');
                b.classList.add('text-slate-300');
            });
            btnEl.classList.add('bg-slate-700', 'text-white');
            btnEl.classList.remove('text-slate-300');

            if (appState.activeTool !== 'draw') {
                setTool('draw');
            }
        }

        function undoStroke() {
            const paper = appState.papers[appState.activeIndex];
            if (paper && paper.strokes.length > 0) {
                paper.strokes.pop();
                redrawAllStrokes();
            }
        }

        function clearStrokes() {
            const paper = appState.papers[appState.activeIndex];
            if (paper && paper.strokes.length > 0) {
                paper.strokes = [];
                redrawAllStrokes();
                showToast('Evidenziature cancellate');
            }
        }

        function toggleCleanLiveHud() {
            appState.isHudHidden = !appState.isHudHidden;
            const toolbar = document.getElementById('reader-toolbar');
            const showBtn = document.getElementById('show-hud-btn');
            const prevBtn = document.getElementById('btn-prev-paper');
            const nextBtn = document.getElementById('btn-next-paper');

            if (appState.isHudHidden) {
                toolbar.classList.add('hud-hidden');
                prevBtn.classList.add('opacity-0', 'pointer-events-none');
                nextBtn.classList.add('opacity-0', 'pointer-events-none');
                showBtn.classList.remove('hidden');
                showBtn.classList.add('flex');
            } else {
                toolbar.classList.remove('hud-hidden');
                prevBtn.classList.remove('opacity-0', 'pointer-events-none');
                nextBtn.classList.remove('opacity-0', 'pointer-events-none');
                showBtn.classList.add('hidden');
                showBtn.classList.remove('flex');
            }
        }

        /**
         * SCORCIATOIE DA TASTIERA (per uso con tastiera Bluetooth su tablet o Mac)
         */
        function setupKeyboardControls() {
            window.addEventListener('keydown', (e) => {
                if (!appState.isReaderOpen) return;
                if (e.key === 'Escape') closeReader();
                if (e.key === 'ArrowRight') switchPaper(1);
                if (e.key === 'ArrowLeft') switchPaper(-1);
                if (e.key === '+' || e.key === '=') changePhotoZoom(0.3);
                if (e.key === '-') changePhotoZoom(-0.3);
                if (e.key === '0') resetPhotoZoom(true);
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    undoStroke();
                }
            });
        }

        /**
         * TOAST NOTIFICHE DISCRETE
         */
        let toastTimer = null;
        function showToast(text) {
            const toast = document.getElementById('toast-banner');
            toast.textContent = text;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
