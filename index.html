<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="br.it/ledwall" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>br.it/ledwall - Rassegna Stampa</title>
  <style>
    :root {
      --brand-blue: #0b3d75;
      --brand-blue-dark: #072a52;
      --brand-accent: #1d6fd1;
      --studio-bg: #e7ebf0;
      --studio-bg-light: #f5f7fa;
      --live-red: #e52521;
      --header-h: 44px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 25%, var(--studio-bg-light) 0%, var(--studio-bg) 75%, #d6dde6 100%);
      color: #1a2433;
    }

    /* TOP BAR SOTTILE SU UNICA RIGA */
    header.topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(var(--header-h) + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      background: linear-gradient(180deg, var(--brand-blue) 0%, var(--brand-blue-dark) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      box-shadow: 0 2px 10px rgba(7, 42, 82, 0.25);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      overflow: hidden;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--live-red);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 3px 7px;
      border-radius: 4px;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(229, 37, 33, 0.5);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 1.4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #fff;
      white-space: nowrap;
      cursor: pointer;
    }

    .brand-divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }

    .view-subtitle {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.82);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-top {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 28px;
      padding: 0 10px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.2s;
    }

    .btn-top:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .btn-top:active {
      transform: scale(0.97);
    }

    .btn-icon-only {
      padding: 0 7px;
    }

    body.on-air-clean #btnRefresh {
      display: none;
    }

    body.on-air-clean #btnToggleClean {
      opacity: 0.35;
      border-color: transparent;
      background: transparent;
    }

    /* MURO LEDWALL / GRIGLIA GIORNALI */
    main.ledwall-stage {
      position: fixed;
      top: calc(var(--header-h) + env(safe-area-inset-top));
      left: 0;
      right: 0;
      bottom: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 18px 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wall-grid {
      width: 100%;
      max-width: 1520px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 18px;
      align-items: start;
    }

    @media (min-width: 1024px) {
      .wall-grid {
        grid-template-columns: repeat(5, 1fr);
        gap: 20px;
      }
    }

    @media (max-width: 768px) {
      .wall-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
    }

    .paper-card {
      position: relative;
      background: #fff;
      border-radius: 4px;
      padding: 5px;
      box-shadow: 0 8px 20px rgba(15, 28, 46, 0.14), 0 1px 3px rgba(15, 28, 46, 0.1);
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.22s ease;
      aspect-ratio: 1 / 1.38;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .paper-card:hover {
      transform: translateY(-4px) scale(1.015);
      box-shadow: 0 14px 28px rgba(11, 61, 117, 0.22);
    }

    .paper-card:active {
      transform: scale(0.98);
    }

    .paper-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      border-radius: 2px;
      display: block;
      background: #f0f2f5;
    }

    .paper-badge-edited {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffeb3b;
      border: 1.5px solid #0b3d75;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      display: none;
    }

    .paper-card.has-marks .paper-badge-edited {
      display: block;
    }

    /* STATO CARICAMENTO / ERRORE */
    .status-banner {
      margin: auto;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 24px 32px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(11, 61, 117, 0.12);
      max-width: 440px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #d0dbe8;
      border-top-color: var(--brand-blue);
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* VIEWER SINGOLO GIORNALE (ZOOM INTERNO + EVIDENZIATORE) */
    .viewer-overlay {
      position: fixed;
      top: calc(var(--header-h) + env(safe-area-inset-top));
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(226, 232, 240, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 90;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .viewer-overlay.active {
      display: flex;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* RIQUADRO FISSO IN CUI LA FOTO SI INGRANDISCE INTERNAMENTE */
    .viewport-frame {
      position: relative;
      width: min(92vw, 760px);
      height: calc(100% - 76px);
      margin-bottom: 58px;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 22px 55px rgba(10, 25, 47, 0.28);
      overflow: hidden;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .zoom-layer {
      position: relative;
      transform-origin: 0 0;
      will-change: transform;
      display: inline-block;
    }

    .zoom-layer img {
      display: block;
      max-width: min(92vw, 760px);
      max-height: calc(100vh - var(--header-h) - 82px);
      width: auto;
      height: auto;
      pointer-events: none;
    }

    .draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .viewport-frame.draw-mode .draw-canvas {
      pointer-events: auto;
      cursor: crosshair;
    }

    /* FRECCE NAVIGAZIONE LATERALI */
    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-20%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(11, 61, 117, 0.18);
      background: rgba(255, 255, 255, 0.92);
      color: var(--brand-blue);
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
      z-index: 95;
    }

    .nav-arrow:active {
      transform: translateY(-20%) scale(0.92);
    }

    .nav-prev { left: max(12px, env(safe-area-inset-left)); }
    .nav-next { right: max(12px, env(safe-area-inset-right)); }

    /* BARRA STRUMENTI IN BASSO (TORNA INDIETRO, ZOOM FOTO, EVIDENZIATORI) */
    .viewer-dock {
      position: fixed;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 61, 117, 0.96);
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 28px rgba(7, 42, 82, 0.35);
      z-index: 96;
      max-width: 96vw;
      overflow-x: auto;
    }

    .dock-btn {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
    }

    .dock-btn.primary-back {
      background: #fff;
      color: var(--brand-blue);
      border-color: #fff;
    }

    .dock-btn.active-tool {
      background: #ffeb3b;
      color: #072a52;
      border-color: #ffeb3b;
    }

    .dock-sep {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.22);
      flex-shrink: 0;
    }

    .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.5);
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .color-dot.selected {
      transform: scale(1.2);
      border-color: #fff;
      box-shadow: 0 0 0 2px #0b3d75, 0 0 0 4px #fff;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIORE COMPATTA SU UNICA RIGA -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="live-badge"><span class="live-dot"></span>LIVE</span>
      <span class="brand-title" id="brandLogo" title="Doppio tocco per mostrare/nascondere controlli">br.it/ledwall</span>
      <span class="brand-divider"></span>
      <span class="view-subtitle" id="headerSubtitle">Prime Pagine</span>
    </div>
    <div class="topbar-right">
      <button class="btn-top" id="btnRefresh" title="Ricarica prime pagine dal sito">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        <span>Aggiorna</span>
      </button>
      <button class="btn-top btn-icon-only" id="btnToggleClean" title="Nascondi/Mostra tasto Aggiorna in onda">
        <svg id="eyeIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>
  </header>

  <!-- MURO GIORNALI -->
  <main class="ledwall-stage" id="ledwallStage">
    <div class="status-banner" id="statusBox">
      <div class="spinner"></div>
      <div style="font-weight:700; color:#0b3d75; margin-bottom:4px;">Caricamento Prime Pagine...</div>
      <div style="font-size:12px; color:#52637a;">Estrazione da brunorachiele.it</div>
    </div>
    <div class="wall-grid" id="wallGrid" style="display:none;"></div>
  </main>

  <!-- VIEWER SINGOLO GIORNALE -->
  <div class="viewer-overlay" id="viewerOverlay">
    <button class="nav-arrow nav-prev" id="btnPrev" title="Precedente">&#8249;</button>
    <button class="nav-arrow nav-next" id="btnNext" title="Successivo">&#8250;</button>

    <div class="viewport-frame" id="viewportFrame">
      <div class="zoom-layer" id="zoomLayer">
        <img id="activeImage" alt="Prima Pagina" crossorigin="anonymous" />
        <canvas class="draw-canvas" id="drawCanvas"></canvas>
      </div>
    </div>

    <div class="viewer-dock">
      <button class="dock-btn primary-back" id="btnBack">&#8592; Torna indietro</button>
      <div class="dock-sep"></div>
      <button class="dock-btn" id="btnZoomOut" title="Riduci foto">&#8722;</button>
      <button class="dock-btn" id="btnZoomReset" title="Adatta foto">100%</button>
      <button class="dock-btn" id="btnZoomIn" title="Ingrandisci foto">&#43;</button>
      <div class="dock-sep"></div>
      <button class="dock-btn" id="btnDrawToggle">Evidenzia</button>
      <span class="color-dot selected" data-color="rgba(255, 238, 0, 0.55)" style="background:#ffee00;" title="Giallo"></span>
      <span class="color-dot" data-color="rgba(0, 230, 118, 0.45)" style="background:#00e676;" title="Verde"></span>
      <span class="color-dot" data-color="rgba(255, 82, 82, 0.45)" style="background:#ff5252;" title="Rosso"></span>
      <button class="dock-btn" id="btnClearMarks" title="Cancella tratti">Pulisci</button>
    </div>
  </div>

  <script>
    const TARGET_PAGE_URL = 'https://www.brunorachiele.it/p/prime-pagine-dei-giornali.html';
    const BLOG_ORIGIN = 'https://www.brunorachiele.it';

    let newspapers = []; // { id, title, url, strokes: [] }
    let currentIndex = -1;

    // Stato zoom/pan interno alla foto
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isDrawMode = false;
    let currentColor = 'rgba(255, 238, 0, 0.55)';

    const wallGrid = document.getElementById('wallGrid');
    const statusBox = document.getElementById('statusBox');
    const headerSubtitle = document.getElementById('headerSubtitle');
    const viewerOverlay = document.getElementById('viewerOverlay');
    const viewportFrame = document.getElementById('viewportFrame');
    const zoomLayer = document.getElementById('zoomLayer');
    const activeImage = document.getElementById('activeImage');
    const drawCanvas = document.getElementById('drawCanvas');
    const ctx = drawCanvas.getContext('2d');

    // Pulizia schermo in onda
    const toggleClean = () => document.body.classList.toggle('on-air-clean');
    document.getElementById('btnToggleClean').addEventListener('click', toggleClean);
    document.getElementById('brandLogo').addEventListener('dblclick', toggleClean);

    // Converte URL immagine Blogger in alta risoluzione
    function upgradeBloggerImg(src) {
      if (!src) return '';
      if (src.startsWith('//')) src = 'https:' + src;
      return src
        .replace(/\/s\d+(-c)?\//g, '/s1600/')
        .replace(/\/w\d+-h\d+(-p-k-no-nu|-c)?\//g, '/s1600/')
        .replace(/=s\d+(-c)?$/g, '=s1600')
        .replace(/=w\d+-h\d+.*$/g, '=s1600');
    }

    function extractImagesFromHtml(htmlString) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlString, 'text/html');
      const container = doc.querySelector('.post-body, .entry-content, article') || doc.body;
      const imgs = Array.from(container.querySelectorAll('img'));
      const seen = new Set();
      const results = [];

      imgs.forEach((img, idx) => {
        let src = img.getAttribute('data-src') || img.getAttribute('src') || '';
        if (!src || src.startsWith('data:')) return;
        const lower = src.toLowerCase();
        if (lower.includes('icon') || lower.includes('logo') || lower.includes('avatar') || lower.includes('badge') || lower.includes('button')) return;

        const highRes = upgradeBloggerImg(src);
        if (seen.has(highRes)) return;
        seen.add(highRes);

        const rawTitle = (img.getAttribute('alt') || img.getAttribute('title') || '').trim();
        results.push({
          id: 'np-' + idx,
          title: rawTitle || `Quotidiano ${results.length + 1}`,
          url: highRes,
          strokes: []
        });
      });
      return results;
    }

    // Estrazione tramite JSONP ufficiale Blogger (nessun problema CORS)
    function fetchViaBloggerJsonp() {
      return new Promise((resolve, reject) => {
        const cbName = 'brJsonpCb_' + Date.now();
        const script = document.createElement('script');
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error('Timeout JSONP'));
        }, 7000);

        function cleanup() {
          clearTimeout(timer);
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cbName] = (data) => {
          cleanup();
          try {
            const entries = (data && data.feed && data.feed.entry) || [];
            const targetEntry = entries.find(e => {
              const altLink = (e.link || []).find(l => l.rel === 'alternate');
              return altLink && altLink.href && altLink.href.includes('prime-pagine-dei-giornali');
            }) || entries[0];

            if (!targetEntry || !targetEntry.content) {
              reject(new Error('Pagina non trovata nel feed'));
              return;
            }
            const items = extractImagesFromHtml(targetEntry.content.$t);
            if (items.length > 0) resolve(items);
            else reject(new Error('Nessuna immagine trovata'));
          } catch (err) {
            reject(err);
          }
        };

        script.src = `${BLOG_ORIGIN}/feeds/pages/default?alt=json-in-script&max-results=30&callback=${cbName}`;
        script.onerror = () => {
          cleanup();
          reject(new Error('Errore rete JSONP'));
        };
        document.body.appendChild(script);
      });
    }

    // Fallback tramite proxy CORS sull'URL diretto della pagina
    async function fetchViaProxy() {
      const proxies = [
        `https://api.allorigins.win/get?url=${encodeURIComponent(TARGET_PAGE_URL)}`,
        `https://corsproxy.io/?${encodeURIComponent(TARGET_PAGE_URL)}`
      ];
      for (const proxyUrl of proxies) {
        try {
          const res = await fetch(proxyUrl);
          if (!res.ok) continue;
          const text = await res.text();
          let html = text;
          if (proxyUrl.includes('allorigins')) {
            const parsed = JSON.parse(text);
            html = parsed.contents || '';
          }
          const items = extractImagesFromHtml(html);
          if (items.length > 0) return items;
        } catch (e) {}
      }
      throw new Error('Impossibile raggiungere brunorachiele.it');
    }

    async function loadNewspapers() {
      statusBox.style.display = 'block';
      wallGrid.style.display = 'none';
      statusBox.innerHTML = `
        <div class="spinner"></div>
        <div style="font-weight:700; color:#0b3d75; margin-bottom:4px;">Aggiornamento Prime Pagine...</div>
        <div style="font-size:12px; color:#52637a;">brunorachiele.it</div>
      `;

      try {
        let items = [];
        try {
          items = await fetchViaBloggerJsonp();
        } catch (e) {
          items = await fetchViaProxy();
        }
        newspapers = items;
        renderWall();
      } catch (err) {
        statusBox.innerHTML = `
          <div style="font-weight:700; color:#b91c1c; margin-bottom:6px;">Connessione non riuscita</div>
          <div style="font-size:12px; color:#52637a; margin-bottom:14px;">Verifica la connessione internet e riprova.</div>
          <button onclick="loadNewspapers()" style="background:#0b3d75; color:#fff; border:none; padding:8px 16px; border-radius:6px; font-weight:700; cursor:pointer;">Riprova ora</button>
        `;
      }
    }

    function renderWall() {
      statusBox.style.display = 'none';
      wallGrid.style.display = 'grid';
      wallGrid.innerHTML = '';

      newspapers.forEach((paper, idx) => {
        const card = document.createElement('div');
        card.className = 'paper-card' + (paper.strokes.length ? ' has-marks' : '');
        card.innerHTML = `
          <img src="${paper.url}" alt="${paper.title}" loading="lazy" />
          <span class="paper-badge-edited" title="Evidenziato"></span>
        `;
        card.addEventListener('click', () => openNewspaper(idx));
        wallGrid.appendChild(card);
      });
    }

    // APERTURA SINGOLA PAGINA
    function openNewspaper(index) {
      if (index < 0 || index >= newspapers.length) return;
      currentIndex = index;
      const paper = newspapers[currentIndex];
      headerSubtitle.textContent = paper.title;

      resetZoom(false);
      viewerOverlay.classList.add('active');

      activeImage.onload = () => {
        drawCanvas.width = activeImage.naturalWidth || activeImage.clientWidth;
        drawCanvas.height = activeImage.naturalHeight || activeImage.clientHeight;
        redrawStrokes();
      };
      activeImage.src = paper.url;
    }

    function closeNewspaper() {
      viewerOverlay.classList.remove('active');
      headerSubtitle.textContent = 'Prime Pagine';
      currentIndex = -1;
      renderWall();
    }

    document.getElementById('btnBack').addEventListener('click', closeNewspaper);
    document.getElementById('btnRefresh').addEventListener('click', loadNewspapers);

    document.getElementById('btnPrev').addEventListener('click', () => {
      const nextIdx = (currentIndex - 1 + newspapers.length) % newspapers.length;
      openNewspaper(nextIdx);
    });

    document.getElementById('btnNext').addEventListener('click', () => {
      const nextIdx = (currentIndex + 1) % newspapers.length;
      openNewspaper(nextIdx);
    });

    // GESTIONE ZOOM E PAN INTERNO ALLA FOTO
    function applyTransform() {
      const frameW = viewportFrame.clientWidth;
      const frameH = viewportFrame.clientHeight;
      const imgW = activeImage.clientWidth * scale;
      const imgH = activeImage.clientHeight * scale;

      if (imgW <= frameW) {
        panX = (frameW - imgW) / 2;
      } else {
        const minX = frameW - imgW;
        panX = Math.min(0, Math.max(minX, panX));
      }

      if (imgH <= frameH) {
        panY = (frameH - imgH) / 2;
      } else {
        const minY = frameH - imgH;
        panY = Math.min(0, Math.max(minY, panY));
      }

      zoomLayer.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${scale})`;
      document.getElementById('btnZoomReset').textContent = Math.round(scale * 100) + '%';
    }

    function resetZoom(animate = true) {
      scale = 1;
      panX = 0;
      panY = 0;
      zoomLayer.style.transition = animate ? 'transform 0.2s ease-out' : 'none';
      requestAnimationFrame(() => {
        applyTransform();
        setTimeout(() => { zoomLayer.style.transition = 'none'; }, 210);
      });
    }

    function zoomBy(factor, centerX, centerY) {
      const oldScale = scale;
      const newScale = Math.min(4.5, Math.max(1, oldScale * factor));
      if (newScale === oldScale) return;

      const rect = viewportFrame.getBoundingClientRect();
      const cx = (centerX !== undefined ? centerX - rect.left : rect.width / 2);
      const cy = (centerY !== undefined ? centerY - rect.top : rect.height / 2);

      panX = cx - (cx - panX) * (newScale / oldScale);
      panY = cy - (cy - panY) * (newScale / oldScale);
      scale = newScale;
      applyTransform();
    }

    document.getElementById('btnZoomIn').addEventListener('click', () => zoomBy(1.35));
    document.getElementById('btnZoomOut').addEventListener('click', () => zoomBy(1 / 1.35));
    document.getElementById('btnZoomReset').addEventListener('click', () => resetZoom(true));

    viewportFrame.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      zoomBy(factor, e.clientX, e.clientY);
    }, { passive: false });

    // GESTURE TOUCH & MOUSE (PAN + PINCH-TO-ZOOM SULLA FOTO)
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initialPinchDist = 0;
    let initialPinchScale = 1;

    viewportFrame.addEventListener('touchstart', (e) => {
      if (isDrawMode) return;
      if (e.touches.length === 2) {
        isDragging = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        initialPinchDist = Math.hypot(dx, dy);
        initialPinchScale = scale;
      } else if (e.touches.length === 1 && scale > 1) {
        isDragging = true;
        dragStartX = e.touches[0].clientX - panX;
        dragStartY = e.touches[0].clientY - panY;
      }
    }, { passive: true });

    viewportFrame.addEventListener('touchmove', (e) => {
      if (isDrawMode) return;
      if (e.touches.length === 2 && initialPinchDist > 0) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const targetScale = Math.min(4.5, Math.max(1, initialPinchScale * (dist / initialPinchDist)));
        zoomBy(targetScale / scale, midX, midY);
      } else if (e.touches.length === 1 && isDragging && scale > 1) {
        e.preventDefault();
        panX = e.touches[0].clientX - dragStartX;
        panY = e.touches[0].clientY - dragStartY;
        applyTransform();
      }
    }, { passive: false });

    viewportFrame.addEventListener('touchend', () => {
      isDragging = false;
      initialPinchDist = 0;
    });

    viewportFrame.addEventListener('mousedown', (e) => {
      if (isDrawMode || scale <= 1) return;
      isDragging = true;
      dragStartX = e.clientX - panX;
      dragStartY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging || isDrawMode) return;
      panX = e.clientX - dragStartX;
      panY = e.clientY - dragStartY;
      applyTransform();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // EVIDENZIATORE A MANO LIBERA ANCORATO ALLA PAGINA
    const btnDrawToggle = document.getElementById('btnDrawToggle');
    btnDrawToggle.addEventListener('click', () => {
      isDrawMode = !isDrawMode;
      btnDrawToggle.classList.toggle('active-tool', isDrawMode);
      viewportFrame.classList.toggle('draw-mode', isDrawMode);
    });

    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
        dot.classList.add('selected');
        currentColor = dot.dataset.color;
        if (!isDrawMode) btnDrawToggle.click();
      });
    });

    document.getElementById('btnClearMarks').addEventListener('click', () => {
      if (currentIndex < 0) return;
      newspapers[currentIndex].strokes = [];
      redrawStrokes();
    });

    let activeStroke = null;

    function getCanvasCoords(clientX, clientY) {
      const rect = drawCanvas.getBoundingClientRect();
      const x = ((clientX - rect.left) / rect.width) * drawCanvas.width;
      const y = ((clientY - rect.top) / rect.height) * drawCanvas.height;
      return { x, y };
    }

    function startStroke(clientX, clientY) {
      if (!isDrawMode || currentIndex < 0) return;
      const pt = getCanvasCoords(clientX, clientY);
      const brushSize = Math.max(18, drawCanvas.width * 0.028);
      activeStroke = { color: currentColor, size: brushSize, points: [pt] };
      newspapers[currentIndex].strokes.push(activeStroke);
      redrawStrokes();
    }

    function moveStroke(clientX, clientY) {
      if (!activeStroke) return;
      activeStroke.points.push(getCanvasCoords(clientX, clientY));
      redrawStrokes();
    }

    function endStroke() {
      activeStroke = null;
    }

    drawCanvas.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      drawCanvas.setPointerCapture(e.pointerId);
      startStroke(e.clientX, e.clientY);
    });

    drawCanvas.addEventListener('pointermove', (e) => {
      if (!activeStroke) return;
      e.stopPropagation();
      moveStroke(e.clientX, e.clientY);
    });

    drawCanvas.addEventListener('pointerup', endStroke);
    drawCanvas.addEventListener('pointercancel', endStroke);

    function redrawStrokes() {
      ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      if (currentIndex < 0) return;
      const strokes = newspapers[currentIndex].strokes;
      strokes.forEach(s => {
        if (!s.points.length) return;
        ctx.save();
        ctx.strokeStyle = s.color;
        ctx.lineWidth = s.size;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(s.points[0].x, s.points[0].y);
        for (let i = 1; i < s.points.length; i++) {
          ctx.lineTo(s.points[i].x, s.points[i].y);
        }
        if (s.points.length === 1) {
          ctx.lineTo(s.points[0].x + 0.1, s.points[0].y);
        }
        ctx.stroke();
        ctx.restore();
      });
    }

    window.addEventListener('resize', () => {
      if (viewerOverlay.classList.contains('active')) applyTransform();
    });

    // Avvio automatico
    loadNewspapers();
  </script>
</body>
</html>
