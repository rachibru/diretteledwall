<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="br.it/ledwall" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>br.it/ledwall - Quotidiani Online</title>
  <style>
    :root {
      --brand-blue: #0b3d75;
      --brand-blue-dark: #072a52;
      --studio-bg: #e7ebf0;
      --studio-bg-light: #f5f7fa;
      --live-red: #e52521;
      --header-h: 44px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 25%, var(--studio-bg-light) 0%, var(--studio-bg) 75%, #d6dde6 100%);
      color: #1a2433;
    }

    /* TOP BAR UNICA RIGA */
    header.topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(var(--header-h) + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      background: linear-gradient(180deg, var(--brand-blue) 0%, var(--brand-blue-dark) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      box-shadow: 0 2px 10px rgba(7, 42, 82, 0.25);
      gap: 10px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      overflow: hidden;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--live-red);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 3px 7px;
      border-radius: 4px;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(229, 37, 33, 0.5);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 1.4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #fff;
      white-space: nowrap;
      cursor: pointer;
    }

    .brand-divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }

    .view-subtitle {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .topbar-right::-webkit-scrollbar {
      display: none;
    }

    .filter-pill {
      height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.9);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .filter-pill.active {
      background: #fff;
      color: var(--brand-blue);
      border-color: #fff;
    }

    .btn-icon-only {
      height: 26px;
      padding: 0 7px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }

    body.on-air-clean .filter-pill {
      display: none;
    }

    body.on-air-clean #btnToggleClean {
      opacity: 0.35;
      border-color: transparent;
      background: transparent;
    }

    /* LIBRERIA ORIZZONTALE A 2 RIGHE */
    main.ledwall-stage {
      position: fixed;
      top: calc(var(--header-h) + env(safe-area-inset-top));
      left: 0;
      right: 0;
      bottom: 0;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 20px 26px;
      display: flex;
      align-items: center;
      scrollbar-width: none;
    }

    main.ledwall-stage::-webkit-scrollbar {
      display: none;
    }

    .wall-grid {
      height: 100%;
      display: grid;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      grid-auto-flow: column;
      grid-auto-columns: max-content;
      gap: 20px 22px;
      align-items: center;
      padding-right: 26px;
    }

    .site-card {
      position: relative;
      height: 100%;
      aspect-ratio: 1.45 / 1;
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 8px 22px rgba(15, 28, 46, 0.12), 0 1px 3px rgba(15, 28, 46, 0.08);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      border-top: 4px solid var(--accent-color, #0b3d75);
      text-decoration: none;
    }

    .site-card:active {
      transform: scale(0.96);
    }

    .site-logo-wrap {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
    }

    .site-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .site-name {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      text-align: center;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .site-cat-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      padding: 3px 9px;
      border-radius: 999px;
      background: #eef2f7;
      color: #475569;
    }

    /* LAVAGNA SCREENSHOT / EVIDENZIATORE ISTANTANEO 60FPS */
    .board-overlay {
      position: fixed;
      top: calc(var(--header-h) + env(safe-area-inset-top));
      left: 0;
      right: 0;
      bottom: 0;
      background: #e7ebf0;
      z-index: 90;
      display: none;
      overflow: hidden;
      touch-action: none;
    }

    .board-overlay.active {
      display: block;
    }

    .pdf-canvas-surface {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }

    .zoom-layer {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
      display: inline-block;
      box-shadow: 0 22px 60px rgba(10, 25, 47, 0.25);
      background: #fff;
    }

    .zoom-layer img {
      display: block;
      max-width: none;
      max-height: none;
      pointer-events: none;
    }

    .draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .pdf-canvas-surface.draw-mode .draw-canvas {
      pointer-events: auto;
    }

    /* BARRA STRUMENTI IN BASSO */
    .viewer-dock {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 61, 117, 0.96);
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 28px rgba(7, 42, 82, 0.35);
      z-index: 96;
      max-width: 96vw;
      overflow-x: auto;
    }

    .dock-btn {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
    }

    .dock-btn.primary-back {
      background: #fff;
      color: var(--brand-blue);
      border-color: #fff;
    }

    .dock-btn.active-tool {
      background: #ffeb3b;
      color: #072a52;
      border-color: #ffeb3b;
    }

    .dock-sep {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.22);
      flex-shrink: 0;
    }

    .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.5);
      cursor: pointer;
      flex-shrink: 0;
    }

    .color-dot.selected {
      transform: scale(1.2);
      border-color: #fff;
      box-shadow: 0 0 0 2px #0b3d75, 0 0 0 4px #fff;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIORE -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="live-badge"><span class="live-dot"></span>LIVE</span>
      <span class="brand-title" id="brandLogo">br.it/ledwall</span>
      <span class="brand-divider"></span>
      <span class="view-subtitle" id="headerSubtitle">Quotidiani Online</span>
    </div>
    <div class="topbar-right">
      <button class="filter-pill active" data-filter="all">Tutti</button>
      <button class="filter-pill" data-filter="italiani">Italiani</button>
      <button class="filter-pill" data-filter="economici">Economici</button>
      <button class="filter-pill" data-filter="esteri">Esteri</button>
      <button class="filter-pill" id="btnPasteBoard" style="background:#ffeb3b; color:#072a52; border-color:#ffeb3b;">+ Incolla Screenshot</button>
      <button class="btn-icon-only" id="btnToggleClean" title="Nascondi filtri in onda">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>
  </header>

  <!-- LIBRERIA LOGHI TESTATE (APERTURA DIRETTA ISTANTANEA) -->
  <main class="ledwall-stage" id="ledwallStage">
    <div class="wall-grid" id="wallGrid"></div>
  </main>

  <!-- LAVAGNA SCREENSHOT / ARTICOLO (ZOOM + EVIDENZIATORE 60FPS) -->
  <div class="board-overlay" id="boardOverlay">
    <div class="pdf-canvas-surface" id="pdfSurface">
      <div class="zoom-layer" id="zoomLayer">
        <img id="activeImage" alt="Articolo" />
        <canvas class="draw-canvas" id="drawCanvas"></canvas>
      </div>
    </div>

    <div class="viewer-dock">
      <button class="dock-btn primary-back" id="btnBack">&#8592; Torna ai giornali</button>
      <div class="dock-sep"></div>
      <button class="dock-btn" id="btnZoomOut">&#8722;</button>
      <button class="dock-btn" id="btnZoomReset">100%</button>
      <button class="dock-btn" id="btnZoomIn">&#43;</button>
      <div class="dock-sep"></div>
      <button class="dock-btn active-tool" id="btnDrawToggle">Evidenzia</button>
      <span class="color-dot selected" data-color="rgba(255, 238, 0, 0.45)" style="background:#ffee00;"></span>
      <span class="color-dot" data-color="rgba(0, 230, 118, 0.38)" style="background:#00e676;"></span>
      <span class="color-dot" data-color="rgba(255, 82, 82, 0.38)" style="background:#ff5252;"></span>
      <button class="dock-btn" id="btnClearMarks">Pulisci</button>
    </div>
  </div>

  <script>
    const NEWSPAPER_SITES = [
      // ITALIANI
      { name: 'Corriere della Sera', domain: 'corriere.it', url: 'https://www.corriere.it', cat: 'italiani', color: '#004b87' },
      { name: 'la Repubblica', domain: 'repubblica.it', url: 'https://www.repubblica.it', cat: 'italiani', color: '#0066b3' },
      { name: 'La Stampa', domain: 'lastampa.it', url: 'https://www.lastampa.it', cat: 'italiani', color: '#1e3a8a' },
      { name: 'Il Fatto Quotidiano', domain: 'ilfattoquotidiano.it', url: 'https://www.ilfattoquotidiano.it', cat: 'italiani', color: '#b91c1c' },
      { name: 'il Giornale', domain: 'ilgiornale.it', url: 'https://www.ilgiornale.it', cat: 'italiani', color: '#0369a1' },
      { name: 'Libero Quotidiano', domain: 'liberoquotidiano.it', url: 'https://www.liberoquotidiano.it', cat: 'italiani', color: '#dc2626' },
      { name: 'La Verità', domain: 'laverita.info', url: 'https://www.laverita.info', cat: 'italiani', color: '#991b1b' },
      { name: 'Il Messaggero', domain: 'ilmessaggero.it', url: 'https://www.ilmessaggero.it', cat: 'italiani', color: '#1d4ed8' },
      { name: 'Avvenire', domain: 'avvenire.it', url: 'https://www.avvenire.it', cat: 'italiani', color: '#0284c7' },
      { name: 'Domani', domain: 'editorialedomani.it', url: 'https://www.editorialedomani.it', cat: 'italiani', color: '#ea580c' },
      { name: 'Il Foglio', domain: 'ilfoglio.it', url: 'https://www.ilfoglio.it', cat: 'italiani', color: '#b45309' },
      { name: 'il manifesto', domain: 'ilmanifesto.it', url: 'https://ilmanifesto.it', cat: 'italiani', color: '#be123c' },
      { name: 'ANSA', domain: 'ansa.it', url: 'https://www.ansa.it', cat: 'italiani', color: '#15803d' },
      { name: 'Il Post', domain: 'ilpost.it', url: 'https://www.ilpost.it', cat: 'italiani', color: '#0284c7' },
      { name: 'La Gazzetta dello Sport', domain: 'gazzetta.it', url: 'https://www.gazzetta.it', cat: 'italiani', color: '#e11d48' },

      // ECONOMICI
      { name: 'Il Sole 24 Ore', domain: 'ilsole24ore.com', url: 'https://www.ilsole24ore.com', cat: 'economici', color: '#c2410c' },
      { name: 'Milano Finanza', domain: 'milanofinanza.it', url: 'https://www.milanofinanza.it', cat: 'economici', color: '#0f766e' },
      { name: 'ItaliaOggi', domain: 'italiaoggi.it', url: 'https://www.italiaoggi.it', cat: 'economici', color: '#0369a1' },
      { name: 'Financial Times', domain: 'ft.com', url: 'https://www.ft.com', cat: 'economici', color: '#be185d' },
      { name: 'Wall Street Journal', domain: 'wsj.com', url: 'https://www.wsj.com', cat: 'economici', color: '#1e293b' },
      { name: 'Bloomberg', domain: 'bloomberg.com', url: 'https://www.bloomberg.com', cat: 'economici', color: '#111827' },
      { name: 'The Economist', domain: 'economist.com', url: 'https://www.economist.com', cat: 'economici', color: '#dc2626' },

      // ESTERI
      { name: 'The New York Times', domain: 'nytimes.com', url: 'https://www.nytimes.com', cat: 'esteri', color: '#0f172a' },
      { name: 'The Washington Post', domain: 'washingtonpost.com', url: 'https://www.washingtonpost.com', cat: 'esteri', color: '#1e293b' },
      { name: 'Le Monde', domain: 'lemonde.fr', url: 'https://www.lemonde.fr', cat: 'esteri', color: '#0284c7' },
      { name: 'Le Figaro', domain: 'lefigaro.fr', url: 'https://www.lefigaro.fr', cat: 'esteri', color: '#1d4ed8' },
      { name: 'El País', domain: 'elpais.com', url: 'https://elpais.com', cat: 'esteri', color: '#0369a1' },
      { name: 'The Guardian', domain: 'theguardian.com', url: 'https://www.theguardian.com', cat: 'esteri', color: '#052962' },
      { name: 'BBC News', domain: 'bbc.com', url: 'https://www.bbc.com/news', cat: 'esteri', color: '#b91c1c' },
      { name: 'Politico Europe', domain: 'politico.eu', url: 'https://www.politico.eu', cat: 'esteri', color: '#dc2626' }
    ];

    let activeFilter = 'all';
    const wallGrid = document.getElementById('wallGrid');
    const ledwallStage = document.getElementById('ledwallStage');
    const headerSubtitle = document.getElementById('headerSubtitle');

    const toggleClean = () => document.body.classList.toggle('on-air-clean');
    document.getElementById('btnToggleClean').addEventListener('click', toggleClean);
    document.getElementById('brandLogo').addEventListener('dblclick', toggleClean);

    document.querySelectorAll('.filter-pill[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-pill[data-filter]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        ledwallStage.scrollLeft = 0;
        renderGrid();
      });
    });

    function getLogoUrl(domain) {
      return `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
    }

    function renderGrid() {
      wallGrid.innerHTML = '';
      const list = activeFilter === 'all'
        ? NEWSPAPER_SITES
        : NEWSPAPER_SITES.filter(s => s.cat === activeFilter);

      list.forEach(site => {
        const card = document.createElement('a');
        card.className = 'site-card';
        card.href = site.url;
        card.target = '_blank';
        card.rel = 'noopener';
        card.style.setProperty('--accent-color', site.color);

        const catLabel = site.cat === 'italiani' ? 'Quotidiano Italiano'
          : site.cat === 'economici' ? 'Economia & Finanza'
          : 'Stampa Estera';

        card.innerHTML = `
          <div class="site-logo-wrap">
            <img src="${getLogoUrl(site.domain)}" alt="${site.name}" loading="lazy" />
          </div>
          <div class="site-name">${site.name}</div>
          <span class="site-cat-tag">${catLabel}</span>
        `;

        wallGrid.appendChild(card);
      });
    }

    // LAVAGNA SCREENSHOT / ARTICOLO CON EVIDENZIATORE VELOCISSIMO (DISEGNO INCREMENTALE 60FPS)
    const boardOverlay = document.getElementById('boardOverlay');
    const pdfSurface = document.getElementById('pdfSurface');
    const zoomLayer = document.getElementById('zoomLayer');
    const activeImage = document.getElementById('activeImage');
    const drawCanvas = document.getElementById('drawCanvas');
    const ctx = drawCanvas.getContext('2d');

    let baseWidth = 1000;
    let baseHeight = 1400;
    let fitScale = 1;
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isDrawMode = true;
    let currentColor = 'rgba(255, 238, 0, 0.45)';

    function openImageOnBoard(imgSrc, label = 'Articolo in evidenza') {
      headerSubtitle.textContent = label;
      boardOverlay.classList.add('active');
      pdfSurface.classList.toggle('draw-mode', isDrawMode);

      activeImage.onload = () => {
        baseWidth = activeImage.naturalWidth || 1000;
        baseHeight = activeImage.naturalHeight || 1400;
        activeImage.style.width = baseWidth + 'px';
        activeImage.style.height = baseHeight + 'px';
        drawCanvas.width = baseWidth;
        drawCanvas.height = baseHeight;
        ctx.clearRect(0, 0, baseWidth, baseHeight);
        resetZoom(false);
      };
      activeImage.src = imgSrc;
    }

    // Incolla screenshot direttamente dagli appunti iPad (o seleziona foto)
    document.getElementById('btnPasteBoard').addEventListener('click', async () => {
      try {
        const items = await navigator.clipboard.read();
        for (const item of items) {
          const imgType = item.types.find(t => t.startsWith('image/'));
          if (imgType) {
            const blob = await item.getType(imgType);
            openImageOnBoard(URL.createObjectURL(blob), 'Ritaglio in evidenza');
            return;
          }
        }
      } catch (e) {}
      // Fallback: apre selettore rullino/file iPad
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = (ev) => {
        const file = ev.target.files[0];
        if (file) openImageOnBoard(URL.createObjectURL(file), 'Articolo in evidenza');
      };
      input.click();
    });

    window.addEventListener('paste', (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          const blob = item.getAsFile();
          openImageOnBoard(URL.createObjectURL(blob), 'Ritaglio in evidenza');
          break;
        }
      }
    });

    document.getElementById('btnBack').addEventListener('click', () => {
      boardOverlay.classList.remove('active');
      activeImage.src = '';
      headerSubtitle.textContent = 'Quotidiani Online';
    });

    function computeFitTransform() {
      const surfW = pdfSurface.clientWidth;
      const surfH = pdfSurface.clientHeight;
      fitScale = Math.min((surfW - 24) / baseWidth, (surfH - 24) / baseHeight, 1);
      return {
        s: fitScale,
        x: (surfW - baseWidth * fitScale) / 2,
        y: (surfH - baseHeight * fitScale) / 2
      };
    }

    function applyTransform() {
      zoomLayer.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${scale})`;
      document.getElementById('btnZoomReset').textContent = Math.round((scale / fitScale) * 100) + '%';
    }

    function resetZoom(animate = true) {
      const t = computeFitTransform();
      zoomLayer.style.transition = animate ? 'transform 0.2s ease-out' : 'none';
      scale = t.s;
      panX = t.x;
      panY = t.y;
      applyTransform();
      if (animate) setTimeout(() => { zoomLayer.style.transition = 'none'; }, 210);
    }

    function zoomBy(factor, cx, cy) {
      const oldScale = scale;
      const newScale = Math.min(fitScale * 5, Math.max(fitScale * 0.5, oldScale * factor));
      if (newScale === oldScale) return;
      const rect = pdfSurface.getBoundingClientRect();
      const x = cx !== undefined ? cx - rect.left : rect.width / 2;
      const y = cy !== undefined ? cy - rect.top : rect.height / 2;
      panX = x - (x - panX) * (newScale / oldScale);
      panY = y - (y - panY) * (newScale / oldScale);
      scale = newScale;
      applyTransform();
    }

    document.getElementById('btnZoomIn').addEventListener('click', () => zoomBy(1.3));
    document.getElementById('btnZoomOut').addEventListener('click', () => zoomBy(1 / 1.3));
    document.getElementById('btnZoomReset').addEventListener('click', () => resetZoom(true));

    // Gesture Pan & Pinch su iPad
    let isDragging = false, dragX = 0, dragY = 0, pinchDist = 0, pinchScale = 1;

    pdfSurface.addEventListener('touchstart', (e) => {
      if (isDrawMode && e.touches.length === 1) return;
      if (e.touches.length === 2) {
        isDragging = false;
        pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        pinchScale = scale;
      } else if (e.touches.length === 1) {
        isDragging = true;
        dragX = e.touches[0].clientX - panX;
        dragY = e.touches[0].clientY - panY;
      }
    }, { passive: true });

    pdfSurface.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && pinchDist > 0) {
        e.preventDefault();
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        zoomBy((pinchScale * (dist / pinchDist)) / scale, mx, my);
      } else if (e.touches.length === 1 && isDragging && !isDrawMode) {
        e.preventDefault();
        panX = e.touches[0].clientX - dragX;
        panY = e.touches[0].clientY - dragY;
        applyTransform();
      }
    }, { passive: false });

    pdfSurface.addEventListener('touchend', () => { isDragging = false; pinchDist = 0; });

    // EVIDENZIATORE INCREMENTALE AD ALTA VELOCITÀ (ZERO LAG SU IPAD)
    const btnDrawToggle = document.getElementById('btnDrawToggle');
    btnDrawToggle.addEventListener('click', () => {
      isDrawMode = !isDrawMode;
      btnDrawToggle.classList.toggle('active-tool', isDrawMode);
      pdfSurface.classList.toggle('draw-mode', isDrawMode);
    });

    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
        dot.classList.add('selected');
        currentColor = dot.dataset.color;
        if (!isDrawMode) btnDrawToggle.click();
      });
    });

    document.getElementById('btnClearMarks').addEventListener('click', () => {
      ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    });

    let drawing = false;
    let lastPt = null;

    function getPt(clientX, clientY) {
      const rect = drawCanvas.getBoundingClientRect();
      return {
        x: ((clientX - rect.left) / rect.width) * drawCanvas.width,
        y: ((clientY - rect.top) / rect.height) * drawCanvas.height
      };
    }

    drawCanvas.addEventListener('pointerdown', (e) => {
      if (!isDrawMode) return;
      e.stopPropagation();
      drawCanvas.setPointerCapture(e.pointerId);
      drawing = true;
      lastPt = getPt(e.clientX, e.clientY);
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = Math.max(22, drawCanvas.width * 0.025);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(lastPt.x, lastPt.y);
      ctx.lineTo(lastPt.x + 0.1, lastPt.y);
      ctx.stroke();
    });

    drawCanvas.addEventListener('pointermove', (e) => {
      if (!drawing || !isDrawMode || !lastPt) return;
      e.stopPropagation();
      const pt = getPt(e.clientX, e.clientY);
      ctx.beginPath();
      ctx.moveTo(lastPt.x, lastPt.y);
      ctx.lineTo(pt.x, pt.y);
      ctx.stroke();
      lastPt = pt;
    });

    drawCanvas.addEventListener('pointerup', () => { drawing = false; lastPt = null; });
    drawCanvas.addEventListener('pointercancel', () => { drawing = false; lastPt = null; });

    renderGrid();
  </script>
</body>
</html>
