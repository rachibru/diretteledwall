<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="br.it/ledwall" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>br.it/ledwall - Quotidiani Online</title>
  <style>
    :root {
      --brand-blue: #0b3d75;
      --brand-blue-dark: #072a52;
      --studio-bg: #e7ebf0;
      --studio-bg-light: #f5f7fa;
      --live-red: #e52521;
      --header-h: 44px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 25%, var(--studio-bg-light) 0%, var(--studio-bg) 75%, #d6dde6 100%);
      color: #1a2433;
    }

    /* TOP BAR UNICA RIGA */
    header.topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(var(--header-h) + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      background: linear-gradient(180deg, var(--brand-blue) 0%, var(--brand-blue-dark) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      box-shadow: 0 2px 10px rgba(7, 42, 82, 0.25);
      gap: 10px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      overflow: hidden;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--live-red);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 3px 7px;
      border-radius: 4px;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(229, 37, 33, 0.5);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 1.4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #fff;
      white-space: nowrap;
      cursor: pointer;
    }

    .brand-divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }

    .view-subtitle {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .topbar-right::-webkit-scrollbar {
      display: none;
    }

    .filter-pill {
      height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.9);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .filter-pill.active {
      background: #fff;
      color: var(--brand-blue);
      border-color: #fff;
    }

    .btn-icon-only {
      height: 26px;
      padding: 0 7px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }

    body.on-air-clean .filter-pill {
      display: none;
    }

    body.on-air-clean #btnToggleClean {
      opacity: 0.35;
      border-color: transparent;
      background: transparent;
    }

    /* LIBRERIA ORIZZONTALE A 2 RIGHE */
    main.ledwall-stage {
      position: fixed;
      top: calc(var(--header-h) + env(safe-area-inset-top));
      left: 0;
      right: 0;
      bottom: 0;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 20px 26px;
      display: flex;
      align-items: center;
      scrollbar-width: none;
    }

    main.ledwall-stage::-webkit-scrollbar {
      display: none;
    }

    .wall-grid {
      height: 100%;
      display: grid;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      grid-auto-flow: column;
      grid-auto-columns: max-content;
      gap: 20px 22px;
      align-items: center;
      padding-right: 26px;
    }

    .site-card {
      position: relative;
      height: 100%;
      aspect-ratio: 1.45 / 1;
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 8px 22px rgba(15, 28, 46, 0.12), 0 1px 3px rgba(15, 28, 46, 0.08);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.22s ease;
      border-top: 4px solid var(--accent-color, #0b3d75);
    }

    .site-card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 16px 32px rgba(11, 61, 117, 0.2);
    }

    .site-card:active {
      transform: scale(0.97);
    }

    .site-logo-wrap {
      width: 68px;
      height: 68px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
    }

    .site-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .site-name {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      text-align: center;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .site-cat-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef2f7;
      color: #475569;
    }

    /* BROWSER INTERNO A TUTTO SCHERMO */
    .browser-overlay {
      position: fixed;
      top: calc(var(--header-h) + env(safe-area-inset-top));
      left: 0;
      right: 0;
      bottom: 0;
      background: #fff;
      z-index: 90;
      display: none;
      flex-direction: column;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.25s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .browser-overlay.active {
      display: flex;
    }

    .browser-overlay.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* MINI BARRA INDIRIZZO */
    .browser-addressbar {
      height: 34px;
      background: #eef2f6;
      border-bottom: 1px solid #cbd5e1;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #334155;
      flex-shrink: 0;
      gap: 10px;
    }

    .url-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      padding: 2px 10px;
      max-width: 72%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
    }

    /* AREA CONTENUTO WEB */
    .browser-viewport {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
      background: #fff;
    }

    #webFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #fff;
      transform-origin: top center;
      transition: transform 0.2s ease;
    }

    .browser-loader {
      position: absolute;
      inset: 0;
      background: rgba(248, 250, 252, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      gap: 10px;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #d0dbe8;
      border-top-color: var(--brand-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* DOCK STRUMENTI IN BASSO */
    .viewer-dock {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 61, 117, 0.96);
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 28px rgba(7, 42, 82, 0.35);
      z-index: 96;
      max-width: 96vw;
      overflow-x: auto;
    }

    .dock-btn {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
    }

    .dock-btn.primary-back {
      background: #fff;
      color: var(--brand-blue);
      border-color: #fff;
    }

    .dock-btn.active-tool {
      background: #ffeb3b;
      color: #072a52;
      border-color: #ffeb3b;
    }

    .dock-sep {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.22);
      flex-shrink: 0;
    }

    .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.5);
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .color-dot.selected {
      transform: scale(1.2);
      border-color: #fff;
      box-shadow: 0 0 0 2px #0b3d75, 0 0 0 4px #fff;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIORE -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="live-badge"><span class="live-dot"></span>LIVE</span>
      <span class="brand-title" id="brandLogo">br.it/ledwall</span>
      <span class="brand-divider"></span>
      <span class="view-subtitle" id="headerSubtitle">Quotidiani Online</span>
    </div>
    <div class="topbar-right">
      <button class="filter-pill active" data-filter="all">Tutti</button>
      <button class="filter-pill" data-filter="italiani">Italiani</button>
      <button class="filter-pill" data-filter="economici">Economici</button>
      <button class="filter-pill" data-filter="esteri">Esteri</button>
      <button class="btn-icon-only" id="btnToggleClean" title="Nascondi filtri in onda">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>
  </header>

  <!-- LIBRERIA LOGHI TESTATE -->
  <main class="ledwall-stage" id="ledwallStage">
    <div class="wall-grid" id="wallGrid"></div>
  </main>

  <!-- BROWSER INTERNO -->
  <div class="browser-overlay" id="browserOverlay">
    <div class="browser-addressbar">
      <div class="url-pill">
        <span>🔒</span>
        <span id="currentUrlText">https://...</span>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <button id="btnReloadPage" style="background:none; border:none; color:#0b3d75; font-weight:700; font-size:11px; cursor:pointer; padding:0;">↻ Ricarica</button>
        <a id="externalFallbackLink" href="#" target="_blank" rel="noopener" style="color:#0b3d75; font-weight:700; text-decoration:none; font-size:11px; white-space:nowrap;">Apri esterno ↗</a>
      </div>
    </div>

    <div class="browser-viewport" id="browserViewport">
      <div class="browser-loader" id="browserLoader">
        <div class="spinner"></div>
        <div style="font-weight:700; color:#0b3d75;" id="loaderTitle">Apertura homepage...</div>
        <div style="font-size:12px; color:#64748b;" id="loaderSub">Caricamento impaginazione originale del quotidiano</div>
      </div>

      <iframe id="webFrame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
    </div>

    <div class="viewer-dock">
      <button class="dock-btn primary-back" id="btnBack">&#8592; Torna indietro</button>
      <div class="dock-sep"></div>
      <button class="dock-btn" id="btnZoomPageOut" title="Riduci">&#8722;</button>
      <button class="dock-btn" id="btnZoomPageIn" title="Ingrandisci">&#43;</button>
      <div class="dock-sep"></div>
      <button class="dock-btn" id="btnDrawToggle">Evidenzia</button>
      <span class="color-dot selected" data-color="rgba(255, 238, 0, 0.55)" style="background:#ffee00;"></span>
      <span class="color-dot" data-color="rgba(0, 230, 118, 0.45)" style="background:#00e676;"></span>
      <span class="color-dot" data-color="rgba(255, 82, 82, 0.45)" style="background:#ff5252;"></span>
      <button class="dock-btn" id="btnClearMarks">Pulisci</button>
    </div>
  </div>

  <script>
    const NEWSPAPER_SITES = [
      // ITALIANI
      { name: 'Corriere della Sera', domain: 'corriere.it', url: 'https://www.corriere.it', cat: 'italiani', color: '#004b87' },
      { name: 'la Repubblica', domain: 'repubblica.it', url: 'https://www.repubblica.it', cat: 'italiani', color: '#0066b3' },
      { name: 'La Stampa', domain: 'lastampa.it', url: 'https://www.lastampa.it', cat: 'italiani', color: '#1e3a8a' },
      { name: 'Il Fatto Quotidiano', domain: 'ilfattoquotidiano.it', url: 'https://www.ilfattoquotidiano.it', cat: 'italiani', color: '#b91c1c' },
      { name: 'il Giornale', domain: 'ilgiornale.it', url: 'https://www.ilgiornale.it', cat: 'italiani', color: '#0369a1' },
      { name: 'Libero Quotidiano', domain: 'liberoquotidiano.it', url: 'https://www.liberoquotidiano.it', cat: 'italiani', color: '#dc2626' },
      { name: 'La Verità', domain: 'laverita.info', url: 'https://www.laverita.info', cat: 'italiani', color: '#991b1b' },
      { name: 'Il Messaggero', domain: 'ilmessaggero.it', url: 'https://www.ilmessaggero.it', cat: 'italiani', color: '#1d4ed8' },
      { name: 'Avvenire', domain: 'avvenire.it', url: 'https://www.avvenire.it', cat: 'italiani', color: '#0284c7' },
      { name: 'Domani', domain: 'editorialedomani.it', url: 'https://www.editorialedomani.it', cat: 'italiani', color: '#ea580c' },
      { name: 'Il Foglio', domain: 'ilfoglio.it', url: 'https://www.ilfoglio.it', cat: 'italiani', color: '#b45309' },
      { name: 'il manifesto', domain: 'ilmanifesto.it', url: 'https://ilmanifesto.it', cat: 'italiani', color: '#be123c' },
      { name: 'ANSA', domain: 'ansa.it', url: 'https://www.ansa.it', cat: 'italiani', color: '#15803d' },
      { name: 'Il Post', domain: 'ilpost.it', url: 'https://www.ilpost.it', cat: 'italiani', color: '#0284c7' },
      { name: 'La Gazzetta dello Sport', domain: 'gazzetta.it', url: 'https://www.gazzetta.it', cat: 'italiani', color: '#e11d48' },

      // ECONOMICI
      { name: 'Il Sole 24 Ore', domain: 'ilsole24ore.com', url: 'https://www.ilsole24ore.com', cat: 'economici', color: '#c2410c' },
      { name: 'Milano Finanza', domain: 'milanofinanza.it', url: 'https://www.milanofinanza.it', cat: 'economici', color: '#0f766e' },
      { name: 'ItaliaOggi', domain: 'italiaoggi.it', url: 'https://www.italiaoggi.it', cat: 'economici', color: '#0369a1' },
      { name: 'Financial Times', domain: 'ft.com', url: 'https://www.ft.com', cat: 'economici', color: '#be185d' },
      { name: 'Wall Street Journal', domain: 'wsj.com', url: 'https://www.wsj.com', cat: 'economici', color: '#1e293b' },
      { name: 'Bloomberg', domain: 'bloomberg.com', url: 'https://www.bloomberg.com', cat: 'economici', color: '#111827' },
      { name: 'The Economist', domain: 'economist.com', url: 'https://www.economist.com', cat: 'economici', color: '#dc2626' },

      // ESTERI
      { name: 'The New York Times', domain: 'nytimes.com', url: 'https://www.nytimes.com', cat: 'esteri', color: '#0f172a' },
      { name: 'The Washington Post', domain: 'washingtonpost.com', url: 'https://www.washingtonpost.com', cat: 'esteri', color: '#1e293b' },
      { name: 'Le Monde', domain: 'lemonde.fr', url: 'https://www.lemonde.fr', cat: 'esteri', color: '#0284c7' },
      { name: 'Le Figaro', domain: 'lefigaro.fr', url: 'https://www.lefigaro.fr', cat: 'esteri', color: '#1d4ed8' },
      { name: 'El País', domain: 'elpais.com', url: 'https://elpais.com', cat: 'esteri', color: '#0369a1' },
      { name: 'The Guardian', domain: 'theguardian.com', url: 'https://www.theguardian.com', cat: 'esteri', color: '#052962' },
      { name: 'BBC News', domain: 'bbc.com', url: 'https://www.bbc.com/news', cat: 'esteri', color: '#b91c1c' },
      { name: 'Politico Europe', domain: 'politico.eu', url: 'https://www.politico.eu', cat: 'esteri', color: '#dc2626' }
    ];

    let activeFilter = 'all';
    let currentSite = null;
    let currentUrl = '';
    let pageZoom = 1;
    let isDrawMode = false;
    let currentColor = 'rgba(255, 238, 0, 0.55)';

    const ledwallStage = document.getElementById('ledwallStage');
    const wallGrid = document.getElementById('wallGrid');
    const headerSubtitle = document.getElementById('headerSubtitle');
    const browserOverlay = document.getElementById('browserOverlay');
    const browserLoader = document.getElementById('browserLoader');
    const loaderTitle = document.getElementById('loaderTitle');
    const loaderSub = document.getElementById('loaderSub');
    const webFrame = document.getElementById('webFrame');
    const currentUrlText = document.getElementById('currentUrlText');
    const externalFallbackLink = document.getElementById('externalFallbackLink');

    const toggleClean = () => document.body.classList.toggle('on-air-clean');
    document.getElementById('btnToggleClean').addEventListener('click', toggleClean);
    document.getElementById('brandLogo').addEventListener('dblclick', toggleClean);

    ledwallStage.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();
        ledwallStage.scrollLeft += e.deltaY;
      }
    }, { passive: false });

    document.querySelectorAll('.filter-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        ledwallStage.scrollLeft = 0;
        renderGrid();
      });
    });

    function getLogoUrl(domain) {
      return `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
    }

    function renderGrid() {
      wallGrid.innerHTML = '';
      const list = activeFilter === 'all'
        ? NEWSPAPER_SITES
        : NEWSPAPER_SITES.filter(s => s.cat === activeFilter);

      list.forEach(site => {
        const card = document.createElement('div');
        card.className = 'site-card';
        card.style.setProperty('--accent-color', site.color);

        const catLabel = site.cat === 'italiani' ? 'Quotidiano Italiano'
          : site.cat === 'economici' ? 'Economia & Finanza'
          : 'Stampa Estera';

        card.innerHTML = `
          <div class="site-logo-wrap">
            <img src="${getLogoUrl(site.domain)}" alt="${site.name}" loading="lazy" />
          </div>
          <div class="site-name">${site.name}</div>
          <span class="site-cat-tag">${catLabel}</span>
        `;

        card.addEventListener('click', () => openSiteInBrowser(site));
        wallGrid.appendChild(card);
      });
    }

    // Inietta CSS anti-paywall/cookie + Canvas Evidenziatore ANCÒRATO AL DOCUMENTO (scorre con la pagina!)
    function prepareHomepageHtml(rawHtml, pageUrl) {
      const urlObj = new URL(pageUrl);
      const baseOrigin = urlObj.origin;

      const injectedHead = `
        <base href="${baseOrigin}/" target="_self" />
        <style id="ledwall-injected-style">
          html, body {
            overflow-x: hidden !important;
            overflow-y: auto !important;
            position: relative !important;
            height: auto !important;
            max-height: none !important;
            filter: none !important;
            -webkit-filter: none !important;
          }
          /* Rimozione paywall e modali che bloccano la lettura */
          [class*="paywall"], [id*="paywall"],
          [class*="piano-"], [id*="piano-"],
          [class*="tp-modal"], [class*="tp-backdrop"],
          [class*="subscriber-wall"], [class*="overlay-wall"],
          [class*="cookie"], [id*="cookie"],
          [class*="consent"], [id*="consent"],
          [class*="didomi"], [id*="didomi"],
          [class*="iubenda"], [id*="iubenda"],
          [class*="onetrust"], [id*="onetrust"],
          .fc-consent-root, .qc-cmp2-container {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
          }
          * {
            filter: none !important;
            -webkit-filter: none !important;
          }
          #ledwall-doc-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            mix-blend-mode: multiply;
            z-index: 2147483647;
          }
          body.ledwall-draw-active #ledwall-doc-canvas {
            pointer-events: auto !important;
            cursor: crosshair !important;
            touch-action: none !important;
          }
        </style>
      `;

      const injectedBodyEnd = `
        <canvas id="ledwall-doc-canvas"></canvas>
        <script>
          (function() {
            const canvas = document.getElementById('ledwall-doc-canvas');
            const ctx = canvas.getContext('2d');
            let drawEnabled = ${isDrawMode ? 'true' : 'false'};
            let strokeColor = '${currentColor}';
            let isDrawing = false;
            let strokes = [];
            let currentStroke = null;

            if (drawEnabled) document.body.classList.add('ledwall-draw-active');

            function syncCanvasSize() {
              const docW = Math.max(document.documentElement.scrollWidth, document.body.scrollWidth, window.innerWidth);
              const docH = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight, window.innerHeight);
              if (canvas.width !== docW || canvas.height !== docH) {
                canvas.width = docW;
                canvas.height = docH;
                canvas.style.width = docW + 'px';
                canvas.style.height = docH + 'px';
                redrawAll();
              }
            }

            function redrawAll() {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              strokes.forEach(s => {
                if (!s.points.length) return;
                ctx.save();
                ctx.strokeStyle = s.color;
                ctx.lineWidth = 22;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(s.points[0].x, s.points[0].y);
                for (let i = 1; i < s.points.length; i++) {
                  ctx.lineTo(s.points[i].x, s.points[i].y);
                }
                if (s.points.length === 1) {
                  ctx.lineTo(s.points[0].x + 0.1, s.points[0].y);
                }
                ctx.stroke();
                ctx.restore();
              });
            }

            window.addEventListener('load', syncCanvasSize);
            window.addEventListener('resize', syncCanvasSize);
            setInterval(() => {
              syncCanvasSize();
              document.documentElement.style.setProperty('overflow-y', 'auto', 'important');
              document.body.style.setProperty('overflow-y', 'auto', 'important');
            }, 1000);

            canvas.addEventListener('pointerdown', (e) => {
              if (!drawEnabled) return;
              isDrawing = true;
              canvas.setPointerCapture(e.pointerId);
              currentStroke = { color: strokeColor, points: [{ x: e.pageX, y: e.pageY }] };
              strokes.push(currentStroke);
              redrawAll();
            });

            canvas.addEventListener('pointermove', (e) => {
              if (!isDrawing || !drawEnabled || !currentStroke) return;
              currentStroke.points.push({ x: e.pageX, y: e.pageY });
              redrawAll();
            });

            canvas.addEventListener('pointerup', () => { isDrawing = false; currentStroke = null; });
            canvas.addEventListener('pointercancel', () => { isDrawing = false; currentStroke = null; });

            // Riceve comandi dalla barra strumenti esterna
            window.addEventListener('message', (ev) => {
              const msg = ev.data || {};
              if (msg.type === 'SET_DRAW_MODE') {
                drawEnabled = !!msg.enabled;
                document.body.classList.toggle('ledwall-draw-active', drawEnabled);
              } else if (msg.type === 'SET_COLOR') {
                strokeColor = msg.color;
              } else if (msg.type === 'CLEAR_MARKS') {
                strokes = [];
                redrawAll();
              }
            });

            // Navigazione interna quando clicchi su un articolo
            document.addEventListener('click', function(e) {
              if (drawEnabled) return;
              const link = e.target.closest('a');
              if (link && link.href && link.href.startsWith('http')) {
                e.preventDefault();
                window.parent.postMessage({ type: 'LEDWALL_NAVIGATE', url: link.href }, '*');
              }
            }, true);
          })();
        <\/script>
      `;

      // Rimuove solo gli script che bloccano l'iframe o attivano il paywall, mantenendo tutta la grafica e pubblicità
      let html = rawHtml
        .replace(/<meta[^>]+http-equiv=["']Content-Security-Policy["'][^>]*>/gi, '')
        .replace(/<script[^>]+(tinypass|piano\.io|zephr|poool|pelcro|didomi|iubenda|onetrust)[^>]*><\/script>/gi, '');

      if (html.includes('<head>')) {
        html = html.replace('<head>', '<head>' + injectedHead);
      } else {
        html = injectedHead + html;
      }

      if (html.includes('</body>')) {
        html = html.replace('</body>', injectedBodyEnd + '</body>');
      } else {
        html = html + injectedBodyEnd;
      }

      return html;
    }

    async function fetchRawHtml(targetUrl) {
      const proxies = [
        {
          url: `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`,
          extract: async (r) => (await r.json()).contents
        },
        {
          url: `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
          extract: async (r) => await r.text()
        },
        {
          url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
          extract: async (r) => await r.text()
        }
      ];

      for (const p of proxies) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 9000);
          const res = await fetch(p.url, { signal: controller.signal });
          clearTimeout(timer);
          if (!res.ok) continue;
          const content = await p.extract(res);
          if (content && content.length > 400) return content;
        } catch (err) {}
      }
      throw new Error('Timeout caricamento pagina');
    }

    async function loadUrlInBrowser(targetUrl) {
      currentUrl = targetUrl;
      currentUrlText.textContent = targetUrl;
      externalFallbackLink.href = targetUrl;
      browserLoader.style.display = 'flex';
      loaderTitle.textContent = `Caricamento ${currentSite ? currentSite.name : 'pagina'}...`;
      loaderSub.textContent = 'Caricamento impaginazione originale del sito';

      try {
        const rawHtml = await fetchRawHtml(targetUrl);
        const fullHtml = prepareHomepageHtml(rawHtml, targetUrl);
        webFrame.srcdoc = fullHtml;
        webFrame.onload = () => {
          browserLoader.style.display = 'none';
        };
        setTimeout(() => { browserLoader.style.display = 'none'; }, 1800);
      } catch (e) {
        browserLoader.innerHTML = `
          <div style="font-weight:700; color:#b91c1c; font-size:15px;">Impossibile caricare l'anteprima diretta</div>
          <div style="font-size:12px; color:#475569; max-width:380px;">Il server del giornale sta limitando le richieste esterne in questo momento.</div>
          <div style="display:flex; gap:10px; margin-top:8px;">
            <button onclick="loadUrlInBrowser('${targetUrl}')" style="background:#0b3d75; color:#fff; border:none; padding:8px 16px; border-radius:6px; font-weight:700; cursor:pointer;">Riprova</button>
            <a href="${targetUrl}" target="_blank" rel="noopener" style="background:#fff; color:#0b3d75; border:1px solid #0b3d75; padding:8px 16px; border-radius:6px; font-weight:700; text-decoration:none;">Apri nel browser ↗</a>
          </div>
        `;
      }
    }

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'LEDWALL_NAVIGATE' && event.data.url) {
        loadUrlInBrowser(event.data.url);
      }
    });

    function openSiteInBrowser(site) {
      currentSite = site;
      headerSubtitle.textContent = site.name;
      pageZoom = 1;
      webFrame.style.transform = 'scale(1)';
      webFrame.style.width = '100%';
      webFrame.style.height = '100%';

      // Ripristina contenuto standard del loader
      browserLoader.innerHTML = `
        <div class="spinner"></div>
        <div style="font-weight:700; color:#0b3d75;" id="loaderTitle">Apertura ${site.name}...</div>
        <div style="font-size:12px; color:#64748b;" id="loaderSub">Caricamento impaginazione originale del sito</div>
      `;

      browserOverlay.classList.add('active');
      requestAnimationFrame(() => {
        browserOverlay.classList.add('visible');
      });

      loadUrlInBrowser(site.url);
    }

    function closeBrowser() {
      if (isDrawMode) {
        isDrawMode = false;
        btnDrawToggle.classList.remove('active-tool');
      }
      browserOverlay.classList.remove('visible');
      setTimeout(() => {
        browserOverlay.classList.remove('active');
        webFrame.srcdoc = '';
        headerSubtitle.textContent = 'Quotidiani Online';
        currentSite = null;
      }, 260);
    }

    document.getElementById('btnBack').addEventListener('click', closeBrowser);
    document.getElementById('btnReloadPage').addEventListener('click', () => {
      if (currentUrl) loadUrlInBrowser(currentUrl);
    });

    // Zoom browser
    function applyBrowserZoom() {
      webFrame.style.transform = `scale(${pageZoom})`;
      webFrame.style.width = (100 / pageZoom) + '%';
      webFrame.style.height = (100 / pageZoom) + '%';
    }

    document.getElementById('btnZoomPageIn').addEventListener('click', () => {
      pageZoom = Math.min(2.0, +(pageZoom + 0.15).toFixed(2));
      applyBrowserZoom();
    });

    document.getElementById('btnZoomPageOut').addEventListener('click', () => {
      pageZoom = Math.max(0.7, +(pageZoom - 0.15).toFixed(2));
      applyBrowserZoom();
    });

    // Controlli Evidenziatore (invia comandi al canvas ancorato dentro la pagina del giornale)
    function sendToFrame(payload) {
      if (webFrame && webFrame.contentWindow) {
        webFrame.contentWindow.postMessage(payload, '*');
      }
    }

    const btnDrawToggle = document.getElementById('btnDrawToggle');
    btnDrawToggle.addEventListener('click', () => {
      isDrawMode = !isDrawMode;
      btnDrawToggle.classList.toggle('active-tool', isDrawMode);
      sendToFrame({ type: 'SET_DRAW_MODE', enabled: isDrawMode });
    });

    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
        dot.classList.add('selected');
        currentColor = dot.dataset.color;
        sendToFrame({ type: 'SET_COLOR', color: currentColor });
        if (!isDrawMode) btnDrawToggle.click();
      });
    });

    document.getElementById('btnClearMarks').addEventListener('click', () => {
      sendToFrame({ type: 'CLEAR_MARKS' });
    });

    renderGrid();
  </script>
</body>
</html>
