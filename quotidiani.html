<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="br.it/ledwall" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>br.it/ledwall - Quotidiani Online</title>
  <style>
    :root {
      --brand-blue: #0b3d75;
      --brand-blue-dark: #072a52;
      --studio-bg: #e7ebf0;
      --studio-bg-light: #f5f7fa;
      --live-red: #e52521;
      --header-h: 44px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 25%, var(--studio-bg-light) 0%, var(--studio-bg) 75%, #d6dde6 100%);
      color: #1a2433;
    }

    /* TOP BAR UNICA RIGA */
    header.topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(var(--header-h) + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      background: linear-gradient(180deg, var(--brand-blue) 0%, var(--brand-blue-dark) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      box-shadow: 0 2px 10px rgba(7, 42, 82, 0.25);
      gap: 10px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      overflow: hidden;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--live-red);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 3px 7px;
      border-radius: 4px;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(229, 37, 33, 0.5);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 1.4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #fff;
      white-space: nowrap;
      cursor: pointer;
    }

    .brand-divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }

    .view-subtitle {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .topbar-right::-webkit-scrollbar {
      display: none;
    }

    .filter-pill {
      height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.9);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .filter-pill.active {
      background: #fff;
      color: var(--brand-blue);
      border-color: #fff;
    }

    .btn-icon-only {
      height: 26px;
      padding: 0 7px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }

    body.on-air-clean .filter-pill {
      display: none;
    }

    body.on-air-clean #btnToggleClean {
      opacity: 0.35;
      border-color: transparent;
      background: transparent;
    }

    /* LIBRERIA ORIZZONTALE A 2 RIGHE */
    main.ledwall-stage {
      position: fixed;
      top: calc(var(--header-h) + env(safe-area-inset-top));
      left: 0;
      right: 0;
      bottom: 0;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 20px 26px;
      display: flex;
      align-items: center;
      scrollbar-width: none;
    }

    main.ledwall-stage::-webkit-scrollbar {
      display: none;
    }

    .wall-grid {
      height: 100%;
      display: grid;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      grid-auto-flow: column;
      grid-auto-columns: max-content;
      gap: 20px 22px;
      align-items: center;
      padding-right: 26px;
    }

    .site-card {
      position: relative;
      height: 100%;
      aspect-ratio: 1.45 / 1;
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 8px 22px rgba(15, 28, 46, 0.12), 0 1px 3px rgba(15, 28, 46, 0.08);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.22s ease, opacity 0.2s;
      border-top: 4px solid var(--accent-color, #0b3d75);
    }

    .site-card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 16px 32px rgba(11, 61, 117, 0.2);
    }

    .site-card:active {
      transform: scale(0.97);
    }

    .site-logo-wrap {
      width: 68px;
      height: 68px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
    }

    .site-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .site-name {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      text-align: center;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .site-cat-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef2f7;
      color: #475569;
    }

    /* VIEWER SCREENSHOT LIVE HOMEPAGE (COME UN PDF A TUTTO SCHERMO) */
    .viewer-overlay {
      position: fixed;
      top: calc(var(--header-h) + env(safe-area-inset-top));
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(231, 235, 240, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 90;
      display: none;
      overflow: hidden;
      touch-action: none;
      opacity: 0;
      transition: opacity 0.26s ease;
    }

    .viewer-overlay.active {
      display: block;
    }

    .viewer-overlay.visible {
      opacity: 1;
    }

    .pdf-canvas-surface {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }

    .pdf-canvas-surface:active {
      cursor: grabbing;
    }

    .pdf-canvas-surface.draw-mode {
      cursor: crosshair;
    }

    .zoom-layer {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
      display: inline-block;
      box-shadow: 0 22px 60px rgba(10, 25, 47, 0.28);
      background: #fff;
    }

    .zoom-layer img {
      display: block;
      max-width: none;
      max-height: none;
      pointer-events: none;
    }

    .draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .pdf-canvas-surface.draw-mode .draw-canvas {
      pointer-events: auto;
    }

    /* LOADER */
    .snapshot-loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 5;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #cbd5e1;
      border-top-color: var(--brand-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* BARRA STRUMENTI IN BASSO */
    .viewer-dock {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 61, 117, 0.96);
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 28px rgba(7, 42, 82, 0.35);
      z-index: 96;
      max-width: 96vw;
      overflow-x: auto;
    }

    .dock-btn {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
    }

    .dock-btn.primary-back {
      background: #fff;
      color: var(--brand-blue);
      border-color: #fff;
    }

    .dock-btn.active-tool {
      background: #ffeb3b;
      color: #072a52;
      border-color: #ffeb3b;
    }

    .dock-sep {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.22);
      flex-shrink: 0;
    }

    .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.5);
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .color-dot.selected {
      transform: scale(1.2);
      border-color: #fff;
      box-shadow: 0 0 0 2px #0b3d75, 0 0 0 4px #fff;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIORE -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="live-badge"><span class="live-dot"></span>LIVE</span>
      <span class="brand-title" id="brandLogo">br.it/ledwall</span>
      <span class="brand-divider"></span>
      <span class="view-subtitle" id="headerSubtitle">Quotidiani Online</span>
    </div>
    <div class="topbar-right">
      <button class="filter-pill active" data-filter="all">Tutti</button>
      <button class="filter-pill" data-filter="italiani">Italiani</button>
      <button class="filter-pill" data-filter="economici">Economici</button>
      <button class="filter-pill" data-filter="esteri">Esteri</button>
      <button class="btn-icon-only" id="btnToggleClean" title="Nascondi filtri in onda">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>
  </header>

  <!-- LIBRERIA LOGHI TESTATE -->
  <main class="ledwall-stage" id="ledwallStage">
    <div class="wall-grid" id="wallGrid"></div>
  </main>

  <!-- VIEWER SCREENSHOT LIVE HOMEPAGE -->
  <div class="viewer-overlay" id="viewerOverlay">
    <div class="snapshot-loader" id="snapshotLoader">
      <div class="spinner"></div>
      <div style="font-weight:700; color:#0b3d75; font-size:15px;" id="loaderTitle">Cattura homepage in tempo reale...</div>
      <div style="font-size:12px; color:#52637a;">Generazione anteprima grafica ad alta risoluzione</div>
    </div>

    <div class="pdf-canvas-surface" id="pdfSurface">
      <div class="zoom-layer" id="zoomLayer">
        <img id="activeImage" alt="Homepage Quotidiano" />
        <canvas class="draw-canvas" id="drawCanvas"></canvas>
      </div>
    </div>

    <div class="viewer-dock">
      <button class="dock-btn primary-back" id="btnBack">&#8592; Torna indietro</button>
      <div class="dock-sep"></div>
      <button class="dock-btn" id="btnZoomOut" title="Riduci">&#8722;</button>
      <button class="dock-btn" id="btnZoomReset" title="Adatta">100%</button>
      <button class="dock-btn" id="btnZoomIn" title="Ingrandisci">&#43;</button>
      <div class="dock-sep"></div>
      <button class="dock-btn" id="btnDrawToggle">Evidenzia</button>
      <span class="color-dot selected" data-color="rgba(255, 238, 0, 0.55)" style="background:#ffee00;"></span>
      <span class="color-dot" data-color="rgba(0, 230, 118, 0.45)" style="background:#00e676;"></span>
      <span class="color-dot" data-color="rgba(255, 82, 82, 0.45)" style="background:#ff5252;"></span>
      <button class="dock-btn" id="btnClearMarks">Pulisci</button>
      <div class="dock-sep"></div>
      <a class="dock-btn" id="btnOpenExternal" href="#" target="_blank" rel="noopener">Apri sito ↗</a>
    </div>
  </div>

  <script>
    const NEWSPAPER_SITES = [
      // ITALIANI
      { name: 'Corriere della Sera', domain: 'corriere.it', url: 'https://www.corriere.it', cat: 'italiani', color: '#004b87' },
      { name: 'la Repubblica', domain: 'repubblica.it', url: 'https://www.repubblica.it', cat: 'italiani', color: '#0066b3' },
      { name: 'La Stampa', domain: 'lastampa.it', url: 'https://www.lastampa.it', cat: 'italiani', color: '#1e3a8a' },
      { name: 'Il Fatto Quotidiano', domain: 'ilfattoquotidiano.it', url: 'https://www.ilfattoquotidiano.it', cat: 'italiani', color: '#b91c1c' },
      { name: 'il Giornale', domain: 'ilgiornale.it', url: 'https://www.ilgiornale.it', cat: 'italiani', color: '#0369a1' },
      { name: 'Libero Quotidiano', domain: 'liberoquotidiano.it', url: 'https://www.liberoquotidiano.it', cat: 'italiani', color: '#dc2626' },
      { name: 'La Verità', domain: 'laverita.info', url: 'https://www.laverita.info', cat: 'italiani', color: '#991b1b' },
      { name: 'Il Messaggero', domain: 'ilmessaggero.it', url: 'https://www.ilmessaggero.it', cat: 'italiani', color: '#1d4ed8' },
      { name: 'Avvenire', domain: 'avvenire.it', url: 'https://www.avvenire.it', cat: 'italiani', color: '#0284c7' },
      { name: 'Domani', domain: 'editorialedomani.it', url: 'https://www.editorialedomani.it', cat: 'italiani', color: '#ea580c' },
      { name: 'Il Foglio', domain: 'ilfoglio.it', url: 'https://www.ilfoglio.it', cat: 'italiani', color: '#b45309' },
      { name: 'il manifesto', domain: 'ilmanifesto.it', url: 'https://ilmanifesto.it', cat: 'italiani', color: '#be123c' },
      { name: 'ANSA', domain: 'ansa.it', url: 'https://www.ansa.it', cat: 'italiani', color: '#15803d' },
      { name: 'Il Post', domain: 'ilpost.it', url: 'https://www.ilpost.it', cat: 'italiani', color: '#0284c7' },
      { name: 'La Gazzetta dello Sport', domain: 'gazzetta.it', url: 'https://www.gazzetta.it', cat: 'italiani', color: '#e11d48' },

      // ECONOMICI
      { name: 'Il Sole 24 Ore', domain: 'ilsole24ore.com', url: 'https://www.ilsole24ore.com', cat: 'economici', color: '#c2410c' },
      { name: 'Milano Finanza', domain: 'milanofinanza.it', url: 'https://www.milanofinanza.it', cat: 'economici', color: '#0f766e' },
      { name: 'ItaliaOggi', domain: 'italiaoggi.it', url: 'https://www.italiaoggi.it', cat: 'economici', color: '#0369a1' },
      { name: 'Financial Times', domain: 'ft.com', url: 'https://www.ft.com', cat: 'economici', color: '#be185d' },
      { name: 'Wall Street Journal', domain: 'wsj.com', url: 'https://www.wsj.com', cat: 'economici', color: '#1e293b' },
      { name: 'Bloomberg', domain: 'bloomberg.com', url: 'https://www.bloomberg.com', cat: 'economici', color: '#111827' },
      { name: 'The Economist', domain: 'economist.com', url: 'https://www.economist.com', cat: 'economici', color: '#dc2626' },

      // ESTERI
      { name: 'The New York Times', domain: 'nytimes.com', url: 'https://www.nytimes.com', cat: 'esteri', color: '#0f172a' },
      { name: 'The Washington Post', domain: 'washingtonpost.com', url: 'https://www.washingtonpost.com', cat: 'esteri', color: '#1e293b' },
      { name: 'Le Monde', domain: 'lemonde.fr', url: 'https://www.lemonde.fr', cat: 'esteri', color: '#0284c7' },
      { name: 'Le Figaro', domain: 'lefigaro.fr', url: 'https://www.lefigaro.fr', cat: 'esteri', color: '#1d4ed8' },
      { name: 'El País', domain: 'elpais.com', url: 'https://elpais.com', cat: 'esteri', color: '#0369a1' },
      { name: 'The Guardian', domain: 'theguardian.com', url: 'https://www.theguardian.com', cat: 'esteri', color: '#052962' },
      { name: 'BBC News', domain: 'bbc.com', url: 'https://www.bbc.com/news', cat: 'esteri', color: '#b91c1c' },
      { name: 'Politico Europe', domain: 'politico.eu', url: 'https://www.politico.eu', cat: 'esteri', color: '#dc2626' }
    ];

    let activeFilter = 'all';
    let currentSite = null;
    let strokes = [];

    let baseWidth = 1280;
    let baseHeight = 2400;
    let fitScale = 1;
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isDrawMode = false;
    let currentColor = 'rgba(255, 238, 0, 0.55)';

    const ledwallStage = document.getElementById('ledwallStage');
    const wallGrid = document.getElementById('wallGrid');
    const headerSubtitle = document.getElementById('headerSubtitle');
    const viewerOverlay = document.getElementById('viewerOverlay');
    const snapshotLoader = document.getElementById('snapshotLoader');
    const loaderTitle = document.getElementById('loaderTitle');
    const pdfSurface = document.getElementById('pdfSurface');
    const zoomLayer = document.getElementById('zoomLayer');
    const activeImage = document.getElementById('activeImage');
    const drawCanvas = document.getElementById('drawCanvas');
    const btnOpenExternal = document.getElementById('btnOpenExternal');
    const ctx = drawCanvas.getContext('2d');

    const toggleClean = () => document.body.classList.toggle('on-air-clean');
    document.getElementById('btnToggleClean').addEventListener('click', toggleClean);
    document.getElementById('brandLogo').addEventListener('dblclick', toggleClean);

    ledwallStage.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();
        ledwallStage.scrollLeft += e.deltaY;
      }
    }, { passive: false });

    document.querySelectorAll('.filter-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        ledwallStage.scrollLeft = 0;
        renderGrid();
      });
    });

    function getLogoUrl(domain) {
      return `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
    }

    function renderGrid() {
      wallGrid.innerHTML = '';
      const list = activeFilter === 'all'
        ? NEWSPAPER_SITES
        : NEWSPAPER_SITES.filter(s => s.cat === activeFilter);

      list.forEach(site => {
        const card = document.createElement('div');
        card.className = 'site-card';
        card.style.setProperty('--accent-color', site.color);

        const catLabel = site.cat === 'italiani' ? 'Quotidiano Italiano'
          : site.cat === 'economici' ? 'Economia & Finanza'
          : 'Stampa Estera';

        card.innerHTML = `
          <div class="site-logo-wrap">
            <img src="${getLogoUrl(site.domain)}" alt="${site.name}" loading="lazy" />
          </div>
          <div class="site-name">${site.name}</div>
          <span class="site-cat-tag">${catLabel}</span>
        `;

        card.addEventListener('click', () => openSiteSnapshot(site));
        wallGrid.appendChild(card);
      });
    }

    // URL motori di screenshot live (full page desktop)
    function getPrimaryScreenshotUrl(targetUrl) {
      return `https://api.microlink.io/?url=${encodeURIComponent(targetUrl)}&screenshot=true&meta=false&embed=screenshot.url&viewport.width=1280&viewport.height=2200&screenshot.fullPage=true`;
    }

    function getFallbackScreenshotUrl(targetUrl) {
      return `https://s0.wp.com/mshots/v1/${encodeURIComponent(targetUrl)}?w=1280&h=2200`;
    }

    function computeFitTransform() {
      const surfW = pdfSurface.clientWidth;
      const surfH = pdfSurface.clientHeight;
      // Adatta la larghezza della homepage allo schermo (così i titoli sono subito leggibili)
      fitScale = Math.min((surfW - 32) / baseWidth, 1);
      const x = (surfW - baseWidth * fitScale) / 2;
      const y = 14;
      return { s: fitScale, x, y };
    }

    function applyTransform() {
      zoomLayer.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${scale})`;
      const pct = Math.round((scale / fitScale) * 100);
      document.getElementById('btnZoomReset').textContent = pct + '%';
    }

    function openSiteSnapshot(site) {
      currentSite = site;
      strokes = [];
      headerSubtitle.textContent = site.name;
      btnOpenExternal.href = site.url;

      snapshotLoader.style.display = 'flex';
      loaderTitle.textContent = `Cattura homepage ${site.name}...`;
      zoomLayer.style.visibility = 'hidden';

      viewerOverlay.classList.add('active');
      requestAnimationFrame(() => viewerOverlay.classList.add('visible'));

      let triedFallback = false;

      activeImage.onload = () => {
        baseWidth = activeImage.naturalWidth || 1280;
        baseHeight = activeImage.naturalHeight || 2200;
        activeImage.style.width = baseWidth + 'px';
        activeImage.style.height = baseHeight + 'px';
        drawCanvas.width = baseWidth;
        drawCanvas.height = baseHeight;
        redrawStrokes();

        const initT = computeFitTransform();
        scale = initT.s;
        panX = initT.x;
        panY = initT.y;
        applyTransform();

        snapshotLoader.style.display = 'none';
        zoomLayer.style.visibility = 'visible';
      };

      activeImage.onerror = () => {
        if (!triedFallback) {
          triedFallback = true;
          activeImage.src = getFallbackScreenshotUrl(site.url);
        } else {
          snapshotLoader.innerHTML = `
            <div style="font-weight:700; color:#b91c1c; font-size:15px;">Anteprima non disponibile al momento</div>
            <a href="${site.url}" target="_blank" rel="noopener" style="margin-top:8px; background:#0b3d75; color:#fff; padding:9px 18px; border-radius:6px; text-decoration:none; font-weight:700;">Apri ${site.name} ↗</a>
          `;
        }
      };

      activeImage.src = getPrimaryScreenshotUrl(site.url);
    }

    function closeViewer() {
      if (isDrawMode) {
        isDrawMode = false;
        btnDrawToggle.classList.remove('active-tool');
        pdfSurface.classList.remove('draw-mode');
      }
      viewerOverlay.classList.remove('visible');
      setTimeout(() => {
        viewerOverlay.classList.remove('active');
        activeImage.src = '';
        strokes = [];
        headerSubtitle.textContent = 'Quotidiani Online';
        currentSite = null;
        // Ripristina loader standard
        snapshotLoader.innerHTML = `
          <div class="spinner"></div>
          <div style="font-weight:700; color:#0b3d75; font-size:15px;" id="loaderTitle">Cattura homepage in tempo reale...</div>
          <div style="font-size:12px; color:#52637a;">Generazione anteprima grafica ad alta risoluzione</div>
        `;
      }, 260);
    }

    document.getElementById('btnBack').addEventListener('click', closeViewer);

    // ZOOM & SPOSTAMENTO LIBERO COME UN PDF
    function resetZoom(animate = true) {
      const targetT = computeFitTransform();
      zoomLayer.style.transition = animate ? 'transform 0.24s ease-out' : 'none';
      scale = targetT.s;
      panX = targetT.x;
      panY = targetT.y;
      applyTransform();
      if (animate) {
        setTimeout(() => { zoomLayer.style.transition = 'none'; }, 250);
      }
    }

    function zoomBy(factor, centerX, centerY) {
      const minScale = fitScale * 0.45;
      const maxScale = fitScale * 5.0;
      const oldScale = scale;
      const newScale = Math.min(maxScale, Math.max(minScale, oldScale * factor));
      if (newScale === oldScale) return;

      const rect = pdfSurface.getBoundingClientRect();
      const cx = (centerX !== undefined ? centerX - rect.left : rect.width / 2);
      const cy = (centerY !== undefined ? centerY - rect.top : rect.height / 2);

      panX = cx - (cx - panX) * (newScale / oldScale);
      panY = cy - (cy - panY) * (newScale / oldScale);
      scale = newScale;
      applyTransform();
    }

    document.getElementById('btnZoomIn').addEventListener('click', () => zoomBy(1.35));
    document.getElementById('btnZoomOut').addEventListener('click', () => zoomBy(1 / 1.35));
    document.getElementById('btnZoomReset').addEventListener('click', () => resetZoom(true));

    pdfSurface.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) {
        const factor = e.deltaY < 0 ? 1.14 : 1 / 1.14;
        zoomBy(factor, e.clientX, e.clientY);
      } else {
        // Scorrimento verticale/orizzontale fluido della homepage con rotellina/trackpad
        panX -= e.deltaX;
        panY -= e.deltaY;
        applyTransform();
      }
    }, { passive: false });

    // GESTURE TOUCH & MOUSE (TRASCINAMENTO LIBERO + PINCH-TO-ZOOM)
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initialPinchDist = 0;
    let initialPinchScale = 1;

    pdfSurface.addEventListener('touchstart', (e) => {
      if (isDrawMode) return;
      if (e.touches.length === 2) {
        isDragging = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        initialPinchDist = Math.hypot(dx, dy);
        initialPinchScale = scale;
      } else if (e.touches.length === 1) {
        isDragging = true;
        dragStartX = e.touches[0].clientX - panX;
        dragStartY = e.touches[0].clientY - panY;
      }
    }, { passive: true });

    pdfSurface.addEventListener('touchmove', (e) => {
      if (isDrawMode) return;
      if (e.touches.length === 2 && initialPinchDist > 0) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const targetScale = initialPinchScale * (dist / initialPinchDist);
        zoomBy(targetScale / scale, midX, midY);
      } else if (e.touches.length === 1 && isDragging) {
        e.preventDefault();
        panX = e.touches[0].clientX - dragStartX;
        panY = e.touches[0].clientY - dragStartY;
        applyTransform();
      }
    }, { passive: false });

    pdfSurface.addEventListener('touchend', () => {
      isDragging = false;
      initialPinchDist = 0;
    });

    pdfSurface.addEventListener('mousedown', (e) => {
      if (isDrawMode) return;
      isDragging = true;
      dragStartX = e.clientX - panX;
      dragStartY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging || isDrawMode) return;
      panX = e.clientX - dragStartX;
      panY = e.clientY - dragStartY;
      applyTransform();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // EVIDENZIATORE ANCORATO ALLA PAGINA (SI MUOVE CON ESSA)
    const btnDrawToggle = document.getElementById('btnDrawToggle');
    btnDrawToggle.addEventListener('click', () => {
      isDrawMode = !isDrawMode;
      btnDrawToggle.classList.toggle('active-tool', isDrawMode);
      pdfSurface.classList.toggle('draw-mode', isDrawMode);
    });

    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
        dot.classList.add('selected');
        currentColor = dot.dataset.color;
        if (!isDrawMode) btnDrawToggle.click();
      });
    });

    document.getElementById('btnClearMarks').addEventListener('click', () => {
      strokes = [];
      redrawStrokes();
    });

    let activeStroke = null;

    function getCanvasCoords(clientX, clientY) {
      const rect = drawCanvas.getBoundingClientRect();
      const x = ((clientX - rect.left) / rect.width) * drawCanvas.width;
      const y = ((clientY - rect.top) / rect.height) * drawCanvas.height;
      return { x, y };
    }

    function startStroke(clientX, clientY) {
      if (!isDrawMode) return;
      const pt = getCanvasCoords(clientX, clientY);
      const brushSize = Math.max(22, drawCanvas.width * 0.022);
      activeStroke = { color: currentColor, size: brushSize, points: [pt] };
      strokes.push(activeStroke);
      redrawStrokes();
    }

    function moveStroke(clientX, clientY) {
      if (!activeStroke) return;
      activeStroke.points.push(getCanvasCoords(clientX, clientY));
      redrawStrokes();
    }

    function endStroke() {
      activeStroke = null;
    }

    drawCanvas.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      drawCanvas.setPointerCapture(e.pointerId);
      startStroke(e.clientX, e.clientY);
    });

    drawCanvas.addEventListener('pointermove', (e) => {
      if (!activeStroke) return;
      e.stopPropagation();
      moveStroke(e.clientX, e.clientY);
    });

    drawCanvas.addEventListener('pointerup', endStroke);
    drawCanvas.addEventListener('pointercancel', endStroke);

    function redrawStrokes() {
      ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      strokes.forEach(s => {
        if (!s.points.length) return;
        ctx.save();
        ctx.strokeStyle = s.color;
        ctx.lineWidth = s.size;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(s.points[0].x, s.points[0].y);
        for (let i = 1; i < s.points.length; i++) {
          ctx.lineTo(s.points[i].x, s.points[i].y);
        }
        if (s.points.length === 1) {
          ctx.lineTo(s.points[0].x + 0.1, s.points[0].y);
        }
        ctx.stroke();
        ctx.restore();
      });
    }

    window.addEventListener('resize', () => {
      if (viewerOverlay.classList.contains('active')) resetZoom(false);
    });

    renderGrid();
  </script>
</body>
</html>
